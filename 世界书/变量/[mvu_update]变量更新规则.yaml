---
# 类型定义区
types:
  RealmName: &RealmName "境界: string; #大境界+小境界,如:练气初期"
  elements: &elements "五行: '金'|'木'|'水'|'火'|'土'|'阴'|'阳'|'混沌';"
  quality: &quality "品质: '凡'|'黄'|'玄'|'地'|'天';"
  label: &label '标签: string[]; #如 ["命中:4", "攻击力:450000"]；参考*RULE_标签映射规则'
  utility: &utility "效果?: { [效果名: string]: string }; #参考*RULE_效果加值指导"
  cost: &cost "消耗?: string; #'灵气|气血|精血: num',如 '灵气: 5';无消耗则省略此字段"
  location: &location |-
    {
      世界: '凡界'|'灵界'|'仙界'; #realm
      地域: string; #region
      具体地点: string; #格式:${生态}-${?宗门|秘境|城市}-${具体位置}
    }
  time: &time |-
    {
      年: number; #修仙历xxxx年
      月: number;
      日: number;
      时辰: string; #如:子时
    }

变量更新规则:

  姓名:
    type: string
  寿元: &age
    type: |-
      {
        年龄:  number;
        寿命:  number;
        外观年龄: number;
      }
  种族: &race
    type: string #如人族、龙族等,妖族需注明物种,如狐妖、猫妖
  身份: &status
    type: string[] # 散修,或宗门+地位如:北辰学宫内门弟子、镇魔司缉魔使;可多个
    check:
      - 加入/离开宗门、职位晋升、身份揭露或重大身份变动时更新
  灵根: &root
    type: |-
      {
        名称: string; # 格式: {品阶描述}{五行列表}[灵根],如"金木水火四灵根"、"金单灵根"、"雷灵根"(变异)
        五行: ('金'|'木'|'水'|'火'|'土'|'阴'|'阳'|'混沌'|'未知'|'无')[]; // 长度1~5;['无']/['未知']为特殊状态
        品阶: '无灵根' | '未检测' | '单灵根' | '双灵根' | '三灵根' | '四灵根' | '五灵根';
      }
    check:
      - 五行列表需与名称中的五行描述一致,如"金木双灵根"→['金','木'],"金单灵根"→['金']
      - 特殊情况:"无灵根"→['无'],"未检测"→['未知'],变异灵根(如雷灵根)→['火'](参考灵根变异设定)
      - 仅在灵根检测、服用神药等重大剧情时更新
  体质: &body
    type: |-
      {
        名称: string;
        *utility
        悟性: number;
        根骨: number;
        气感: number;
        元阴?: boolean;  # 仅女性:处女→true,非处女→false
        元阳?: boolean;  # 仅男性:处男→true,非处男→false
      }
    check:
      - 仅血脉提升、服用神药、重塑道基、夺舍等重大剧情时更新
      - 体质为先天属性,与境界无关
  修炼进度: &realmDetails
    type: |-
      {
        *RealmName
        当前进度: number;
        进度上限: number; #进阶所需修为
        天谴: number;
        丹毒: number;
      }
  技艺: &skill
    type: |-
      {
        生产类: {
          炼器: number;
          驯兽: number;
          培育: number;
          医术: number;
          炼丹: number;
          制符: number;
        };
        战斗类: {
          御物: number;
          咒法: number;
          幻术: number;
          阵法: number;
          神识: number;
          炼体: number;
        };
      }
    check:
      - 仅在对应规则明确结算技艺增长时更新;不得随普通叙事增减
  资源池: &resource_pool
    气血.现值:
      type: number
      check:
        - 气血归零→死亡
        - 不可超过上限
    气血.上限:
      type: number
    灵气.现值:
      type: number
      check:
        - 灵气归零→无法施法
        - 不可超过上限
    灵气.上限:
      type: number
    遁速:
      type: number
  固定资产:
    type: |-
      {
        [资产名: string]: {
          类型: '宗门'|'店铺'|'洞府'; #其他类别不视为资产
          人员规模: number;
          所在地: *location;
          现状: string;
          设施: {
            [设施名: string]: {
              *utility
              每月产出: string; # 无产出写"无"
              上次收取日期: *time | null; #收取后更新为当前时间，从未收取为 null
            }
          };
          分配人物: string[]; # 此地工作/生活者姓名；仅关系列表中出现的重要NPC
        }
      }
    check:
      - 记录<user>名下的资产，变化时更新；宗门类资产仅<user>成为宗主时添加
  历练:
    type: |-
      {
        [事项名称: string]: {
          状态: '进行中'|'待结算'|'待抉择'|'待平息';
          难度?: string;
          进展?: string;
          委托方?: string;
          目标?: string;
          奖励?: string;
          交付?: string;
          截止时间?: *time | null;
          类别?: '剧情'|'委托';
          阶段?: string; # 剧情独立精确阶段
          推进线索?: string; # 面向玩家的当前行动提示
          幕次?: string;
          局势?: string;
          契机?: string;
          焦点?: string;
          牵涉?: string;
          紧迫?: string;
          触发时间?: *time | null;
        }
      }
    check:
      - 仅记录明确委托和当前生效剧情世界书指定的剧情；普通奇遇、险境与日常互动不建卡。
      - 已有历练使用末级字段定向更新，不得以残缺对象覆盖整条；事件根对象不得清空其他线进度或已完成历史。同名事项不另立副卡；剧情类别固定为“剧情”。
      - 根据当前剧情、已发生正文和玩家真实行动同步进展；面板不输出的探索轮仍可更新真实状态，不必逐字照抄预设文案。
      - 每轮至多处理一个剧情节点，玩家回应与收束也占一轮；未作选择、未取得奖励时不得提前推进或发奖。
      - 委托目标达成记为“待结算”，剧情待玩家决断记为“待抉择”；实际交付或剧情结束后移除条目，奖励只发放一次。失败、放弃或到期的委托同样移除。
  地点:
    type: *location
    check:
      - 空间变换时更新
  时间:
    type: *time
  状态效果: &buff
    type: |-
      {
        [效果名称: string]: {
          类型: '增益'|'减益'|'特殊';
          *utility
          层数: number;
          剩余时间: string;
          来源: string;
        }
      }
    check:
      - 详见<rule ref="状态规则"/>
  事件:
    type: |-
      {
        聚焦模式: '自动'|'手动'|'暂停';
        开启: boolean;
        标题: string;
        阶段: string;
        已完成事件: string[];
        进度?: { [进度名: string]: unknown };
      }
    check:
      - 允许多条大型剧情同时开启，各自保存在同名历练；事件标题与阶段只是本轮聚焦指针，阶段必须与同名历练.阶段完全相同（变量结构同步模型明确写出的合法阶段，不要求重复写两遍），禁止另写“试炼通过”等自然语言小节名；各线阶段保存于历练[剧情名].阶段。推进线索保存于历练[剧情名].推进线索，用一两句提示已知的下一步行动或等待条件，不复述全文、不透露隐藏条件、奖励或结局；开线、实际进展、阶段变化时更新，未变化不重写。
      - 聚焦模式由玩家控制：自动即自由模式，按玩家本轮行动与所在场景选择一条线，也允许开启符合条件的新线；手动优先指定剧情但不绕过境界等条件；暂停即无剧情模式，禁止南疆长线与日常推进。AI不得改写模式。
      - 切换聚焦或开启新剧情不得删除其他剧情、重置阶段、重复发奖；一轮最多推进一个关键节点。普通探索可记录真实进展，不能借此结算未聚焦剧情的分支。
      - 剧情面板与变量记录是两件事：关键节点按条目在正文输出 task_info；专属开局首幕由确认页展示，其余节点不得以已有历练或世界书示例为由省略正文面板。
      - 开线时同名历练写入精确阶段、进展与推进线索，自动模式同步事件标题、阶段、开启；手动模式仅在当前标题是本线时同步聚焦索引，其他新线仅保存自身历练与进度，不覆盖玩家手动标题。无面板探索轮仍更新真实进展与线索，玩家行动改变当前目标时不得只改地点而留下旧线索；梦茧的五毒与分支信息仅存事件.进度.梦茧，其他线使用各自名称。
      - 仅按当前生效剧情世界书及玩家真实行动更新，不得自创事件；阶段值必须精确使用条目给出的名称，不能自由命名或跳幕。
      - 停笔等待眼前交互时在事件.进度[剧情名].待回应记 true；玩家实际回应并处理完本节点后才改 false。待回应只记录本线尚未处理的交互，不是其他剧情的总锁。玩家转向其他场景时允许切换；未来境界、地点或材料不满足时保留阶段并让位。紧急危机只能按本条目已明确的离场后果处理，不得因切换自动判失败或死亡。对话非空或出现面板不能作为完成证据。
      - 剧情结束或明确中断后记录已完成事件，移除对应历练及本事件进度；仅当标题仍为本事件时清空标题、阶段并关闭聚焦。保留聚焦模式及其他剧情，不因切换归档。
      - 五毒教日常只在进度.五毒教日常保存名称和待回应状态，不占用长线事件标题；实际回应收束或明确离场中断后归档并移除此待回应记录。
      - 自由模式根据本轮行动与条件接续剧情，不凭旧标题自动续演；手动模式优先指定线，其他线可首次登场但不能改掉手动聚焦。无剧情模式禁止南疆长线与日常的触发和推进。切换不改变其他线阶段、分支和奖励。
      - 专属开局由初始化写入首幕历练和既定物品，确认页已展示首幕卡；不重复发放物品或要求正文重出首幕卡。后续关键节点仍按世界书输出 task_info。普通剧情不能冒用专属开局资格。
