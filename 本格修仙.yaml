                  ## 格式说明
                  - 每个一级标题格式为：{年}-{月}-{日} | {完整地点路径}，需用"---"分隔
                  - 日期和地点用" | "分隔
                  - 地点路径用"-"连接各段
                  - 时间和事件内容缩进2个空格
                  - 地点移动在事件描述中说明，或在地点路径中用"→"标注

                  ## 时间表达规则
                  - 单一时间点：{时}:{分}（如：13:30）
                  - 连续时间段：{起始时}:{起始分}到{结束时}:{结束分}（如：13:30到15:00）
                  - 同一地点下，事件连贯的，合并为时间段

                  ## 叙述要求
                  - 以精炼的叙事语言重新组织，比原始记录更加紧凑
                  - 重大事件（关键战斗、重要决策、转折点）保留更多细节
                  - 日常过渡性事件可进一步压缩
                  - 信息变动、关系变动合并同类项
                  - 关键对话用引号保留
                  - 客观陈述，不加评价
                  - 仅记录/整合已有的信息，禁止添加原文未提及的任何内容

                  ## 格式规范
                  - 地点：完整路径用"-"分隔，移动用"→"
                  - 数值：用"±X"表示变化
                  - 缩进：统一2个空格
                  </mega_summary_rules>
