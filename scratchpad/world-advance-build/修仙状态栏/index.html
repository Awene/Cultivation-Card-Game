const timePeriodAliases = {

  子夜: "子",
  午夜: "子",
  鸡鸣: "丑",

function normalizeTimePeriod(input) {
  const text = String(input ?? "").normalize("NFKC").replace(/\s/g, "");
  const period = timePeriods.find(item => text === item || [ "时", "初", "正", "刻", "中", "末", "半" ].some(suffix => text.includes(`${item}${suffix}`)));
  if (period) return `${period}时`;
  const clock = text.match(/^(凌晨|清晨|早上|上午|中午|下午|傍晚|晚上|晚间|夜间)?(\d{1,2}|[零〇一二两三四五六七八九十]+)(?:点|时|:)(?:(\d{1,2})分?|半|整)?$/);
  if (clock) {
    let hour = parseCalendarNumber(clock[2]);
    if (clock[3] && Number(clock[3]) > 59) return undefined;
    if (hour < 0 || hour > 23) return undefined;
    if (/下午|傍晚|晚上|晚间|夜间/.test(clock[1] ?? "") && hour < 12) hour += 12;
    if (/晚上|晚间|夜间/.test(clock[1] ?? "") && hour === 12) hour = 0;
    if (/凌晨|上午|早上/.test(clock[1] ?? "") && hour === 12) hour = 0;
    if (clock[1] === "中午" && hour < 11) hour += 12;
    return `${timePeriods[Math.floor((hour + 1) / 2) % 12]}时`;
  }
  const alias = Object.entries(timePeriodAliases).find(([name]) => text.includes(name));
  if (alias) return `${alias[1]}时`;
  const vague = {
    凌晨: "丑",
    清晨: "卯",
    早: "卯",
    早上: "卯",
    上午: "巳",
    中午: "午",
    白天: "午",
    日间: "午",
    下午: "申",
    傍晚: "酉",
    晚: "戌",
    晚间: "戌",
    晚上: "戌",
    夜间: "戌",
    深夜: "亥"
  };
  return vague[text] ? `${vague[text]}时` : undefined;
}

function parseCalendarNumber(input) {
  if (typeof input === "number") return Number.isFinite(input) ? Math.trunc(input) : NaN;
  let text = String(input ?? "").normalize("NFKC").trim().replace(/[年月日号]$/, "").replace(/^初/, "");
  text = {
    正: "一",
    冬: "十一",
    腊: "十二",
    臘: "十二"
  }[text] ?? text;
  if (/^\d+$/.test(text)) return Number(text);
  const digits = "零一二三四五六七八九";
  text = text.replace(/〇/g, "零").replace(/两/g, "二").replace(/廿/g, "二十").replace(/卅/g, "三十");
  if (!/^[零一二三四五六七八九十百千万]+$/.test(text)) return NaN;
  if (!/[十百千万]/.test(text)) return Number([ ...text ].map(c => digits.indexOf(c)).join(""));
  let total = 0, section = 0, n = 0;
  for (const c of text) {
    const digit = digits.indexOf(c);
    if (digit >= 0) n = digit; else if (c === "万") {
      total += (section + n) * 1e4;
      section = 0;
      n = 0;
    } else {
      section += (n || 1) * {
        十: 10,
        百: 100,
        千: 1e3
      }[c];
      n = 0;
    }
  }
  return total + section + n;
}

function migrateRumorEntries(value) {
  if (value == null) return {};
  if (typeof value !== "object") return value;
  const array = Array.isArray(value);
  const result = Object.create(null);
  for (const [key, raw] of Object.entries(value)) {
    if (!raw || typeof raw !== "object") {
      result[key] = raw;
      continue;
    }
    const item = raw;
    const content = String(item.内容 ?? "");
    const base = array ? String(item.标题 || content.split(/[，。；\n]/)[0].slice(0, 24) || item.类别 || "旧传闻" + key) : key;
    let title = base, suffix = 2;
    while (Object.hasOwn(result, title)) title = base + "（" + suffix++ + "）";
    const location = String(item.地点 || [ item.世界, item.地域 ].filter(Boolean).join("·"));
    const category = item.类别 === "通缉魔修" ? "通缉逃犯" : item.类别 === "灵植奇遇" ? "素材奇遇" : item.类别;
    result[title] = {
      类别: category ?? "",
      内容: location && !content.includes(location) ? location + "：" + content : content,
      难度: item.难度 ?? item.境界 ?? "待查"
    };
  }
  return result;
}

  const reader = new FileReader;
  reader.onload = () => {
    const img = new Image;
    img.onload = () => {
      const ratio = Math.min(maxSize / img.width, maxSize / img.height, 1);
      const w = Math.max(1, Math.round(img.width * ratio));
      const h = Math.max(1, Math.round(img.height * ratio));
      const canvas = document.createElement("canvas");
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext("2d");
      if (!ctx) return reject(new Error("canvas context unavailable"));
      ctx.drawImage(img, 0, 0, w, h);
      resolve(canvas.toDataURL("image/jpeg", quality));
    };
    img.onerror = () => reject(new Error("image decode failed"));
    img.src = reader.result;
  };
  reader.onerror = () => reject(new Error("file read failed"));
  reader.readAsDataURL(file);
});

function charWorldbookNames() {
  if (typeof getCharWorldbookNames !== "function") return [];
  const bound = getCharWorldbookNames("current");
  return [ bound.primary, ...bound.additional ].filter(n => typeof n === "string" && n.length > 0);
}

async function applyWorldbook(mode) {
  if (typeof getWorldbook !== "function" || typeof updateWorldbookWith !== "function") {
    return 0;
  }
  let changed = 0;
  for (const wbName of charWorldbookNames()) {
    let entries;
    try {
      entries = await getWorldbook(wbName);
    } catch {
      continue;
    }
    const hits = entries.filter(e => WORLDBOOK_ENABLED[e.name] !== undefined);
    if (hits.length === 0) continue;
    const needWrite = hits.some(e => e.enabled !== WORLDBOOK_ENABLED[e.name][mode]);
    if (!needWrite) {
      changed += hits.length;
      continue;
    }
    await updateWorldbookWith(wbName, wb => wb.map(e => WORLDBOOK_ENABLED[e.name] !== undefined ? {
      ...e,
      enabled: WORLDBOOK_ENABLED[e.name][mode]

  return changed;
}

async function applyPreset(mode) {
  if (typeof getPreset !== "function" || typeof updatePresetWith !== "function") {
    return 0;
  }
  let preset;
  try {
    preset = getPreset("in_use");
  } catch {
    return 0;
  }
  const hits = (preset.prompts ?? []).filter(p => PRESET_ENABLED[p.name] !== undefined);
  if (hits.length === 0) return 0;
  await updatePresetWith("in_use", p => {
    p.prompts.forEach(prompt => {
      const table = PRESET_ENABLED[prompt.name];
      if (table !== undefined) prompt.enabled = table[mode];
    });
    return p;
  });
  return hits.length;
}

async function applyApiMode(mode) {
  try {
    const worldbookChanged = await applyWorldbook(mode);
    const presetChanged = await applyPreset(mode);
    return {
      ok: true,
      worldbookChanged,
      presetChanged
    };
  } catch (err) {
    console.error("[apiMode] 应用变量更新模式失败：", err);
    return {
      ok: false,
      worldbookChanged: 0,
      presetChanged: 0,
      reason: err instanceof Error ? err.message : String(err)
    };
  }
}

async function getApiMode() {
  if (typeof getWorldbook === "function") {
    for (const wbName of charWorldbookNames()) {
      let entries;
      try {
        entries = await getWorldbook(wbName);
      } catch {
        continue;
      }
      const probe = entries.find(e => e.name === WORLDBOOK_PROBE);
      if (probe) return probe.enabled ? "额外API" : "随主API";
    }
  }
  if (typeof getPreset === "function") {
    try {
      const preset = getPreset("in_use");
      const p = (preset.prompts ?? []).find(x => x.name === PRESET_PROBE);
      if (p) return p.enabled ? "额外API" : "随主API";
    } catch {}
  }
  return "额外API";
}

const _mvu_update_raw_namespaceObject = "---\r\n# 类型定义区\r\ntypes:\r\n  RealmName: &RealmName \"境界: string; #大境界+小境界,如:练气初期\"\r\n  elements: &elements \"五行: '金'|'木'|'水'|'火'|'土'|'阴'|'阳'|'混沌';\"\r\n  quality: &quality \"品质: '凡'|'黄'|'玄'|'地'|'天';\"\r\n  label: &label \"标签: string[]; #参考*RULE_标签加值指导\"\r\n  utility: &utility \"效果?: { [效果名: string]: string }; #参考*RULE_效果加值指导\"\r\n  cost: &cost \"消耗?: string; #'灵气|气血|精血: num',如 '灵气: 5';无消耗则省略此字段\"\r\n  location: &location |-\r\n    {\r\n      世界: '凡界'|'灵界'|'仙界'; #realm\r\n      地域: string; #region\r\n      具体地点: string; #格式:${生态}-${?宗门|秘境|城市}-${具体位置}\r\n    }\r\n  time: &time |-\r\n    {\r\n      年: number; #修仙历xxxx年\r\n      月: number;\r\n      日: number;\r\n      时辰: string; #如:子时\r\n    }\r\n\r\n变量更新规则:\r\n\r\n  姓名:\r\n    type: string\r\n  寿元: &age\r\n    type: |-\r\n      {\r\n        年龄:  number;\r\n        寿命:  number;\r\n        外观年龄: number;\r\n      }\r\n  种族: &race\r\n    type: string #如人族、龙族等,妖族需注明物种,如狐妖、猫妖\r\n  身份: &status\r\n    type: string[] # 散修,或宗门+地位如:北辰学宫内门弟子、镇魔司缉魔使;可多个\r\n    check:\r\n      - 加入/离开宗门、职位晋升、身份揭露或重大身份变动时更新\r\n  灵根: &root\r\n    type: |-\r\n      {\r\n        名称: string; # 格式: {品阶描述}{五行列表}[灵根],如\"金木水火四灵根\"、\"金单灵根\"、\"雷灵根\"(变异)\r\n        五行: ('金'|'木'|'水'|'火'|'土'|'阴'|'阳'|'混沌'|'未知'|'无')[]; // 长度1~5;['无']/['未知']为特殊状态\r\n        品阶: '无灵根' | '未检测' | '单灵根' | '双灵根' | '三灵根' | '四灵根' | '五灵根';\r\n      }\r\n    check:\r\n      - 五行列表需与名称中的五行描述一致,如\"金木双灵根\"→['金','木'],\"金单灵根\"→['金']\r\n      - 特殊情况:\"无灵根\"→['无'],\"未检测\"→['未知'],变异灵根(如雷灵根)→['火'](参考灵根变异设定)\r\n      - 仅在灵根检测、服用神药等重大剧情时更新\r\n  体质: &body\r\n    type: |-\r\n      {\r\n        名称: string;\r\n        *utility\r\n        悟性: number;\r\n        根骨: number;\r\n        气感: number;\r\n        元阴?: boolean;  # 仅女性:处女→true,非处女→false\r\n        元阳?: boolean;  # 仅男性:处男→true,非处男→false\r\n      }\r\n    check:\r\n      - 仅血脉提升、服用神药、重塑道基、夺舍等重大剧情时更新\r\n      - 体质为先天属性,与境界无关\r\n  修炼进度: &realmDetails\r\n    type: |-\r\n      {\r\n        *RealmName\r\n        当前进度: number;\r\n        进度上限: number; #进阶下一级所需的修为\r\n        天谴: number;\r\n        丹毒: number;\r\n      }\r\n  技艺: &skill\r\n    type: |-\r\n      {\r\n        生产类: {\r\n          炼器: number;\r\n          驯兽: number;\r\n          培育: number;\r\n          医术: number;\r\n          炼丹: number;\r\n          制符: number;\r\n        };\r\n        战斗类: {\r\n          御物: number;\r\n          咒法: number;\r\n          幻术: number;\r\n          阵法: number;\r\n          神识: number;\r\n          炼体: number;\r\n        };\r\n      }\r\n    check:\r\n      - 技艺为持续累积的非负数值\r\n      - 仅在对应规则明确结算技艺增长时更新;不得随普通叙事增减\r\n  资源池: &resource_pool\r\n    气血.现值:\r\n      type: number\r\n      check:\r\n        - 归零判定:气血归零→死亡\r\n        - 任何恢复不可超过上限\r\n    气血.上限:\r\n      type: number\r\n    灵气.现值:\r\n      type: number\r\n      check:\r\n        - 归零判定:灵气归零→无法施法\r\n        - 任何恢复不可超过上限\r\n    灵气.上限:\r\n      type: number\r\n    遁速:\r\n      type: number\r\n  固定资产:\r\n    type: |-\r\n      {\r\n        [资产名: string]: {\r\n          类型: '宗门'|'店铺'|'洞府'; #其他类别不视为资产\r\n          人员规模: number;\r\n          所在地: *location;\r\n          现状: string;\r\n          设施: {\r\n            [设施名: string]: {\r\n              *utility\r\n              每月产出: string; # 无产出写\"无\"\r\n              上次收取日期: *time | null; #收取后更新为当前时间，从未收取为 null\r\n            }\r\n          };\r\n          分配人物: string[]; # 此地工作/生活者姓名；仅关系列表中出现的重要NPC\r\n        }\r\n      }\r\n    check:\r\n      - 记录<user>名下的资产，变化时更新；宗门类资产仅<user>成为宗主时添加\r\n  任务:\r\n    type: |-\r\n      {\r\n        [任务名: string]: {\r\n          状态: '进行中'|'待结算';\r\n          委托方: string;\r\n          难度: string; # 以境界表示（如：炼气初期）\r\n          目标: string; # 简述完成条件\r\n          进展: string; # 记录已经发生的关键进展\r\n          奖励: string;\r\n          交付: string; # 领取奖励方式\r\n          截止时间: *time | null; # 无期限为 null\r\n        }\r\n      }\r\n    check:\r\n      - 仅在<user>明确接取、或剧情明确强制赋予任务时添加；\r\n      - 达成目标后将状态改为待结算；实际完成交付并获得奖励后移除任务，奖励仅发放一次\r\n      - 失败或<user>明确放弃时移除任务；超过截止时间视为失败\r\n  地点:\r\n    type: *location\r\n    check:\r\n      - 空间变换时更新\r\n  时间:\r\n    type: *time\r\n  状态效果: &buff\r\n    type: |-\r\n      {\r\n        [效果名称: string]: {\r\n          类型: '增益'|'减益'|'特殊';\r\n          *utility\r\n          层数: number;\r\n          剩余时间: string;\r\n          来源: string;\r\n        }\r\n      }\r\n    check:\r\n      - 详见<rule ref=\"状态规则\"/>\r\n  事件:\r\n    type: |-\r\n      {\r\n        开启: boolean;\r\n        标题: string;\r\n        阶段: string;\r\n        已完成事件: string[];\r\n        进度?: { [进度名: string]: unknown };\r\n      }\r\n    check:\r\n      - 仅<event>中有明确要求时更新，不得自行杜撰事件\r\n  功法: &cultivation\r\n    type: |-\r\n      {\r\n        [功法名称: string]: {\r\n          使用中: boolean; # 由外部脚本处理,禁止修改\r\n          *quality\r\n          *RealmName\r\n          *elements\r\n          类型: '心法'|'攻击'|'幻术'|'神识'|'咒法'|'身法'|'护体'|'阵法';\r\n          *cost\r\n          *label\r\n          *utility\r\n          描述: string;\r\n        }\r\n      }\r\n    check:\r\n      - 仅在更换功法时更新\r\n  灵石: &cash\r\n    type: number\r\n    check:\r\n      - 默认兑换为下品灵石计算\r\n      - 交易、拾取、消耗时更新数量\r\n  物品: &item\r\n    type: |-\r\n      {\r\n        [物品名: string]: {\r\n          *quality\r\n          *RealmName\r\n          类型: '秘籍'|'配方'|'符箓'|'丹药'|'素材'|'工具';\r\n          *cost\r\n          *elements\r\n          *label\r\n          数量: number;\r\n          *utility\r\n          描述: string;\r\n        }\r\n      }\r\n    check:\r\n      - 交易、拾取、消耗时更新\r\n      - 数量为0时移除该key\r\n      - 严禁把武器/防具/饰品写入物品，它们应写为装备\r\n      - 类型必须是上述枚举之一；无法归类的杂物不写入变量\r\n  装备: &equipment\r\n    type: |-\r\n      {\r\n        [装备名: string]: {\r\n          *quality\r\n          *RealmName\r\n          类型: '法宝'|'护甲'|'饰品';\r\n          *cost\r\n          *elements\r\n          *label  # 法宝→[攻击力:N]、护甲→[防御力:N]\r\n          *utility\r\n          描述: string;\r\n          位置: string; #装备位于身体上的位置,如:上装、下装、饰品、手部、储物袋等\r\n        }\r\n      }\r\n    check:\r\n      - 交易、拾取、消耗、赠送时更新\r\n      - 武器(剑/刀/枪/弓/扇/法器/飞剑等) → 类型='法宝',攻击力为数字\r\n      - 衣物(道袍/护甲/护腕/腰带等) → 类型='护甲',防御力为数字\r\n      - 戒指/项链/玉牌/玉佩/储物袋 → 类型='饰品'\r\n      - 类型必须是上述枚举之一,无法归类的杂物不写入变量\r\n  \"${傀儡|灵兽}\": &combat_unit\r\n    type: |-\r\n      {\r\n        [名称: string]: {\r\n          使用中: boolean; # 由外部脚本处理,禁止修改\r\n          *quality\r\n          *RealmName\r\n          *elements\r\n          *label\r\n          描述: string;\r\n          资源池: *resource_pool\r\n          防御力: number;\r\n          技能: {\r\n            [技能名: string]: {\r\n              攻击力: number;\r\n              *cost\r\n              *utility\r\n            };\r\n          };\r\n        }\r\n      }\r\n    check:\r\n      - 获得/炼制/购买/捕获时添加\r\n      - 损毁/遗失/出售/死亡时移除\r\n  关系列表:\r\n    type: |-\r\n      # 关系列表条目以 类型 区分:'人物'(NPC) / '傀儡' / '灵兽' (后两者代表无主战斗单位,如野生妖兽、遗弃傀儡等)\r\n      {\r\n        [名称: string]:\r\n          # === 类型='人物' (NPC) ===\r\n          | {\r\n              类型: '人物';\r\n              在场: boolean;\r\n              种族: *race\r\n              身份: *status\r\n              修炼进度: *realmDetails\r\n              寿元: *age\r\n              灵根: *root\r\n              体质: *body\r\n              技艺: *skill\r\n              资源池: *resource_pool\r\n              状态效果: *buff\r\n              功法: { [功法名称: string]: *cultivation };\r\n              灵石: *cash\r\n              物品: { [物品名: string]: *item };\r\n              装备: { [装备名: string]: *equipment };\r\n              ${傀儡|灵兽}: { [名称: string]: *combat_unit };\r\n              性格: string;\r\n              外貌: string; # 实质变化时更新\r\n              着装: string; # 更衣时更新\r\n              道侣: boolean; # 是否为<user>的道侣\r\n              好感度: number; # -100~100,变化区间±5,重大事件±10,初始值-30~30\r\n              关系: string; # 与<user>的当前双方关系,一句话描述\r\n            }\r\n          # === 类型='傀儡'|'灵兽' (无主战斗单位) ===\r\n          | {\r\n              类型: '傀儡' | '灵兽';\r\n              在场: boolean;\r\n              *quality\r\n              *RealmName\r\n              *elements\r\n              *label\r\n              描述: string;\r\n              资源池: *resource_pool\r\n              防御力: number;\r\n              技能: {\r\n                [技能名: string]: {\r\n                  攻击力: number;\r\n                  *cost\r\n                  *utility\r\n                };\r\n              };\r\n              状态效果: *buff\r\n              好感度: number;\r\n            }\r\n      }\r\n    check:\r\n      - 类型='人物': 角色出场（有<char_info>面板时）添加,死亡删除\r\n      - 类型='人物'.关系: 新增人物时写入；师承、婚恋、亲属、隶属等双方关系实质变化时更新；不得以好感度或一时情绪代替\r\n      - 类型='傀儡'|'灵兽': 野生妖兽/无主傀儡 出场（有<item_info>面板时）添加\r\n      - 驯服流程: 驯服后从 关系列表 移除并以 *combat_unit 形式写入对应人物名下的 ${傀儡|灵兽} 字段;\r\n      - 化形流程: 化形后 移除 该妖兽/傀儡 并以人物形式写入 关系列表;\r\n<%_ {\r\n  let active = []; try { active = JSON.parse(getvar('路由激活规则') || '[]'); } catch (_) {}\r\n  if (Array.isArray(active) && active.includes('[时间推进规则]')) {\r\n_%>\r\n  传闻:\r\n    type: |-\r\n      {\r\n        上次世界推进时间点: *time | null; # 世界推进完成后，设为当前时间\r\n        条目: {\r\n          [传闻标题: string]: {\r\n            类别: string; # 从 *RULE_传闻类型表 中选择\r\n            内容: string; # 内容用1至3句交代来源、地点和可调查/参与的线索\r\n            难度: string; # 大境界+小境界,如:练气初期\r\n          };\r\n        };\r\n      }\r\n    check:\r\n      - 依照RULE_传闻类型表维护10~15条传闻，按剧情清理失效传闻，再补足条目数量\r\n      - 传闻发生在<user>所在地域，但内容不得围绕<user>经历展开\r\n    # &RULE_传闻类型表:\r\n    # | 类别 | 消息内容与边界 |\r\n    # | --- | --- |\r\n    # | 秘境传闻 | 未知古洞、秘境入口或探索线索；不限于已定义的秘境 |\r\n    # | 高额悬赏 | 公开的护送、搜寻、采集或讨伐委托；说明目标、发布渠道与线索 |\r\n    # | 妖兽异动 | 兽群迁徙、巢穴扩张、凡人受袭等；符合当地生态 |\r\n    # | 通缉逃犯 | 罪行、特征与追捕线索；被通缉者未必是魔修，罪行多样化 |\r\n    # | 宝物现世 | 遗物、奇物、宝藏的踪迹及线索 |\r\n    # | 素材奇遇 | 灵植、矿脉等素材的消息及守护情况 |\r\n    # | 坊市集会 | 交易集会、拍卖、交换会的时间、地点和可参与内容 |\r\n    # | 灵气潮汐 | 局部灵气、五行、天象的变化及观察线索 |\r\n    # | 古迹奇谭 | 古迹传说、碑文、遗址异象与可调查的谜团；不限于已定义的古迹 |\r\n    # | 时空裂缝 | 空间异常、短暂裂隙或疑似异界通道 |\r\n\r\n<%_ } else { _%>\r\n  传闻: # 只读；本轮禁止更新条目及上次世界推进时间点\r\n<%_ } } _%>\r\n";

const Cultivation_Card_Game_raw_namespaceObject = '<rule name="非战斗判定规则">\n# 参数声明：\n  角色L = 角色当前境界系数\n  挑战L = 判定对象/环境对应的推定境界系数\n  Vg = 有效成长基准值 = 10^min(角色L, 挑战L)\n  [Z%] = 相关增减益%\n  [W] = 相关增减值\n\n# 核心触发条件:\n  激活：当<user>在非战斗状态下，试图克服具有不确定性或风险的客观阻碍时（如：破解机关、忍受极寒、勘破幻象、威压交涉等）。\n  略过：当 角色L ≥ 挑战L + 2 时自动成功，不输出计算面板。\n\n# 第一阶段：确定判据\n  依当前情景，判断的唯一的关联三维与唯一的关联技艺，作为判据：\n  | 示例场景 | 关联三维 | 关联技艺(选择其一) |\n  | --- | --- | --- |\n  | 感知异常、精神震慑 | 气感 | 神识 |\n  | 抵抗极端环境 | 根骨 | 炼体 |\n  | 破解非战斗阵法、机关解谜 | 悟性 | 阵法 |\n  | 鉴别物品、学识比拼 | 悟性 | 相关生产技艺 |\n  | 讲价博弈、拷问情报、蛊惑心智 | 气感 | 幻术 / 神识 |\n  | 驯服妖兽 | 气感 | 驯兽 |\n  | 医疗、手术、下毒 | 气感 | 医术 |\n  ....\n\n# 第二阶段：难度推定与公式化\n  1. 难度系数 (C_diff) 设定：\n     简单=0.5 | 寻常=1.0 | 困难=1.5 | 极难=2.0\n  2. 角色能效公式 (A):\n     A = floor( (10^角色L + 关联三维×5 + 关联技艺) × (1+[Z%]) ) + [W]\n  3. 目标难度公式 (D):\n     - 静态判定 (机关/陷阱/环境/无意识阻碍 — 不具备三维的客观对象):\n       D_static = floor(10^挑战L × C_diff) + 10(固定)\n     - 动态对抗 (具备三维的有意识对手 — 修士/妖兽/灵识):\n       D_dynamic = floor( (10^挑战L + 敌关联三维×5 + 敌关联技艺) × (1+[Z%]) ) + [W]\n  4. 差值阈值 (Δ) 与 结果阶层:\n     Δ = A - D\n     - Δ ≥ 10^挑战L × 0.5 : 【大成功】\n     - 0 ≤ Δ < 10^挑战L × 0.5 : 【成功】\n     - -(10^挑战L × 0.5) < Δ < 0 : 【失败】\n     - Δ ≤ -(10^挑战L × 0.5) : 【大失败】\n\n# 第三阶段：技艺实践增长\n  1. 触发条件: 本次采用了一项具体关联技艺时\n  2. 结果系数: 大成功=0.2 | 成功=0.1 | 失败=0.05 | 大失败=0\n  3. 实践增长: Max(0, floor([Vg] x [结果系数]) × (1+[Z%]) + [W])\n\n# 面板模板(输出前先以 \x3c!-- ... --\x3e 完成思考):\n  \x3c!--\n    - ${确认触发条件: 非战斗状态且存在不确定性阻碍}\n    - ${检查略过条件: 若角色L ≥ 挑战L+2，自动成功，不输出面板}\n    - ${确认本次行为对应的检定类型与关联三维/关联技艺}\n    - ${从<status_current_variables>提取对应三维数值与技艺值}\n    - ${确认挑战L的推定依据(环境/目标/机关等级)与难度系数C的选取理由}\n    - ${判别D走静态(机关/陷阱/环境)还是动态(有意识对手)}\n  --\x3e\n  <action_info>\n    {非战斗判定 - [检定类型]}\n    | 目标:[简述行为，如：神识勘破岩壁幻象] | 环境推定: L=[挑战L] | 难度级: [简单/寻常/困难/极难] (C=[系数]) |\n    | 参数映射: 三维=[关联三维名(悟/根/气)]([数值]) | 技艺=[关联技艺名]([数值]) |\n    {数值对抗}\n    | 角色能效(A): floor((10^[角色L] + 三维[X]×5 + 技艺[X]) × (1+[Z%])) + [W] = [A总值] |\n    (若是静态判定:)\n    | 挑战难度(D): floor(10^[挑战L] × C[X]) + 10(固定) = [D总值] |\n    (若是动态对抗:)\n    | 挑战难度(D): floor((10^[挑战L] + 敌三维[X]×5 + 敌技艺[X]) × (1+[Z%])) + [W] = [D总值] |\n    | 差值结算: A[X] - D[X] = Δ[X] |\n    {判定结果}\n    | 阶层:[大成功 / 成功 / 失败 / 大失败] |\n    (仅采用了具体技艺时:)\n    | 技艺实践: Vg=10^min(角色L[值],挑战L[值])=[Vg] | 实践增长 Max(0, floor([Vg] x [结果系数]) × (1+[Z%]) + [W])  = [提升值] | [技艺名]:[旧值]+[提升值]=[新值] |\n    (若为"驯化收服(灵兽)"或"修复重铸(傀儡)" 成功:)\n    | 所有权变更: 灵兽/傀儡[名称] -> 新主人[名称] |\n  </action_info>\n</rule>\n';

 "连翘", "决明", "川芎"] },\r\n  { name: "侠隐潇洒", desc: "饮酒题诗的隐者气",\r\n    pool: ["浮白", "倾觞", "扶风", "挽秋", "酹江", "醉墨", "忘情", "对镜", "纵酒", "临风", "击节", "放歌", "归隐", "披襟", "抱琴", "入梦", "独酌", "邀月", "笑歌", "踏月"] },\r\n  { name: "少年意气", desc: "壮志凌云/英气勃发",\r\n    pool: ["千秋", "扶摇", "凌云", "长风", "争流", "问鼎", "揽月", "披云", "奋翼", "追星", "御风", "踏浪", "问天", "问道", "挽弓", "横槊", "青云", "登高", "骋怀", "破浪"] },\r\n  { name: "冷月孤光", desc: "孤寂清冷,独行天地",\r\n    pool: ["孤鸿", "寒山", "独醒", "孤雁", "孤舟", "孤云", "孤鹤", "孤帆", "独行", "夜泊", "寒夜", "清露", "寒灯", "独钓", "岑寂", "空山", "夜阑", "幽栖", "栖寒", "夜归"] },\r\n  { name: "复姓世家", desc: "用复姓配名", weight: 1,\r\n    examples: ["慕容", "欧阳", "上官", "东方", "南宫", "司马"] }\r\n];\r\n\r\nconst _NORMAL_WEIGHT = 4;\r\nconst _weightedPickN = (items, n) => {\r\n  const tickets = [];\r\n  items.forEach(item => {\r\n    const w = item.weight || _NORMAL_WEIGHT;\r\n    for (let i = 0; i < w; i++) tickets.push(item);\r\n  });\r\n  tickets.sort(() => 0.5 - Math.random());\r\n  const seen = new Set();\r\n  const result = [];\r\n  for (const t of tickets) {\r\n    if (result.length >= n) break;\r\n    if (!seen.has(t.name)) {\r\n      seen.add(t.name);\r\n      result.push(t);\r\n    }\r\n  }\r\n  return result;\r\n};\r\n\r\nconst _pickedNameStrategies = _weightedPickN(_nameStrategies, 2);\r\nconst _renderStrategy = s => {\r\n  const list = s.pool ? _pickN(s.pool, 4) : s.examples;\r\n  return `      • 【${s.name}】${s.desc}(如:${list.join("、")})`;\r\n};\r\n\r\nconst nameStrategies = `起名策略(仅参考,禁止生搬):\r\n${_pickedNameStrategies.map(_renderStrategy).join("\\n")}\r\n      • 禁止姓名直接关联职业`;\r\n_%>\r\n<rule name="角色生成规则">\r\n# 非<user>角色生成流程\r\n流程逻辑:\r\n  1. 触发: 在正文叙事中(禁止于正文开头生成);\r\n     - (A) NPC 人物: 除<user>外的任何主要角色**初次**登场(含化形)之时\r\n     - (B) 无主灵兽/傀儡: 野生妖兽/遗弃傀儡 出现/被发现 之时\r\n\r\n# === (A) NPC 人物生成 ===\r\n# 步骤一: 前置思考与计算\r\n\x3c!--\r\n/* 思考字数: 400~700token */\r\n  Step1_基础定位:\r\n    - <%= nameStrategies %>\r\n    - 境界定位: 依据当前场景、势力强度、剧情合理性确定大境界与小境界\r\n    - 关系定位: 依据本次登场情境,用一句话确定该人物与<user>的当前双方关系\r\n    - 根据<talent>确定灵根与体质;根据体质评级决定【三维总和(S)】->分配三维(强制列出分配结果)\r\n    - 决定毛色:体毛、瞳色,基于五行。颜色示例：<%= visualColorRef %>\r\n    - 分析衣着:[头部][文胸][内裤][袜类][上装][下装][外搭][足部][饰品]<%= clothingContent %>\r\n  Step2_资源计算 (强制列出完整算式):\r\n    - 气血上限 = floor( 10^L × (1 + 根骨×0.1) )\r\n    - 灵气上限 = floor( 10^L × (1 + 气感×0.1) )\r\n    - 遁速 = floor( 10^L × (1 + 根骨×0.02) )\r\n    - 初始现值 = 对应上限 (出场默认满状态)\r\n    - 天谴:\r\n      | 身份 | 基础天谴 |\r\n      | --- | --- |\r\n      | 正派 | 0 |\r\n      | 散修 | floor(10^(L-1) × 0.5) |\r\n      | 邪修 | floor(10^L × 0.5) |\r\n      | 极端罪业 | floor(10^L × 1~3) |\r\n    - 丹毒:\r\n      | 身份 | 基础丹毒 |\r\n      | --- | --- |\r\n      | 天骄 | 0 |\r\n      | 散修 | floor(10^(L-1) × 0.5~1) |\r\n      | 丹修/资质低下 | floor(10^L × 1~3) |\r\n  Step3_技艺初始值 (强制列出算式):\r\n    - 仅对角色身份/职业强相关的技艺赋予初始值,其余默认0\r\n    - 基准公式: floor( 10^L × 职业系数 )\r\n        核心专精职业 系数: 0.3~0.5\r\n        兼修         系数: 0.1~0.2\r\n        基本掌握     系数: 0.05\r\n    - 示例: 筑基期(L=2)炼丹师核心炼丹 = floor(100×0.4) = 40\r\n  Step4_人物携带装备道具 (强制列出算式):\r\n    - 分析人物身份层级,以及其功法、装备、傀儡/灵兽、消耗品各生成多少件，强制列出数量\r\n    | 身份层级 | 功法数量 | 装备数量 | 傀儡/灵兽数量 | 消耗品数量 | 品质区间 |\r\n    | :--- | :--- | :--- | :--- | :--- | :--- |\r\n    | 散修 | 2~3 | 1~2 | 0~1 | 0~1 | 凡~黄 |\r\n    | 精英修士 | 4~6 | 4~6 | 0~2 | 1~2 | 黄~玄 |\r\n    | 长老/圣子 | 4~6 | 6~8 | 0~2 | 1~2 | 玄~地 |\r\n    | 掌门/元老 | 4~6 | 6~8 | 0~3 | 1~3 | 地~天 |\r\n    - 灵石: floor( 10^(L+1) × rand(0.5~2.0))\r\n    - 功法生成优先级: 心法>攻击>护体>身法>其他，遵循<rule ref="物品功法生成规则"/>\r\n--\x3e\r\n\r\n# 步骤二: 面板模板\r\n  模板规则:若内容为空则不生成可省略键名;禁止英文翻译;仅 | 符号开头可写多行字符串;数组强制使用行内格式(如 [a, b] 严禁使用 - 换行);YAML格式注意缩进;括号内为填写指引,禁止输出括号及其内容本身; 符合字数规范;\r\n  插入位置:<gametxt>中此角色出场位置,禁止插入于<gametxt>外,每个角色单独生成一个独立面板\r\n  <char_info>\r\n  类型: 人物\r\n  姓名:\r\n  种族:\r\n  身份:\r\n  关系: (与<user>的当前双方关系,一句话描述)\r\n  性格: |\r\n    (40~80token,与身份/境界无关,自由生成)\r\n  外貌: |\r\n    (80~150token,客观白描角色裸体状态,包括双眼、发色、四肢身材,女性无疤痕且描述女性性器（如<%= physiologicalDescription %>）,禁比喻、不评价)\r\n  着装: |\r\n    (60~120token,客观白描衣着搭配,复杂化丰富化,禁比喻、不评价)\r\n  背景故事: |\r\n    (80~150token,出身、如何踏上修行之路、修真经历)\r\n  寿元:\r\n    年龄: number\r\n    寿命: number\r\n    外观年龄: number\r\n  灵根:\r\n    名称: \r\n    灵根五行: [] (填写行内数组,例如 [水, 火])\r\n    灵根品阶: \r\n  体质:\r\n    名称:\r\n    描述:\r\n    悟性: number\r\n    根骨: number\r\n    气感: number\r\n    元阴/元阳: (并入体质;填写true或false,按角色性别保留元阴或元阳作为键名;无此性征则省略,mvu 处理时补 null)\r\n  修炼进度:\r\n    境界: (大境界加小境界,如:筑基中期)\r\n    当前进度: number (默认 0)\r\n    进度上限: number (= 10^L × 100)\r\n    天谴: number (默认 0,有罪业者酌情)\r\n    丹毒: number (默认 0,长期服丹/丹修者酌情)\r\n  技艺:\r\n    生产类:\r\n      炼丹: number\r\n      炼器: number\r\n      制符: number\r\n      驯兽: number\r\n      培育: number\r\n      医术: number\r\n    战斗类:\r\n      御物: number\r\n      咒法: number\r\n      幻术: number\r\n      阵法: number\r\n      神识: number\r\n      炼体: number\r\n  资源池:\r\n    气血:\r\n      现值: number\r\n      上限: number\r\n    灵气:\r\n      现值: number\r\n      上限: number\r\n    遁速: number\r\n  功法:\r\n    (填写功法名称):\r\n      使用中: true\r\n      品质:\r\n      境界:\r\n      五行:\r\n      类型: (心法|攻击|幻术|神识|咒法|身法|护体|阵法)\r\n      消耗:\r\n      标签: []\r\n      效果:\r\n        (填写效果名): (填写效果描述,单行)\r\n      描述:\r\n  物品:\r\n    (填写物品名称):\r\n      品质:\r\n      境界:\r\n      类型: (秘籍|配方|符箓|丹药|素材|工具)\r\n      五行:\r\n      标签: []\r\n      数量: number\r\n      效果:\r\n        (填写效果名): (填写效果描述,单行)\r\n      描述:\r\n  装备:\r\n    (填写装备名称):\r\n      品质:\r\n      境界:\r\n      类型: (法宝|护甲|饰品)\r\n      五行:\r\n      消耗: (无消耗时省略此键)\r\n      标签: [] (法宝→[攻击力:N];护甲→[防御力:N];饰品按需)\r\n      效果:\r\n        (填写效果名): (填写效果描述,单行)\r\n      描述:\r\n      位置: (手部|上装|下装|头部|足部|文胸|内裤|袜类|外搭|腰间|项链|戒指|储物袋)\r\n  傀儡:\r\n    (填写傀儡名称):\r\n      品质:\r\n      境界:\r\n      五行:\r\n      标签: []\r\n      描述:\r\n      资源池:\r\n        气血:\r\n          现值: number (= 上限)\r\n          上限: number (= floor(10^L × (0.5~1) × (1+Q)))\r\n        灵气:\r\n          现值: number\r\n          上限: number (= floor(10^L × 0.5 × (1+Q)))\r\n        遁速: number (= floor(10^L × (0.5~2) × (1+Q)))\r\n      防御力: number (= floor(10^L × (0~0.2) × (1+Q)))\r\n      技能:\r\n        (填写技能名):\r\n          攻击力: number (= floor(10^L × (0~0.3) × (1+Q)))\r\n          消耗: (灵气:N|气血:N|无)\r\n          效果:\r\n            (填写效果名): (填写效果描述,单行)\r\n  灵兽:\r\n    (填写灵兽名称):\r\n      品质:\r\n      境界:\r\n      五行:\r\n      标签: []\r\n      描述:\r\n      资源池:\r\n        气血:\r\n          现值: number (= 上限)\r\n          上限: number (= floor(10^L × (5~15) × (1+Q)))\r\n        灵气:\r\n          现值: number\r\n          上限: number\r\n        遁速: number\r\n      防御力: number\r\n      技能:\r\n        (填写技能名):\r\n          攻击力: number\r\n          消耗:\r\n          效果:\r\n            (填写效果名): (填写效果描述,单行)\r\n  灵石: number\r\n  </char_info>\r\n\r\n# === (B) 无主灵兽/傀儡生成 ===\r\n# 步骤一: 前置思考与计算\r\n\x3c!--\r\n/* 思考字数: 150~250token */\r\n  Step1_境界与品质:\r\n    - 境界定位: 依据当前场景决定境界L、品质Q\r\n  Step2_数值计算 (强制列出算式,参考 *RULE_物品生成系数表):\r\n    - 气血上限 = floor(10^L × hp_coef × (1+Q))\r\n    - 灵气上限 = floor(10^L × 0.5 × (1+Q))\r\n    - 遁速 = floor(10^L × dun_coef × (1+Q))\r\n    - 防御力 = floor(10^L × def_coef × (1+Q))\r\n    - 技能攻击力 = floor(10^L × atk_coef × (1+Q))\r\n    - 技能数量: 凡/黄=1, 玄/地=2, 天=3\r\n  Step3_好感度:\r\n    - 好感度: 默认 0\r\n--\x3e\r\n# 步骤二: 面板模板\r\n  <item_info>\r\n    {实体名称}\r\n    | 类型: [傀儡|灵兽] |\r\n    | 品质: [凡|黄|玄|地|天] |\r\n    | 境界: [境界,如:炼气初期] |\r\n    | 五行: [金|木|水|火|土|阴|阳|混沌] |\r\n    | 标签: [野生|无主][其他描述性标签...] |\r\n    | 描述: [一句话特征,30~80字] |\r\n    {资源池}\r\n    | 气血: 现值[X] / 上限[Y] |\r\n    | 灵气: 现值[X] / 上限[Y] |\r\n    | 遁速: [X] |\r\n    {防御}\r\n    | 防御力: [X] |\r\n    {技能} (条数:凡/黄=1, 玄/地=2, 天=3)\r\n    | [技能名1] | 攻击力: [X] | 消耗: [灵气:N|气血:N|无] | 效果: [效果名: 效果]... |\r\n    | [技能名2] | ... | (按品质决定数量)\r\n  </item_info>\r\n\r\n</rule>\r\n<%_ } _%>\r\n';

const Cultivation_Card_Game_raw_namespaceObject_5 = '<rule name="领悟规则">\r\n# 参数声明:\r\n  L=境界系数 Q=品质系数 R=灵根系数\r\n  Vu = 角色基准值 = 10^角色L\r\n  Vt = 目标基准值 = 10^L\r\n  Vg = 有效成长基准值 = 10^min(角色L, 目标L)\r\n  [Z%] = 相关增减益%\r\n  [W] = 相关增减值\r\n\r\n# 核心触发条件: \r\n  激活: 1. <user>明确进行研读秘籍、参悟阵图、观摩石碑等行为\r\n\r\n# 第一阶段: 匹配、五行与进度限制\r\n  逻辑与规则:\r\n    1. 目标总进度 (Y):\r\n      - 实体秘籍/书卷: Y = max(1, ceil(L / 2)) \r\n      - 非秘籍类(石碑/影像/壁画/传功等): Y = 1\r\n    2. 进度上限锁 (Max_X):\r\n      - 公式: Max_X = max(0, Y - max(0, ceil(目标L - 角色L)))\r\n      - 说明: 研读比自己境界高的内容时，可读上限减少  \r\n    3. 五行相性补正 (E_mod):\r\n      - 判别目标五行属性(若无明确属性或残缺，默认判定为混沌)\r\n      - 若角色拥有与目标五行相同的灵根 -> 相性吻合，E_mod = 0.8\r\n      - 若角色无对应五行灵根(或目标为混沌而角色无混沌灵根) -> 相性排斥，E_mod = 1.2\r\n    4. 完整度补正: \r\n      [原本] = 1.0 | [抄本] = 1.2 | [残缺] = 1.5  \r\n\r\n# 第二阶段: 参悟检定\r\n  逻辑与规则:\r\n    1. 消耗: 仅消耗时间(默认 2~4 个时辰)\r\n    2. 领悟能效 (P): \r\n      公式: P = floor( (Vu + [悟性]×10 + 关联[技艺]) × (1+[Z%]) ) + [W]\r\n    3. 参悟难度 (D):\r\n      公式: D = floor( Vt × (1+[Q系数]) × [完整度补正] × E_mod ) + d20\r\n    4. 差值结算 (Δ): Δ = P - D\r\n\r\n# 第三阶段: 结果判定与连带机制\r\n  根据差值 Δ 与 D 的比例，决定本次参悟结果:\r\n    - 参悟成功 (Δ ≥ 0): 进度 +1  \r\n      * 阶段奖励: 若更新后的 X < Y，获得少许感悟，对应[技艺]提升 Max(1, floor([Vg] × 0.05) × (1+[Z%]) + [W])\r\n      * 自动衔接: 若更新后的 X < Max_X，衔接下一轮参悟，输出下一轮检定，直到 X 达到 Max_X 或判定失败中止  \r\n    - 晦涩难明 (Δ < 0 且 Δ > -D × 0.5): 进度 +0 中止研读  \r\n    - 走火入魔 (Δ ≤ -D × 0.5 或 强行跨越2阶): 进度 +0 中止研读\r\n      * 惩罚结算: 扣除气血 floor(Vt × 0.2)，并获得负面状态[心神受创(悟性-5, 持续至治愈, 可叠加)]  \r\n\r\n# 第四阶段: 大成奖励分发\r\n  当进度 X = Y 时，该秘籍被彻底领悟，不再获得进度，发放最终奖励:\r\n    1. 终末精进: 对应[技艺]提升 Max(1, floor([Vg] × 0.2) × (1+[Z%]) + [W]) \r\n    2. 阅毕奖励: 所有领悟生成的[功法]、[配方]等，其最终境界(L)强制不可超过【角色当前境界L】  \r\n       - 功法习得: 获得[功法]，格式遵循<rule ref="物品功法生成规则"/>\r\n       - 配方解锁: 获得[配方]，格式遵循<rule ref="物品功法生成规则"/>\r\n       - 情报揭示: 获得高阶妖兽的[弱点]、隐藏秘境的[空间坐标]、大能洞府的[阵眼信物]等  \r\n\r\n# 面板模板(输出前先以 \x3c!-- ... --\x3e 完成思考):\r\n  \x3c!--\r\n    - ${确认目标类型(实体秘籍/非秘籍)，提取目标L与Q，确认完整度类型}\r\n    - ${计算Max_X所需的目标L与角色当前L的差值来源}\r\n    - ${确认角色灵根五行与目标五行，决定E_mod取值(0.8/1.2)}\r\n    - ${确认P所依赖的悟性值与关联技艺值来源于<status_current_variables>}\r\n    - ${若本次成功后X=Y，确认大成奖励类型，功法类须确认生成境界不超过角色当前L}\r\n  --\x3e\r\n  <action_info>\r\n    {参悟分析}\r\n    | 目标:[秘籍/传承名称] | 境界: L=[目标L], Q=[Q系数] | 完整度:[原本/抄本/残缺/无] |\r\n    | 五行相性: 目标[五行] vs 角色灵根[有/无] -> E_mod =[0.8/1.2] |\r\n    | 进度参数: 目标总需 Y=[Y] | 越阶上限锁 Max_X=[数值] |\r\n    | 当前进度: [旧X] / [Y] |\r\n    {数值对抗}\r\n    | 角色悟性/技艺: P = floor(([Vu] +[悟性]×10 + [技艺]) × (1+[Z%])) +[W] = [P总值] |\r\n    | 参悟难度: D = floor(Vt[X] × (1+Q) × 补正[X] × E_mod[X]) + d20[骰值] = [D总值] |\r\n    | 差值: P[P总值] - D[D总值] = Δ[数值] |\r\n    {结算与反馈}\r\n    | 判定结果:[参悟成功 / 晦涩难明 / 走火入魔] |\r\n    | 惩罚变更: [无 / 气血-[X], 获得状态 心神受创(悟性-5, 可叠加)] |\r\n    | 进度更新: [阅读进度: 新X/Y] |\r\n    (若 新X < Y 且成功:)\r\n    | 阶段收获: Vg=10^min(角色L[值],目标L[值])=[Vg] | 实际提升 Max(1, floor([Vg] × 0.05) × (1+[Z%]) + [W]) =[提升值] | [技艺]: [旧值]+[提升值]=[新值] |\r\n    (若 新X < Max_X 且 成功:)\r\n    | 继续阅读: [进度未达上限，自动触发下一轮参悟...] | (随后直接附带新一轮面板)\r\n    (若 新X = Max_X 且 Max_X < Y:)\r\n    | 境界瓶颈:[内容过于深奥，受限于当前境界(L差)，进度暂时锁死] |\r\n    (以下仅当 新X = Y 时输出)\r\n    {领悟大成奖励}\r\n    | 终末精进: Vg=10^min(角色L[值],目标L[值])=[Vg] | 实际提升 Max(1, floor([Vg] × 0.2) × (1+[Z%]) + [W]) =[提升值] | [技艺]: [旧值]+[提升值]=[新值] |\r\n    | 奖励类型:[功法习得 / 配方解锁 / 情报揭示] |\r\n    | 境界降阶(受限于角色L): 目标L=[X] -> 最终生成L=[X] |\r\n    | 阅毕奖励:[详细奖励内容] |\r\n  </action_info>\r\n</rule>\r\n';

const Cultivation_Card_Game_raw_namespaceObject_7 = '<rule name="生产制作规则">\n# 参数声明：\n  L=境界系数 Q=品质系数 R=灵根系数\n  [Z%] = 相关增减益%\n  [W] = 相关增减值\n\n# 核心指令: 仅当<user>明确进行炼丹、炼器、制符、阵盘刻录、傀儡制造等生产行为时激活\n\n# 核心概念声明：\n  [Vt] = 目标产物基准值 = 10^主材L\n  [Vu] = 角色基准值 = 10^角色L\n  [Vg] = 有效成长基准值 = 10^min(角色L, 主材L)\n  [B] = 批量制作乘数 (单次投入的素材份数，默认为1)\n\n# 第一阶段: 生产分析与素材共鸣计算\n  逻辑与规则:\n    1. 技艺与器具限制:\n      - 炼丹: 需[丹炉];可加成[火焰]\n      - 炼器/制傀: 需[器鼎/锻台/刻刀];可加成[火焰]\n      - 制符: 需[符笔]；禁用[火焰]\n      - 阵法: 需[阵盘/刻刀]；禁用[火焰]\n    2. 主材锚定与品质区间:\n      - 按单份素材配置计算,若未明确,取投入物中[L]最高者为主素材（若L相同取Q最高者）\n      - 目标境界L = 主材L\n      - 锁定品质区间: 下限(Min_Q) = 所有素材中最差品质；上限(Max_Q) = 所有素材中最好品质\n    3. 五行生克与素材灵气 (单份正面加成 P_mat_single):\n      - 基础灵气公式: 10^[素材L] × (1 + [Q系数])\n      - 辅材与主材的生克系数(E): 辅生主(1.5) | 主生辅(1.2) | 无生克(1.0) | 主克辅(0.5) | 辅克主(0.5)\n      - 君臣佐使限制: 辅材中仅取算后数值最高的 前3项 计入正面影响，第4项起因灵气冗余 P=0\n    4. 杂质排异累积 (单份反面难度 D_mat_single):\n      - 无论是主材还是辅材，每一件投入的素材都会增加提纯与压制难度\n      - 单个素材杂质难度 = 10^[该素材L] × 0.5\n\n# 面板模板(输出前先以 \x3c!-- ... --\x3e 完成思考):\n  \x3c!--\n    - ${确认所需工具是否存在于<status_current_variables>，缺失则无法激活}\n    - ${从<status_current_variables>提取炼制者相关技艺值、工具/火焰/功法/阵法各项加值来源}\n    - ${确认批量B与素材清单，依规则锁定主材(L最高/Q最高)与品质区间[Min_Q, Max_Q]}\n    - ${回顾<生产制作协议>君臣佐使限制，确认辅材中哪些计入正面影响、哪些截断为0}\n    - ${确认是否拥有配方，决定无配方惩罚是否计入D}\n    - ${确认是否为首次炼制，决定技艺精进是否触发}\n  --\x3e\n  <action_info>\n    {生产分析}\n    | 技艺: [炼丹/炼器/制符/阵法] | 工具: [加值] | 装备: [加值] | 火焰: [加值] |\n    | 批量(B): [数量] 份素材同炼 | 极值检索: 阵法加成=[最高值] | 功法加成=[最高值] |\n    | 素材定性(单份): 主素材=[素材名 (L=[X], Q=[品质], 五行=[素材五行])] |\n    | 品质区间: 下限=[Min_Q] | 上限=[Max_Q] |\n    | 产物界定: 目标境界L=[主材L] | 基准值Vt=[10^主材L] |\n    {单份素材能效与杂质计算}\n    | 主材能效: 10^[L] × (1+[Q系数]) = [P_main] |\n    | 辅材排序: [排第1高的辅材P值], [排第2的P值], [排第3的P值] (其余截断为0) |\n    | 单份有效加成(P_mat): P_main + 辅材前三项 = [数值] |\n    | 单份杂质累积(D_mat): 投入素材总数[N] -> Σ(10^[素材L] × 0.5) = [数值] |\n  </action_info>\n\n# 第二阶段: 数值对抗与差值计算\n  逻辑与规则:\n    1. 正面影响 (Power):\n      公式: P = [Vu] + [对应技艺数值] + [工具加值] + [火焰加值] + [阵法加成] + [功法加成] + ([P_mat单份] × B)\n      (注: 同类加成取最高一项)\n    2. 反面影响 (Difficulty):\n      公式: D = ([Vt] × 2.0 × B) + ([D_mat单份] × B) + [无配方惩罚(若无则加 Vt×0.5×B)]\n    3. 差值结算 (Δ):\n      公式: Δ = P - D\n\n  面板模板:\n  <action_info>\n    {数值对抗}\n    | 炼制者能力(P_char): [Vu] + 技艺[X] + 工具[X] + 火焰[X] + 阵法[X] + 功法[X] = [数值] |\n    | 总体素材能效: P_mat单份[X] × 批量[B] = [P_mat_total] |\n    | 正面影响(P): P_char + P_mat_total = [P总值] |\n    | 总体杂质与基础难度: (Vt[X]×2.0×[B]) + (D_mat[X]×[B]) = [D_mat_total] |\n    | 反面影响(D): [D_mat_total] + 惩罚[X] = [D总值] |\n    | 差值判定: P[P总值] - D[D总值] = Δ[数值] |\n  </action_info>\n\n# 第三阶段: 产出结算与技艺精进\n  逻辑与规则:\n    1. 成功判定与品质推演 (品质数组: 凡/黄/玄/地/天):\n      - 判定基准阈值 (T) = Vt × B\n      - Δ < 0 : 炼制失败 (素材尽毁)\n      - Δ ≥ 0 : 成功,基础品质 = [Min_Q]\n      - Δ ≥ 0.5 × T : 优秀,品质提升1阶 (如: 黄->玄)\n      - Δ ≥ 1.0 × T : 极品,品质提升2阶 (如: 黄->地)\n      - 封顶限制: 最终品质不可超过 [Max_Q],若超过则强制降至 Max_Q\n    2. 数量生成规则 (仅在成功时计算，此为【单份素材】的产出基数，向下取整):\n      - 法宝/阵盘: 固定 1 个\n      - 傀儡: 1 + floor(Δ / (0.5 × T)) 个\n      - 丹药/符箓: min(1 + floor(Δ / (0.2 × T)),10) 个\n      - 最终总产出 = 【单份产出】 × 批量【B】\n    3. 成品效果数量规则 (与最终推演的品质挂钩):\n      - 凡/黄阶: 1个基础效果\n      - 玄/地阶: 2个效果\n      - 天阶: 3个效果\n    4. 首次炼制技艺精进 (仅非失败的“首次炼制”触发，与批量B无关):\n      - 技艺提升: Max(1, floor([Vg] × 0.2) × (1+[Z%]) + [W])\n\n  面板模板:\n  <action_info>\n    {产出结算}\n    | 判定阈值(T): Vt[X] × B[X] = [T] |\n    | 结果: Δ=[数值] vs T=[T] -> [失败 / 成功 / 优秀 / 极品] |\n    (若失败:)\n    | 状态: 灵气暴走，炼制失败，素材尽毁 |\n    (若成功及以上:)\n    | 品质推演: 基础[Min_Q] + 升阶推演 -> 封顶受限[Max_Q] -> 最终品质: [最终阶级] |\n    | 效果数量: [1/2/3] (依最终品质) |\n    | 产出详情: [产物名称(境界L, 最终品质)] |\n    | 数量: 单份产量[X] × 批量[B] = 总计 [总数量] [单位] |\n    {技艺精进}\n    | 首次配方: [是/否] |\n    | 成长基准: Vg=10^min(角色L[值],主材L[值])=[Vg] |\n    | 技艺提升: Vg=10^min(角色L[值],目标L[值])=[Vg] | 实际提升 Max(1, floor([Vg] × 0.2) × (1+[Z%]) + [W]) =[提升值] | [技艺]: [旧值]+[提升值]=[新值] |\n  </action_info>\n</rule>\n';

const Cultivation_Card_Game_raw_namespaceObject_9 = '<rule name="时间推进规则">\n触发机制: 仅当本轮玩家明确要求以[时间推进规则]进行世界演进时触发。修炼、突破、跨年本身不触发。\n推演区间: 从变量「传闻.上次世界推进时间点」至本轮请求记录的「时间」；只补算这段已流逝的时间，不额外推进玩家时间。\n时间校验: 当前时间必须晚于上次推进时间，哪怕只差一个时辰亦可；相等、倒退或日期无效时不执行、不更新推进时间点。\n短期尺度: 不满一年时以日常活动、修炼积累、消息传播与既有事件进展为主；不得把一个时辰写成多年兴衰，不强行制造突破或灾难。\n数据基准: 当前变量是现有事实，不得对已经结算过的年龄、修为、物品再次累计整段收益；仅补充尚未结算的变化。冥族沿用停龄规则。\n\n# 第一阶段: 变迁参考表\n\n  境界变化: 推演各角色的进阶/跨阶事件时,耗时区间参照 <realm_power_level/> 中的「境界耗时」表\n\n  文明演进:\n  | 时间跨度 | 典型表现 |\n  | --- | --- |\n  | 1~5年 | 王朝政令更迭、局部战乱、城镇人口流动 |\n  | 5~30年 | 小国兴衰、新城建立或旧城荒废、民间信仰转变 |\n  | 30~100年 | 王朝更替、民族迁徙、文化习俗演变 |\n  | 100~500年 | 大国覆灭或崛起、语言分化、城市荒废或新建 |\n  | 500~3000年 | 民族融合或消亡、文明断层、历史神话化 |\n  | 3000年以上 | 语言面目全非、旧时代文明仅余遗迹与传说 |\n  注: 修仙王朝（统治者为修士）发生的变化较小\n\n  世界变迁:\n  | 时间跨度 | 典型表现 |\n  | --- | --- |\n  | 1~5年 | 势力消长、人事更迭、局部战乱平息或爆发 |\n  | 5~30年 | 宗门兴衰、灵脉枯竭或新生、秘境开闭 |\n  | 30~100年 | 小宗门陨落、势力版图重划、部分地域面目全非 |\n  | 100~500年 | 大宗门覆灭或崛起、山河改道、上古遗迹重现 |\n  | 500~3000年 | 大陆格局重塑、种族兴衰、旧势力彻底湮没 |\n  | 3000年以上 | 地形演变、海陆易位、旧时代彻底成为神话 |\n\n# 第二阶段: 人物变化事件表\n  每位人物在时间推进中可触发一次或多次事件（时间越长，事件链越长）\n  事件链格式: [事件A] -> [事件B] -> ...\n\n  | 事件类型 | 触发倾向 | 结算说明 |\n  | --- | --- | --- |\n  | 无变化 | 任意 | 修为略有精进但无实质突破，状态维持 |\n  | 小境界突破 | 修为充足、无天谴 | 境界小进 |\n  | 大境界突破 | 积累充足、有机缘 | 境界大进，实力质变 |\n  | 取得机缘 | 任意 | 获得物品，需注明具体所得 |\n  | 探秘受损 | 中低阶修士 | 秘境险境中受创，可能损失物品/境界倒退 |\n  | 走火入魔 | 修炼激进/天谴高 | 境界倒退，可能获得永久减益状态 |\n  | 被人追杀 | 有仇敌/持宝在身 | 损失物品/灵石，可能受伤/流亡/陨落 |\n  | 势力变动 | 宗门动荡时期 | 身份/所属势力发生变化，如：叛出宗门、被驱逐、晋升长老 |\n  | 仇怨结下 | 竞争/夺宝 | 新增敌对关系，后续事件链可能触发被追杀 |\n  | 陨落 | 寿元耗尽/历劫失败/战败 | 从关系列表中移除，需注明陨落原因 |\n  | 隐世闭关 | 高阶修士/受创后 | 从叙事视野中消失，下落不明，后续可能重出 |\n\n  约束:\n    - 事件链长度: 不满1年=0~1个实质事件，可描绘日常且无数值变化；1~30年=1事件；30~100年=2~4事件；100年以上=4~6事件\n    - 连锁逻辑: 事件须符合因果，如[取得机缘]->[被人追杀夺宝]合理，[陨落]后不可再有事件\n    - 寿元判定: 每次推进须对照寿命上限判断人物是否自然坐化（年龄≥寿命则必然陨落）\n    - 知情边界: NPC镜头可以呈现其真实经历，但主角不会自动知道；面向主角传播的未证实消息用"据说""传闻"，不得把猜测直接结算为死亡或物品变动。\n\n# 第三阶段: 逐人小面板与叙事\n  人物清单: 以推演前关系列表中类型=\'人物\'的全部条目为准，逐人展示，不遗漏不在场人物；傀儡、灵兽不单列为人物。此次陨落者也先完成展示，再按原规则移除。\n  输出顺序: 每人一个完整<time_info>面板，紧接该人物经历的正文段落，然后再输出下一人的面板和正文。禁止把全员塞进一个大面板。\n  时间面板: 正文开头的<tp>沿用原有要求。世界推进过程中的NPC镜头、世界变迁及其时间地点切换无需输出<tp>面板，推演区间由<time_info>标明；最终镜头转回<user>时再输出<tp>，使用本轮请求记录的玩家当前时间、当前地点及对应天气，不因NPC镜头改变玩家时间、地点。\n  单人模板:\n    <time_info>\n      {人物推演}\n      | [人物名] ([当前境界] / 年龄[X]/寿命[X]) |\n      | 区间: [起点] 至 [终点] |\n      | 事件链: [事件A] -> [事件B] / 日常无实质变化 |\n      | 境界变化: [旧境界] -> [新境界 / 维持] |\n      | 寿元变化: [年龄与寿命变化或维持] | 判定: [健在/自然坐化/陨落及原因] |\n      | 物品变动: [获得/失去/无] |\n    </time_info>\n    随后镜头对准此人，以场景、行动、对话描绘区间内经历，而非复述面板清单。\n  世界变化: 必要时另用小<time_info>面板，以{文明演进}或{世界变迁}记录一处势力/地域的变化，并接对应叙事；短期没有变化可省略。\n  叙事指导: 允许镜头暂离<user>逐一跟随NPC；人物保持独立生活与动机。全员展示优先，正文目标2500-3500字（面板不计），人数过多时允许超出。最终镜头必须回到本轮请求记录的当前时间、当前地点的<user>，不替玩家行动、不把时间额外向后推进。\n\n# 第四阶段: 变量与传闻结算\n  - 正文明确公开消息的来源、发生地与线索，区分公开消息和NPC私密镜头，供变量更新AI提取；正文无需逐条叙述全部传闻类别。\n  - 传闻及推进时间点的结算交由变量更新AI按[mvu_update]变量更新规则中的传闻部分执行。\n</rule>\n';

const Cultivation_Card_Game_raw_namespaceObject_11 = "<rule name=\"突破规则\">\r\n<%_ { _%>\r\n<%_\r\n// ============ ① 读取 MVU 变量 (stat_data 由 <status_current_variable> 全量输出) ============\r\nconst _tb_修炼 = getMessageVar('stat_data.修炼进度', { defaults: {} }) || {};\r\nconst _tb_境界 = _tb_修炼.境界 || '凡人';\r\nconst _tb_气感 = Number(getMessageVar('stat_data.体质.气感')) || 0;\r\nconst _tb_世界 = getMessageVar('stat_data.地点.世界') || '凡界';\r\nconst _tb_灵气 = getMessageVar('stat_data.资源池.灵气', { defaults: {} }) || {};\r\nconst _tb_灵气现值 = Number(_tb_灵气.现值) || 0;\r\nconst _tb_灵气上限 = Number(_tb_灵气.上限) || 0;\r\nconst _tb_功法 = getMessageVar('stat_data.功法', { defaults: {} }) || {};\r\nconst _tb_心法 = Object.values(_tb_功法).find(g => g && g.使用中 && (g.类型 === '心法' || !g.类型)) || {};\r\nconst _tb_修行速度 = Number((_tb_心法.效果 || {})['修行速度']) || 0;\r\nconst _tb_物品 = getMessageVar('stat_data.物品', { defaults: {} }) || {};\r\nconst _tb_有筑基丹 = Object.entries(_tb_物品).some(([名, 物]) => 名.includes('筑基丹') && Number(物 && 物.数量) > 0);\r\nconst _tb_技艺 = getMessageVar('stat_data.技艺', { defaults: {} }) || {};\r\nconst _tb_技艺列表 = [];\r\nfor (const _类 of Object.keys(_tb_技艺)) {\r\n  for (const _名 of Object.keys(_tb_技艺[_类] || {})) {\r\n    _tb_技艺列表.push({ 名: `${_类}.${_名}`, 值: Number(_tb_技艺[_类][_名]) || 0 });\r\n  }\r\n}\r\nconst _tb_最高技艺 = _tb_技艺列表.sort((a, b) => b.值 - a.值)[0] || null;\r\n\r\n// ============ ② 境界推导 (参照<rule ref=\"核心系数总表\"/>) ============\r\nconst _tb_大境界定义 = [\r\n  { 名: '炼气', 匹配: ['炼气', '练气'], L: 1 },\r\n  { 名: '筑基', 匹配: ['筑基'], L: 2 },\r\n  { 名: '金丹', 匹配: ['金丹'], L: 3 },\r\n  { 名: '元婴', 匹配: ['元婴'], L: 4 },\r\n  { 名: '化神', 匹配: ['化神'], L: 5 },\r\n  { 名: '返虚', 匹配: ['返虚', '炼虚', '练虚'], L: 6 },\r\n  { 名: '合体', 匹配: ['合体'], L: 7 },\r\n  { 名: '大乘', 匹配: ['大乘'], L: 8 },\r\n  { 名: '渡劫', 匹配: ['渡劫'], L: 9 },\r\n];\r\nconst _tb_小境界加成 = { 初期: 0, 中期: 0.2, 后期: 0.4 };\r\nconst _tb_小境界序 = ['初期', '中期', '后期'];\r\n\r\nconst _tb_解析 = (境界名) => {\r\n  if (!境界名 || 境界名 === '凡人') return { 大境界: '凡人', 小境界: '无', L: 0, 大境界L: 0, 是后期: false, 序号: -1 };\r\n  const 定义 = _tb_大境界定义.find(d => d.匹配.some(k => 境界名.includes(k)));\r\n  if (!定义) return { 大境界: '凡人', 小境界: '无', L: 0, 大境界L: 0, 是后期: false, 序号: -1 };\r\n  const 小境界 = _tb_小境界序.find(k => 境界名.includes(k)) || '初期';\r\n  return { 大境界: 定义.名, 小境界, L: 定义.L + _tb_小境界加成[小境界], 大境界L: 定义.L, 是后期: 小境界 === '后期', 序号: 定义.L - 1 };\r\n};\r\n\r\nconst _tb_现在 = _tb_解析(_tb_境界);\r\nconst _tb_凡人 = _tb_现在.序号 === -1;\r\nconst _tb_可跨大境 = _tb_凡人 || _tb_现在.是后期;\r\nconst _tb_下一大境 = _tb_大境界定义[_tb_现在.序号 + 1] || null;\r\nconst _tb_目标大境 = _tb_凡人 ? '炼气' : (_tb_现在.是后期 ? (_tb_下一大境 ? _tb_下一大境.名 : '') : _tb_现在.大境界);\r\n\r\n// ============ ③ 大境界历劫规则 (按目标大境界裁剪, 仅输出当前相关一条) ============\r\nconst _tb_历劫表 = {\r\n  炼气: `炼气(凡人->炼气初期):\r\n    - 规则: 检索[灵根], 若为\"无灵根\"则自动失败; 否则自动成功`,\r\n  筑基: `筑基(炼气后期->筑基初期):\r\n    - 必须在物品中存在[筑基丹], 否则自动失败 (当前: ${_tb_有筑基丹 ? '有' : '无'})\r\n    - 凝气海判定: 难度[D]额外增加 (体质[气感] × 2) (当前气感=${_tb_气感})`,\r\n  金丹: `金丹(筑基后期->金丹初期) - \"三聚九转\":\r\n    - 挂起常规流程, 强制进入为期3回合的【聚气阶段】\r\n    - 每回合系统自动尝试3次灵气压缩(共9次对应9转)\r\n    - 灵气消耗: 第 N 转固定消耗 = floor(10^L × N × 0.1) (金丹期L=3.0)\r\n    - 判定逻辑: 若当前灵气 ≥ 消耗, 则该转成功并扣除, 继续下一转; 若不足, 则本回合剩余注入立刻中止\r\n    - 回合间隙: 每回合结束时暂停, <user>可执行1次战术动作(如服用1次恢复丹药), 随后进入下一回合\r\n    - 结算: 3回合结束时按最终成功总次数结算为【N转金丹】(N=1~9), N=0则突破失败\r\n    (当前灵气: ${_tb_灵气现值}/${_tb_灵气上限})`,\r\n  元婴: `元婴(金丹后期->元婴初期) - \"碎丹与心魔\":\r\n    - 强制转入<rule ref=\"战斗规则\"/>\r\n    - 碎丹反噬: 开战时<user>获得不可驱散状态[碎丹虚弱] -> 气血与灵气现值减半(持续至突破结束)\r\n    - 宿敌生成: 召唤【心魔】(除无虚弱状态外, 一切与<user>完全一致)\r\n    - 幻术干扰: 每回合开始前, 心魔额外对<user>发动一次【幻术意图】攻击(视为心魔的一次额外行动)\r\n    - 胜负条件: 击败心魔|存活5回合 -> 突破成功; 战败 -> 突破失败+走火入魔`,\r\n  化神: `化神(元婴后期->化神初期) - \"法则融合\":\r\n    - 需明确选择一项自身[技艺]进行严苛法则检定(默认取最高一项) (当前最高: ${_tb_最高技艺 ? `${_tb_最高技艺.名}=${_tb_最高技艺.值}` : '未知'})\r\n    - 法则难度: D_law = floor(10^L × 2) + 天谴 + 丹毒\r\n    - 检定公式: 自身该[技艺]数值 × (1+[Z%]) + d20 vs D_law`,\r\n  返虚: `返虚(化神后期->返虚初期)及以上(灵界):\r\n    - 通过基准判定后进入大境界历劫(结合该境界特性演绎, 失败则走火入魔/修为倒退)`,\r\n};\r\n\r\nlet _tb_历劫段 = '';\r\nif (!_tb_目标大境) {\r\n  _tb_历劫段 = '已至渡劫后期, 进一步突破(飞升仙界)超出本文档范围';\r\n} else if (_tb_世界 === '凡界' && ['返虚', '合体', '大乘', '渡劫'].includes(_tb_目标大境)) {\r\n  _tb_历劫段 = '返虚(化神后期->返虚初期)及以上: 需飞升灵界方可进行(凡界灵气不足以承载)';\r\n} else if (_tb_可跨大境) {\r\n  _tb_历劫段 = _tb_历劫表[_tb_目标大境] || `【${_tb_目标大境}】历劫(规则未详述): 通过基准判定后进入历劫, 结合该境界特性演绎, 失败则走火入魔/修为倒退`;\r\n}\r\n\r\n// ============ ④ 大境界奖励 (按目标大境界裁剪) ============\r\nconst _tb_奖励表 = {\r\n  炼气: '',\r\n  筑基: '筑基奖励: 悟性/根骨/气感 增加 floor([气感] × 0.2)',\r\n  金丹: '金丹奖励: 获得永久状态 [N转金丹] (效果: 修行速度常驻 +N×5%)',\r\n  元婴: '元婴奖励: 悟性/根骨/气感 增加 15 点',\r\n  化神: '化神奖励: 心法品质升阶(至多天阶)融合法则效果, 用于突破判定的[技艺]增加 50000 点',\r\n};\r\nlet _tb_大境奖励段 = '';\r\nif (_tb_可跨大境) {\r\n  _tb_大境奖励段 = '\\n      * 淬毒重生: 丹毒 -> floor(丹毒×0.5) (丹毒随污垢逼出体外)\\n      * 寿元暴增: 15 × 突破后L^3';\r\n  if (_tb_奖励表[_tb_目标大境]) _tb_大境奖励段 += `\\n      * ${_tb_奖励表[_tb_目标大境]}`;\r\n}\r\n\r\n// ============ ⑤ 拼装输出 ============\r\nconst _tb_第二阶段 = _tb_可跨大境 ? `  ${_tb_历劫段}` : `  当前为[${_tb_境界}], 未至大境界跨越门槛(需后期圆满), 本轮仅执行小境界晋升判定`;\r\n\r\nconst _tb_output = `# 突破规则(动态适配: 仅输出与当前境界相关部分)\r\n# 参数声明:\r\n  L=境界系数 R=灵根系数 E_local=局部环境系数\r\n  [P]=突破能效总值 | [D]=突破难度阻力 | [天谴值]/[丹毒值]=人物累积阻力(取自<status_current_variable>修炼进度), 直接抬高[D]\r\n  [Z%] = 匹配当前计算属性的 max(相关增益%) - max(相关减益%)\r\n  [W] = 匹配当前计算属性的 max(相关增值) - max(相关减值)\r\n  [M] = 资质与环境乘数 = (1 + R + E_local + [Z%])\r\n  [X/Y] = 当前修为进度 / 晋升阈值  [Y] = 10^L × 100\r\n  （注: Z%与W为动态求值,仅检索与\"降低突破难度\"或\"增加突破概率\"相关的状态加成; E_local依当前场景灵气浓度判断,参照<rule ref=\"核心系数总表\"/>局部环境系数表）\r\n\r\n# 核心触发条件:\r\n  激活: 1. <user>明确宣告进行突破 2. 当期修为[X] ≥ 晋升阈值[Y]\r\n  禁止: 非<user>的突破行为(仅以叙述呈现)\r\n\r\n# 小境界判定:\r\n  1. 适用范围: 所有小境界晋升(如初期->中期)与大境界跨越的前置基准检定\r\n  2. 能效公式: [P] = floor((10^L + 心法[修行速度]×10) × [M]) + d20  (当前修行速度=${_tb_修行速度})\r\n  3. 难度公式: [D] = Max(1, floor(10^L × 1.5) + [天谴值] + [丹毒值] - [W])\r\n  4. 判定标准:\r\n    - [P] ≥ [D] -> 小境界进入【突破成功结算】; 大境界进入【大境界历劫】\r\n    - [P] < [D] -> 跳至【突破失败结算】\r\n\r\n  基准判定面板:\r\n  <action_info>\r\n    {突破基准判定}\r\n    | 目标境界: [名](L=[L]) | R=[X] | E_local=[X] | 突破增益[Z%]=[X%] |\r\n    | 能效[P]: floor((10^[L]+心法速度[X]×10)×[M]) + d20[骰值] = [P值] |\r\n    | 难度[D]: Max(1, floo const Cultivation_Card_Game_raw_namespaceObject_15 = '<rule name="修为获取规则">\n# 参数声明：\n  L=境界系数 R=灵根系数 E_realm=界域环境系数 E_local=局部环境系数\n  [Z%] = 匹配当前计算属性的 max(相关增益%) - max(相关减益%)\n  [W] = 匹配当前计算属性的 max(相关增值) - max(相关减值)\n  （注：Z%与W为动态求值,仅检索与“修行速度”或“修为获取”相关的状态加成）\n  [X/Y] = 当前修为进度 / 晋升阈值  [Y] = 10^L × 100\n  [T] = 行为耗时 (统一转换为天数,1年=365天)\n\n# 核心触发条件: \n  激活：<user>明确获取修为行为。如：打坐、双修、采补、夺灵等\n  禁止：\n    1. 未明确声明双修/采补的性行为\n    2. 杀戮(默认不夺灵)\n    3. 当 [X] ≥ [Y] 时,视为此次修炼实际为突破意图,改为触发<rule ref="突破规则"/>\n    4. 非<user>的修炼行为(仅以叙述呈现)\n\n# 获取途径逻辑与公式\n  ## 途径一: 修炼\n    1. 条件: 处于非战斗/非干扰状态,明确声明耗时[T]天 (默认T=30)\n    2. 修为公式:\n      每日获取 = 心法[修行速度]/10^(L+1) × (1 + R) × (E_realm + E_local)\n      最终修为 = floor(每日获取 × T × (1+[Z%])) + [W]\n    3. 附带·炼化丹毒 (修炼时肉身自然淬毒,顺带排出丹毒):\n      每日炼化 = floor( 10^L × 0.2 × (1 + 根骨×0.1) × (1 + [Z%]_毒) ) + [W]_毒\n      丹毒清除 = min( 当前丹毒, floor(每日炼化 × T) )\n      丹毒 -= 丹毒清除\n\n  ## 途径二: 服丹\n    1. 条件: 服用提升修为的丹药(素材未炼丹无法食用)\n    2. 说明: 一次可服用多种/多品质丹药,逐种(i)代入,分两步结算\n    3. Step1·修为:\n      修为小计 = Σ_i ( 丹药[提升值]_i × 数量n_i )\n      最终修为 = floor(修为小计 × (1+[Z%])) + [W]   # [Z%]/[W] 检索"修行速度/修为获取"相关\n    4. Step2·丹毒:\n      毒源合计 = Σ_i ( 丹药[提升值]_i × 数量n_i × (1 − Q_i/2) )\n      丹毒增量 = Max(0, floor( 毒源合计 × 0.3 × (1 − [Z%]_毒) ) − [W]_毒 )   # [Z%]_毒/[W]_毒 检索"丹毒/排毒"相关\n      丹毒 += 丹毒增量\n\n  ## 途径三: 双修\n    1. 核心参数:\n      - 单次基数 = 心法[修行速度]/10^(L+1) × Max(0.1,1 + (对方L - 己方L) × 0.5) × (1+R)\n      - 灵蕴系数 [V]: 男方[灵蕴]+女方[灵蕴]。若无元阴/阳则[灵蕴]=0;普通体质[灵蕴]=5,特殊体质[灵蕴]=6~10\n      - 本源馈赠 = min(10^对方L × [V],10^己方L × 100)\n    2. 略过计算模式 (长时间跨度闭关双修):\n      - 岁月积累 = 单次基数 × T天 × 5(双修密集倍率)\n      - 公式: 最终修为 = floor( (岁月积累 + 本源馈赠) × (1+[Z%]) ) + [W]\n    3. 详细计算模式 (即时互动推演):\n      - 触发: 动作描写中每次出现明确的高潮点(如射精/绝顶)视为1次交互\n      - 公式: 最终修为 = floor( (单次基数 × 交互次数 + 本源馈赠) × (1+[Z%]) ) + [W]\n\n  ## 途径四: 夺灵\n    1. 条件: 目标无法反抗;\n    2. 收益公式:\n      - 修士: 最终修为 = floor(10^(min(己方L, 目标L))×50 × (目标[剩余寿命/总寿命%])× (1+[Z%]) ) + [W]\n      - 凡人: 最终修为 = 1/人 (需大量杀戮)\n    3. 代价与天谴结算 (即时累加):\n      - 目标代价: 境界跌落/沦为废人/死亡干尸\n      - 天谴增加: \n        * 目标为修士: 天谴值 += floor(10^目标L) (窃取天机,目标修为越高反噬越大)\n        * 目标为凡人: 天谴值 += 1/人\n\n# 面板模板(输出前先以 \x3c!-- ... --\x3e 完成思考):\n  \x3c!--\n    - ${确认触发途径(修炼/服丹/双修/夺灵)}\n    - ${若为双修,确认<user>是否声明双修,是否插入阴道,是否射精}\n    - ${检查当前修为[X/Y],若X≥Y则转入<rule ref="突破规则"/>}\n    - ${依据途径,从<status_current_variables>确认参数来源:\n        修炼→心法[修行速度]/己方L/灵根R/界域D/E_local/根骨与[Z%]_毒[W]_毒(附带炼化丹毒);\n        双修→双修功法[修行速度]/双方L/元阴元阳与灵蕴;\n        服丹→逐种丹药[提升值]/数量n/品质Q;\n        夺灵→己方L/目标L/目标剩余寿命占总寿命比}\n    - ${确认 Z%/W 检索与"修行速度"或"修为获取"直接相关的加成}\n    - ${确认本次闭关的时长是否会触发<rule ref="突破规则"/>}\n  --\x3e\n  <action_info>\n    {修为状态总览}\n    | 人物: [姓名] | 境界: [当前境界] (L=[L]) | 修为池: [当前修为X] / [Y] |\n    | 元阳/元阴: [有/无] | 当前天谴值: [X] | 当前丹毒值: [X] |\n    {修为获取分析}\n    | 途径: [修炼 / 服丹 / 双修(略过/详细) / 夺灵] | 时间T: [X天 / X次互动] |\n    {参数检定}\n    (若为修炼:)\n    | 功法: [心法名][修行速度] -> κ=[修行速度]/10^(L+1)=[X] | 灵根 R=[X] |\n    | 界域: D=[X] -> E_realm=(D/L)²=[X] | 局部: [环境描述] E_local=[X] |\n    | 每日获取: κ[X] × (1+R)[X] × (E_realm+E_local)[X] = [X] 修为/天 |\n    | 附带炼化: 根骨[X]->淬毒系数(1+根骨×0.1)[X] | 排毒 [Z%]_毒=[X%] [W]_毒=[X] |\n    | 每日炼化: floor(10^[L]×0.2×淬毒系数[X]×(1+[Z%]_毒))+[W]_毒 = [X]/天 -> 累计清除 min(丹毒[X], ×T[X天]) = [X] |\n    | 丹毒累积: [旧X] -> [新X] |\n    (若为服丹:)\n    {第一步·修为(逐种丹药)}\n    | [丹药名i] | 品质[凡~天](Q=[X]) | 数量[n] | 提升值[X] -> 修为小计 提升值×n=[X] |\n    | ...(其余丹药逐行同上) |\n    | 修为合计: Σ(提升值×数量) = [X] |\n    {第二步·丹毒(逐种丹药)}\n    | [丹药名i] | 提升值[X]×数量[n]×(1−Q/2)[X] -> 毒源[X] |\n    | ...(其余丹药逐行同上) |\n    | 毒源合计: Σ = [X] | 排毒 [Z%]_毒=[X%] [W]_毒=[X] |\n    | 丹毒增量: Max(0, floor(毒源合计[X]×0.3×(1−[Z%]_毒)) − [W]_毒) = [X] |\n    | 丹毒累积: [旧X] -> [新X] |\n    (若为双修:)\n    | 功法: [双修功法名][修行速度] -> κ=[修行速度]/10^(L+1)=[X] | 己方L=[X] | 对方L=[X] |\n    | 境界补正 C: Max(0.1, 1+([对方L]-[己方L])×0.5) = [X] |\n    | 单次基数: κ[X] × C[X] × (1+R)[X] = [基数] |\n    | 本源检定: 男方[元阳:有/无,灵蕴=X] | 女方[元阴:有/无,灵蕴=X] | V=[X] |\n    | 本源馈赠: min(10^对方L×V[X], 10^己方L×100[X]) = [馈赠] (一次性) |\n    | (略过) 岁月积累 = 基数[X] × T[X天] × 5 = [X] |\n    | (详细) 互动累积 = 基数[X] × N[X次] = [X] |\n    | 本源变化: 男方:元阳:[有/无]->[无] | 女方:元阴:[有/无]->[无] | (触发本源馈赠强制双方失去元阴、元阳)\n    (若为夺灵/采补:)\n    | 判定: 目标[修士/凡人] | L_eff=min(己方L[X], 目标L[X])=[X] |\n    | 寿命比: 剩余[X]年 / 总寿命[X]年 = [X%] |\n    | 收益核算: 10^L_eff[X] × 50 × 寿命比[X%] = [X] |\n    {数值结算}\n    | 增减益: Z%=[X%] | W=[X] |\n    | 公式代入: [展示完整代入过程] |\n    | 获得修为: +[最终数值] |\n    | 结算判定: 修为 [旧X] -> [新X] / [Y] | 进行突破: [是/否](默认否) |\n    (若为夺灵附加:)\n    | 目标代价: [目标名] -> [境界跌落/废人/死亡干尸] |\n    | 天谴增量: floor(10^目标L) | 凡人 1/人 -> 天谴 [旧X] -> [新X] |\n  </action_info>\n  叙事指导:\n  - 若 E_realm 极低,描摹灵气稀薄修炼困难\n  - 夺灵/采补: 不直接描绘天谴累积\n</rule>';

const Cultivation_Card_Game_raw_namespaceObject_17 = '<rule name="战斗规则">\n# 参数声明:\n  L=境界系数 Q=品质系数 R=灵根系数\n  [Z%] = 匹配当前计算属性的 max(相关增益%) - max(相关减益%)\n  [W] = 匹配当前计算属性的 max(相关增值) - max(相关减值)\n  （注:Z%与W为动态求值,如在计算“遁速”时,仅检索与遁速相关的状态加成,绝不可代入攻击或防御类加成）\n\n# 核心触发条件: \n  激活:\n    1. 明确进入"双方"战斗\n    2. 强行破阵（与阵法战斗）\n  禁止:\n    1. 单方面碾压（如:境界差距L>2、处置俘虏、屠杀、剿灭溃逃之敌）\n    2. 非战斗（如:卷入高阶修士战斗余波、性交、社交威压）\n\n# 流程逻辑:\n  1. 战斗轮: 战况总览→行动顺序→战斗单位依次执行[攻击行动+(可选)战术动作]→(可选)战意判定→(若结束)战斗结算\n  2. 行动次数: 每战斗单位每战斗轮仅执行1[攻击行动]1[战术动作]\n  3. 指令裁定: 按战斗单位拆解<user>指令。若单一单位下达多个同类行动（如连续攻击、顺次用药）,仅采纳首项前序指令；不同单位的并行指令独立生效\n  4. 频率: 正文仅输出1战斗轮,完成后截断正文等待<user>下轮命令\n\n# 战况总览:\n  逻辑与规则:\n    1. 战斗类型: 切磋/压制/死斗\n    2. 战斗单位确认:\n      - 战斗单位仅人物、灵兽、傀儡、阵法(由阵法类功法创建的临时实体)\n      - 仅任一方存在≥3个同类低级单位时,可聚合为[集群](个体×N)\n    3. 状态展示:\n      - 面板中展示全部战斗单位及其状态\n      - 阵法若战斗开始前存在则无需结阵\n\n  面板模板(输出前先以 \x3c!-- ... --\x3e 完成思考):\n  \x3c!--\n    - ${从<status_current_variables>确认处于出战状态的正确战斗单位}\n    - ${确认战斗单位境界L、遁速、防御等关键参数}\n    - ${确认战斗单位当前使用中的功法/装备/物品/技能,确认各项效果与对应数值(若无则为空手)}\n    - ${确认战斗单位本战斗轮的[攻击行动]与[战术动作]分配意图}\n    - ${检索<user>描述关键词,确认意图路由结果(常规/战术/幻术/神识/破阵)}\n    - ${确认Z%与W: 仅检索与本次计算属性直接相关的加成,列出来源}\n  --\x3e\n  <battle_info>\n    {战况总览}\n    | 回合: [当前回合数] | 类型: [战斗类型] | 环境: [简述环境] |\n    | [境界] | [五行] | [阵法A (结阵中or已结阵)]: 灵气 [X/X] (可选: | 状态: [状态名(N回合)]) |\n    | [境界] | [五行] | [人物B/人物集群B (当前存活数/初始数)]: 气血 [X/X] | 灵气 [X/X] | 遁速[X] | 战斗技艺: [仅列非零项,如 阵法10 神识5;全零省略] (可选: | 状态: [状态名(N回合)]) |\n    | [境界] | [五行] | [灵兽C/灵兽集群C (当前存活数/初始数)]: 气血 [X/X] | 灵气 [X/X] | 遁速[X] 防御力[X] (可选: | 状态:[状态名(N回合)]) |\n    | [境界] | [五行] | [傀儡D/傀儡集群D (当前存活数/初始数)]: 气血 [X/X] | 灵气 [X/X] | 遁速[X] 防御力[X] (可选: | 状态: [状态名(N回合)]) |\n    | [境界] | [五行] | [人物E/人物集群E (当前存活数/初始数)]: 气血 [X/X] | 灵气 [X/X] | 遁速[X] | 战斗技艺: [仅列非零项,如 阵法10 神识5;全零省略] (可选: | 状态:[状态名(N回合)]) |\n    | ...列出全部参战单位\n  </battle_info>\n  叙事指导: (勾勒当下对峙之势,环境意趣,人物气度仪表)\n\n# 行动顺序: \n  逻辑与规则:\n    1. 公式:\n      - 人物：[战斗遁速]=Max(0,floor((人物[遁速]+身法[遁速])×(1+[Z%])+[W]))\n      - 灵兽：[战斗遁速]=Max(0,floor(灵兽[遁速]×(1+[Z%])+[W]))\n  + [咒法]×(1+L×0.2))*(1+[Z%])+[W]\n        * 傀儡/灵兽攻击:floor(10^L + 技能[攻击力])*(1+[Z%])+[W]\n        * 阵法攻击:floor(10^L + 阵法[攻击力])*(1+[Z%])+[W]\n      - 五行生克系数: //进攻功法五行vs护体功法,无则为混沌\n        * 非咒法攻击: 克制1.25 | 被克制0.75 | 无克制1.0\n        * 咒法攻击: 克制1.5 | 被克制0.5 | 无克制1.0\n      - 穿透与减免:\n        * [穿透%]: 攻方L*10% + [Z%]\n        * [减免%]: 守方L*10% + [Z%]\n        * 总防御力: 受击位置护甲[防御力]+护体功法[防御力]+[W]\n        * 结算伤害: 最终伤害 = Max(0, 基础伤害 - 总防御力) × (1 + [穿透%] - [减免%]) × [五行生克系数]\n      - 集群修正: 对集群单位的最终伤害 ×1.5\n      - 伤害应用:\n        * 人物: if 护体功法[灵气受击]: 灵气-=伤害; 溢出=max(0,-灵气); 气血-=溢出 else: 气血-=伤害\n        * 阵法: 灵气-=伤害\n        * 傀儡/灵兽: 气血-=伤害\n      - 生死判定:\n        * 人物/傀儡/灵兽: 气血 ≤ 0 -> [死亡/毁坏]\n        * 阵法: 灵气 ≤ 0 -> [停止运转]\n      - 死亡处理:\n        * 人物死亡: 从 关系列表 移除(NPC) 或 终结剧情(<user>)\n        * 傀儡毁坏: 从 傀儡 字典移除(若残骸尚可修复则保留并在描述中说明)\n        * 灵兽失控: 从 主人.灵兽 字典移除,以 类型=\'灵兽\' 条目重新登记到 关系列表(无主形态;失控/暴走/转敌对仅在叙述中体现,无字段开关)\n        * 主人(人物)死亡: 名下傀儡/灵兽随之退出战斗,后续命运由叙事决定\n\n  面板模板:\n  <battle_info>\n    {攻击行动}\n    | 攻方: [攻击者] 守方: [目标] | 招式: [技能名/无] | 法宝: [装备名/空手] |\n    | 消耗: 当前[资源]-消耗[资源] -> 剩余[资源] |\n    | 集群攻击: 气血[m%] -> 次数[N] | (仅集群)\n    {意图对抗} (仅幻术/神识/破阵/战术意图时显示)\n    | 路由: [关键词] -> [战术/幻术/神识/破阵]意图 | 难度=[D] | 技艺=[技艺名] |\n    | 攻方: floor(10^L+[技艺]×(1+[Z%])+[W]) × d20[骰值] = [A] |\n    | 守方: floor(10^L+[技艺]×(1+[Z%])+[W]) × (d20[骰值]+[D]) = [B] |\n    | 判定: [A] vs [B] -> [成功/失败] |\n    | 神识伤害应用: Max(10^L,功法[攻击力]) = [伤害值],[目标] 气血 [旧值]->[新值] (-[伤害值], 不致死) | (仅神识成功时,跳过伤害结算直接扣除)\n    | 破阵伤害应用: Max(10^L, [技艺]×(1+[Z%])+[W]) = [伤害值],[阵法] 灵气 [旧值]->[新值] (-[伤害值]) | (仅破阵成功时)\n    | 状态效果: [目标]获得[状态名]([具体效果]), 持续[N]回合 | (仅成功施加状态时)\n    (幻术/神识/破阵意图: 判定后本次行动结束,不进入攻击检定与伤害结算)\n    (战术意图: 判定后继续进入攻击检定)\n    {攻击检定} (常规攻击 或 战术意图后继续)\n    | 命中: ([功法命中 | 1+floor(L/2)])+[W] = [b] |\n    | 闪避: ([身法闪避 | 1+floor(L/2) | 0])+[W] = [c] |\n    | 攻方: [战斗遁速] × (d20[骰值]+[b]) = [X] |\n    | 守方: [战斗遁速] × (d20[骰值]+[c]) = [Y] |\n    | 结果: [X] vs [Y] -> [命中/失手] |\n    {伤害结算} (仅攻击检定命中后)\n    | 基础伤害: [攻击类型] -> [对应基础伤害公式] = [J] |\n    | 五行 [B] -> [逃跑成功/失败] |\n  </battle_info>\n  叙事指导: (描摹战术,如服药动作、咒语咏唱、结阵吟诵、飞遁之姿)\n\n# 战意判定: (条件触发)\n  逻辑与规则:\n    1. 触发: 仅非<user>人物气血低于战斗类型对应阈值时,允许该单位做出退出战斗的行为选择\n    2. 气血阈值(低于此值方可选择退出):\n        | 战斗类型 | 阈值 | 说明 |\n        | --- | --- | --- |\n        | 切磋 | 40% | 认输/中止 |\n        | 压制 | 50% | 求饶/投降 |\n        | 死斗 | 10% | 求饶/自爆/元婴外逃 |\n\n  面板模板:\n  <battle_info>\n    {战意判定}\n    | 触发: [人物名] 气血 [当前/最大]([百分比]) < [战斗类型]阈值 [X%] |\n    | 行为: [人物名] [选择的行为] |\n  </battle_info>\n  叙事指导: (触发时描摹。述敌手认输、求饶之态)\n\n# 战斗结算 (战斗结束时)\n  逻辑与规则:\n    1. 触发: 一方全灭/成功逃跑/投降时输出\n    2. 状态结算: 依据<rule ref="状态规则"/>进行战斗→非战斗状态转化\n    3. 战利品: 参考<rule ref="物品功法生成规则"/>\n      - 必须列出具体物品清单: 灵石(具体数量)、素材、秘籍、丹药、配方等\n      - 禁止以"储物袋"笼统代替,需逐项列明内容物\n      - 若非<user>击败(NPC击败/仅协助观战等)则无战利品\n\n  面板模板:\n  <battle_info>\n    {战斗结算}\n    | 结果: [胜利/逃跑成功/失败] |\n    | 战果: [简述战况后果] |\n    | 状态结算: [状态A->非战斗状态X, 状态B->消散] | (有状态时显示)\n    {战后状态}\n    | [<user>]: 气血 [X/X] | 灵气 [X/X] |\n    | [队友A]: 气血 [X/X] | 灵气 [X/X] | (若有队友)\n    | [傀儡]: ([可用数]/[总数]) | (若有傀儡)\n    {战利品} (仅<user>胜利且有战利品时)\n    | 灵石: [X]枚 |\n    | 物品: [物品名A(品阶)], [物品名B(品阶)], ... |\n  </battle_info>\n  叙事指导: (描摹战罢场景,<user>检视储物袋/搜刮战场过程,打开检查或神识扫过,列明所获之物)\n</rule>\n';

const Cultivation_Card_Game_raw_namespaceObject_19 = '<rule name="状态规则">\n# 状态定义与输出格式 (需严格按此结构输出)\n &S_状态:\n  名称: [简练标识符, 标明上限, 如:中毒(上限10层)]\n  类型: [增益 | 减益 | 特殊]\n  层数: [num, 默认1]\n  时间: [战时:X回合 | 非战:X时辰/刻 | 永久 | 直至解除/触发/条件消失]\n  来源: [施加者/技能/物品]; [解除方式或触发条件]\n  效果: [参考*&RULE_效果加值指导]\n\n# 状态机运行逻辑 (check)\n 逻辑约束:\n  - 格式: [严格按 *S_状态 结构逐行输出,缺一不可,效果必须数值化]\n  - 叠加: [同名同源: 取高效果/刷新时间/层数+1; 同名异源: 独立计时]\n  - 转化: [进战: 时限转为回合; 脱战: 时限转为时辰(自身增益上限4时辰)]\n  - 结算: [战时: 回合前结算增益 → 行动 → 回合后结算减益; 非战: 随时间流逝生效]\n  - 交互: [目标体质/装备可产生豁免; 驱散须对应状态分类(如神识类需凝神手段)]\n</rule>';

const Cultivation_Card_Game_raw_namespaceObject_21 = "<%_ { _%>\n<%_\nconst 世界 = getMessageVar('stat_data.地点.世界') || '凡界';\n\nconst 凡界版本 = `<world_hierarchy>\n世界层级: 凡界 → 灵界 → 仙界\n凡界(当前):\n- 凡人为主，修士极少\n- 化神之后修行极难，灵界通道在上古已关闭\n- 进入灵界的方式（极其危险）:\n  → 找到空间裂缝（偶然出现，极不稳定）\n  → 肉身撕裂虚空（需化神后期修为，九死一生）\n灵界:比凡界广阔万倍，万千凡界生灵汇聚而来，万族共存\n仙界:传说可以从灵界飞升到达，无人见过，仅有古籍残页提及\n冥界:生灵死后进入的世界\n</world_hierarchy>\n\n<realm name=\"凡界\">\n凡界世界地图:\n\\`\\`\\`mermaid\ngraph TD\n    subgraph 无尽海域[无尽海域 - 环绕包围整个凡界大陆]\n        direction TB\n        North[北境]\n        West[西域] <--\x3e Central{中原} <--\x3e East[东土]\n        South[南疆]\n        North <--\x3e Central\n        Central <--\x3e South\n        North -.- West\n        North -.- East\n        South -.- West\n        South -.- East\n    end\n\\`\\`\\`\n跨越单大域时间:\n  L=0 (凡人/练气期): 遁速极慢，跨越一域需 300~500 年（常人终其一生难以跨域）\n  L=1 (筑基期): 跨越一域需 30~50 年\n  L=2 (金丹期): 跨越一域需 3~5 年\n  L=3 (元婴期): 跨越一域需 3~6 月\n  L=4 (化神期): 跨越一域仅需 10~15 天\n叙述指导:\n  低阶修士（金丹及以下）跨域绝不会采用常规飞行，必须借用【跨域传送阵】\n  若无传送阵，低阶修士的跨域之行无异于愚公移山；元婴以上大能则可凭借自身遁光游历四方\n</realm>`;\n\nconst 灵界版本 = `<world_hierarchy>\n世界层级: 凡界 → 灵界 → 仙界\n凡界: 世间有万千凡界、诸天生灵起源之地、实际情况不一\n灵界(当前):\n- 万千凡界生灵汇聚之地、万族共存的广袤世界\n- 灵气浓郁、修行速度远胜其他世界，因此被称为灵界\n- 凡界飞升而来的修士比原住修士更受势力青睐\n仙界: 传说可由灵界渡劫飞升而至，但从无任何人从仙界返回或传回信息\n</world_hierarchy>\n\n<realm name=\"灵界\">\n灵界世界地图:\n\\`\\`\\`mermaid\ngraph TB\n    subgraph 虚海[无底深空·七大陆漂浮其上]\n        玄黄大陆 <--\x3e 圣银大陆\n        玄黄大陆 <--\x3e 黄泉大陆\n        玄黄大陆 <--\x3e 灵境大陆\n        玄黄大陆 <--\x3e 万兽大陆\n        圣银大陆 <--\x3e 灵境大陆\n        黄泉大陆 <--\x3e 万兽大陆\n        太初大陆 -.- 玄黄大陆\n        殒落大陆 -.- 玄黄大陆\n    end\n\\`\\`\\`\n\n跨大陆通行方式:\n  灵界传送阵: 各大陆设接驳枢纽、需付灵石、瞬息即至\n  虚海飞舟: 普通飞舟跨虚海需月余、顶级飞舟数日、途中可能遇浮岛/海妖/星雾\n  返虚以上(L>=5)自飞: 凭遁光跨虚海\n</realm>`;\n\nconst outputText = 世界 === '灵界' ? 灵界版本 : 凡界版本;\n_%>\n<%- outputText %>\n<%_ } _%>\n";

const Cultivation_Card_Game_raw_namespaceObject_23 = "<%_ { _%>\n<%_\n// 叙事辅助: 仅当最近剧情命中相应技艺关键词时, 才在该技艺下展开叙事指导, 避免常驻占用注意力\nlet scanText = '';\ntry {\n  const recent = getChatMessages(`${Math.max(0, lastMessageId - 4)}-${lastMessageId}`) || [];\n  scanText = recent.map(m => (typeof m === 'string' ? m : (m && m.message) || '')).join('\\n');\n} catch (e) {}\nconst 命中 = (kws) => kws.some(k => k && scanText.includes(k));\nconst KW = {\n  炼丹: ['炼丹', '丹药', '丹炉', '丹方', '药性', '火候', '开炉', '丹毒', '丹劫', '炼制丹'],\n  咒法: ['战斗', '交手', '出手', '厮杀', '术法', '施法', '对敌', '缠斗', '恶战', '偷袭', '遇袭', '交锋'],\n  御物: ['御剑', '飞剑', '剑意', '剑气', '剑修', '仗剑', '剑光', '剑诀', '本命剑', '剑灵'],\n  阵法: ['阵法', '布阵', '阵旗', '阵盘', '阵眼', '结界', '杀阵', '迷阵', '聚灵阵', '破阵', '阵修'],\n  炼体: ['淬体', '炼体', '淬炼', '锤炼肉身', '血脉', '筋骨', '脏腑', '洗髓', '易筋', '锻体'],\n  医术: ['医术', '诊脉', '施针', '行针', '针灸', '汤药', '疗伤', '治伤', '救治', '调养', '经脉', '药石', '大夫', '郎中', '医者', '续命'],\n  毒术: ['毒术', '下毒', '用毒', '中毒', '毒物', '毒虫', '五毒', '蛇毒', '蝎毒', '蟾酥', '蛛毒', '蜈蚣', '剧毒', '毒液', '蛊毒', '解毒', '毒发', '淬毒']\n};\n_%>\n<skill>\n# 生产技艺\n  - 炼丹: 提炼天地灵草与妖兽内丹精华，炼制具有疗伤、突破瓶颈、短时增益或剧毒效果的丹药\n<%_ if (命中(KW.炼丹)) { _%>\n     叙事辅助:\n     - 材料: 药性叙述；五行调和；预处理\n     - 火候: 火源品级；温度切换; 火候控制\n     - 技法: 场地布置→ 结印法诀→ 控制灵力剥离杂质\n     - 风险: 非必须,如:炸炉、丹毒、丹劫、走火入魔、丹药副作用\n     - 品相: 圆润度、丹纹丹晕、开炉异象\n<%_ } _%>\n  - 炼器: 熔炼灵矿、妖骨与天材地宝，打造护甲、饰品、法宝及各类功能性修仙用具\n  - 制符: 以符纸、灵墨（或妖血）为载体，将法术封印其中，以便瞬间激发\n  - 驯兽: 沟通、威压并降服妖兽、灵宠或凶虫。用于协助战斗、充当坐骑或看守洞府\n  - 培育: 种植并催熟灵草仙药，或孵化、繁育罕见的灵虫、蛊毒及异种胚胎\n  - 医术: 诊脉施针、调养经脉、辨药祛毒。处理一切关乎肉身生机与灵魂修复的精微疗术\n<%_ if (命中(KW.医术)) { _%>\n     叙事辅助(医术):\n     - 诊断: 望闻问切；察气色、听声息、问症候、切脉象；辨阴阳表里、虚实寒热\n     - 病理: 经络壅塞、气血亏虚、灵脉逆乱、外邪入体\n     - 施治: 针石开穴、艾灸温经、汤药调理、推拿导引；以灵气续接断脉、温养神魂\n     - 药理: 君臣佐使配伍；四气五味；循五行相生相克调和脏腑\n<%_ } _%>\n<%_ if (命中(KW.毒术)) { _%>\n     叙事辅助(毒术):\n     - 蚀(蝎毒): 持续侵蚀、缓慢死亡；每回合持续掉血/掉灵力，越拖越痛\n     - 痹(蜈毒): 麻痹控制、阻断行动；减速/定身/无法施法，令其动弹不得\n     - 腐(蟾酥): 腐蚀防御、削弱抗性；降低护甲/灵力盾，令其越来越脆\n     - 幻(蛛毒): 致幻干扰、制造破绽；幻觉/混乱/误判，诱其自行出错\n     - 噬(蛇毒): 吞噬灵力、以战养战；夺敌灵力为己用，越打越强\n<%_ } _%>\n# 战斗技艺\n  - 咒法: 结印施展法术。种类多 const Cultivation_Card_Game_raw_namespaceObject_25 = '<%_ { _%>\n<%_\nconst world = getMessageVar(\'stat_data.地点.世界\') || \'凡界\';\n\nconst 凡界版本 = `<economic_system world="凡界">\n# 核心设定与背景\n  1. 唯一定价单位: 默认以【下品灵石】为唯一计量单位、简称为"灵石"(如:500灵石)\n  2. 叙事指导: "修仙界高阶灵石蕴含灵气参差不齐、且多被用于吸收或阵眼、极少流通。下品灵石产量庞大、灵气稳定、易于分割。因此【下品灵石】作为通用的唯一标准计价货币。"\n\n# 汇率\n  1. 灵石兑换比 (异常输入换算使用):\n     - 1 上品灵石(亦称极品灵石) = 10,000 灵石\n     - 1 中品灵石 = 100 灵石\n     - 1 下品灵石 = 1 灵石\n     - 叙事指导: 花费10极品灵石 → 花费10万灵石\n  2. 凡俗金银兑换 (凡人适用):\n     - 修士凡俗开销忽略不计\n     - 1 灵石 = 100 两黄金 = 1,000 两白银 = 1,000,000 文铜钱\n\n# 物品定价公式\n  标准基准价 = floor( 基础乘数 × 10^L × 品质溢价 ) [单位: 灵石]\n  - [L]: 境界系数 (凡界 L=0~5)\n  - [基础乘数]:\n    | 类别 | 乘数 | 说明 |\n    | --- | --- | --- |\n    | 素材/情报线索 | 1.0 | 高等素材有价无市 |\n    | 丹药/符箓 | 2.0 |  |\n    | 武器/防具/饰品/普通阵盘 | 2.0 |  |\n    | 功法(心法/攻击/等) | 10.0 | 高等功法有价无市 |\n    | 法宝/傀儡/灵兽/秘法 | 5.0 |  |\n  - [品质溢价]:\n    | 凡 | 黄 | 玄 | 地 | 天 |\n    | --- | --- | --- | --- | --- |\n    | x 1~2 | x 3~5 | x 10~15 | x 30~50 | x 100~150 |\n\n# 服务类花费公式\n  公式: 服务费 = floor( 10^L × 服务乘数 ) (L=目标境界系数)\n  - 枚举与乘数:\n    | 服务类别 | 乘数 | 说明 |\n    | --- | --- | --- |\n    | 洞府租赁 | 0.5 | 按【月】计、如:租用适合筑基期(L=2)修炼的洞府 = 50灵石/月 |\n    | 雇佣护卫/保镖 | 20.0 | 按【次】计。雇佣修士卖命 |\n    | 寻医疗伤/驱毒 | 1.0 | 按【次】计。化解伤势或毒素 |\n    | 鉴定/破阵/推演 | 1.5 | 按【次】计。鉴定法宝、破解阵法 |\n    | 委托炼制 | 3.0 | 按【次】计。仅手工费、材料自备(炼制失败通常不退) |\n  - 固定收费:\n    跨域传送阵: 1000 灵石/次/人 (大宗门有私有传送阵)\n    洞府租金: 普通洞府 50~100灵石/年; 高级洞府 1000~2000灵石/年\n    洞府购买: = 租金 × 100年\n\n# 收入来源公式\n  1. 月俸 (被动收入):\n     - 公式: 俸禄 = floor( 10^角色L × 地位乘数 × 宗门类型 ) / 月\n     - 地位乘数: 外门/旁系=0.5~0.6 | 内门/嫡系=1.0~2.0 | 亲传/长老=3.0~5.0\n     - 宗门类型: 凡人王朝=0.1 | 修仙王朝/小型宗门=0.8 | 大型宗门=1.0\n  2. 悬赏/委托任务 (主动收入):\n     - 公式: 赏金 = floor( 10^任务L × 难度乘数 )\n     - 难度乘数: 跑腿寻物=1.0 | 猎杀妖兽=3.0 | 极度危险/死士任务=10.0\n</economic_system>`;\n\nconst 灵界版本 = `<economic_system world="灵界">\n# 核心设定与背景\n  1. 唯一定价单位: 默认以【下品灵石】为唯一计量单位、简称为"灵石"(如:500灵石),与凡界通用同一种灵石\n  2. 叙事指导: "灵界万族杂居、贸易繁盛,与凡界一样以【下品灵石】为通用标准货币。高阶灵石灵气参差、多用于吸收或阵眼、极少流通;下品灵石灵气稳定、易于分割,故各族公认为通用计价单位。"\n\n# tputText %>\n<%_ } _%>\n';

const Cultivation_Card_Game_raw_namespaceObject_27 = "<talent>\n# 灵根类型与品阶: //具灵根者万里挑一,然天下凡人数以万亿,修士仍不计其数\n  | 灵根品阶 | 别称(仅用于叙述) | 说明 | 示例名称 |\n  | :--- | :--- | :--- | :--- |\n  | 无灵根 | 凡人 | 无法修炼,或可通过秘法接续或夺取他人灵根进行修炼 | 无灵根 |\n  | 五灵根 | 全灵根 | 比单灵根更罕见,五行俱全但修行速度极慢,上古时代曾有专有秘法但现已失传 | 金木水火土五灵根 |\n  | 四灵根 | 伪灵根 / 杂灵根 | 最为常见,在宗门中一般作为杂役或外门弟子 | 木水火土四灵根 |\n  | 三灵根 | 真灵根 | 宗门的中坚力量,是进入内门弟子的基本门槛 | 金木水三灵根 |\n  | 双灵根 | 地灵根 | 属于天才之列,修行速度快,前途无量 | 木水双灵根 |\n  | 单灵根 | 天灵根 | 绝世天骄,常为亲传弟子,大宗门招揽的目标 | 火灵根 |\n  \n# 灵根变异\n  - 约束: 仅单灵根可发生变异,仍然具有原本五行属性,阴、阳、混沌属性灵根也可变异。变异灵根资质比一般单灵根更优\n  - 变异示例:\n  | 五行 | 示例名称 |\n  | :--- | :--- |\n  | 金 | 剑灵根、血灵根 |\n  | 木 | 风灵根、毒灵根 |\n  | 水 | 冰灵根、雾灵根 |\n  | 火 | 雷灵根、冥火灵根 |\n  | 土 | 磁灵根、沙灵根 |\n  | 阴 | 幽灵根、煞灵根 |\n  | 阳 | 龙灵根、梵灵根 |\n  | 混沌 | 虚空灵根、混元灵根、时空灵根 |\n\n# 体质类型\n  | 体质品阶 | 修士类型 | 示例名称 | 三维总和(S) |\n  | :--- | :--- | :--- | :--- |\n  | 凡体 | 普通修士 | 凡骨 | 15 ~ 30 |\n  | 灵体 | 大能修士 | 蛮力之躯、通透玲珑心、赤焰灵体、先天剑体 | 31 ~ 50 |\n  | 道体 | 气运之子 | 荒古圣体、天雷殛体、大罗玲珑体 | 51 ~ 75 |\n  | 仙体 | 真仙血脉 | 太初真魔体、不死不灭躯、虚空幻灭体 | 76 ~ 100 |\n</talent>";

const Cultivation_Card_Game_raw_namespaceObject_29 = "<ethnic>\r\n# 仙凡有别: 凡人寿命短暂,修士不屑于干涉凡人事务\r\n# 婚恋人伦:\r\n  - 驻颜: 修士容颜定格于巅峰之时。唯寿元将尽、身受重创、修炼邪法者形容枯槁\r\n  - 妻妾道侣: 强者寿命悠长,拥有三妻四妾极为寻常,配偶数取决于自身实力与地位\r\n  - 女修衣着: 女修乐于裸露肌肤,彰显其肉体美丽强大,与凡俗保守伦理截然相反\r\n  - 元阴元阳: 处女拥有元阴,处男拥有元阳。初次性交(肛交/口交/自慰除外)导致元阳或元阴泄露,可用双修之法吸收获得大量修为。抓取炉鼎倾向处女、处男。少数浪荡者偏好肛交保留自身元阴\r\n  - 双修: 双修必须通过性交完成,必须将阴茎插入阴道才可双修\r\n# 日常社交:\r\n  - 神识探查: （默认为普通探查）\r\n    * 普通探查: 探查范围内的大致情况,修士可感知同阶或低阶修士的探查\r\n    * 侵入性探查: 肆意探查同阶或高阶修士的私处、储物袋、闭关之地是绝对的挑衅行为,等同于宣战\r\n  - 心魔大誓: 以天道或心魔立下誓言,具有绝对的法则约束力。若违背,必定走火入魔。修士极少轻易发誓\r\n  - 燃烧精血: 部分威力强大的功法需要燃烧精血使用,每使用1滴精血-1年寿命\r\n<%_ { _%>\r\n<%_\r\n// , 依 MVU 灵根品阶推定 <user> 资质档(参考<talent>灵根品阶与体质三维) ,\r\nconst 品阶 = getMessageVar('stat_data.灵根.品阶') || '未检测';\r\n// 体质三维总和 S = 悟性+根骨+气感,仅用于\"绝世天骄\"判定(<talent>: 道体 S≥51、仙体 S≥76)\r\nconst S = (Number(getMessageVar('stat_data.体质.悟性')) || 0)\r\n        + (Number(getMessageVar('stat_data.体质.根骨')) || 0)\r\n        + (Number(getMessageVar('stat_data.体质.气感')) || 0);\r\nconst 道体以上 = S >= 51;\r\nlet 资质 = null;\r\nswitch (品阶) {\r\n  case '五灵根': 资质 = '劣等资质'; break;          // 五灵根罕见却修行极慢\r\n  case '四灵根': 资质 = '中下资质'; break;\r\n  case '三灵根': 资质 = '中等资质'; break;\r\n  case '双灵根': 资质 = '中上资质'; break;\r\n  case '单灵根': 资质 = 道体以上 ? '绝世天骄' : '天骄'; break; // 单灵根(含变异/混沌)+道体级体质以上→绝世天骄,否则天骄\r\n  // 无灵根/未检测/未知/其它 → 资质=null → 整个态度库不输出\r\n}\r\n// 元阴/元阳: 仅处子拥有(体质.元阴=女处子、体质.元阳=男处子),用于双修炉鼎/机缘的动态描写\r\nconst 元阴 = getMessageVar('stat_data.体质.元阴') === true;\r\nconst 元阳 = getMessageVar('stat_data.体质.元阳') === true;\r\nconst 元名 = 元阴 ? '元阴' : (元阳 ? '元阳' : '');\r\nconst 态度库 = {\r\n  '劣等资质': `资质=劣等(五灵根·五行俱全却修行极慢):灵根稀罕引人讶异,知其修炼龟速后化作惋惜;同侪好奇而不亲近、长辈不苛待亦不肯投资`,\r\n  '中下资质': `资质=中下(四灵根·外门弟子之材):泯然众人;平淡是底色,不惹眼亦不遭嫉`,\r\n  '中等资质': `资质=中等(三灵根·内门弟子之材):同侪资质相仿，既有并肩历练，亦有为机缘竞争;长辈予寻常关照与偶尔点拨`,\r\n  '中上资质': `资质=中上(双灵根·亲传弟子之材):资质上乘;长辈乐于栽培、赐功法丹药或收作亲传`,\r\n  '天骄': `资质=天骄(单灵根·顶尖资质):各方势力暗中角力延揽；广受异性青睐;但殷勤背后图的是<user>天资前程${元名 ? '、抑或'+元名+'中蕴藏的大机缘' : ''}`,\r\n  '绝世天骄': `资质=绝世天骄(单灵根+道体级以上体质·足以惊动大能):此资质千年难遇;宗门倾尽所有供奉护持,巨擘不惜代价争收为亲传;被异性视为最佳道侣。然${元名 ? '<user>身负的'+元名+'与' : '<user>'}那绝世道体,亦是邪修老怪垂涎的无上炉鼎,追逐者既有真情倾慕、更有欲夺造化置<user>于死地的杀机`,\r\n};\r\nconst 态度 = (资质 && 态度库[资质]) ? 态度库[资质] : ''; // 资质未定(未检测)或该档未写 → 空,整段不输出\r\n_%>\r\n<%_ if (态度) { _%>\r\n# NPC对<user>的态度: \r\n<%- 态度 %>\r\n<%_ } _%>\r\n<%_ } _%>\r\n</ethnic>";

const Cultivation_Card_Game_raw_namespaceObject_31 = "<%_ { _%>\n<%_\nconst world = getMessageVar('stat_data.地点.世界') || '凡界';\nlet scanText = '';\ntry {\n  const recent = getChatMessages(10) || [];\n  scanText = recent.join('\\n');\n} catch(e) {}\nconst mentioned = (kws) => kws.some(kw => kw && scanText.includes(kw));\n\nconst RACES = [\n  {\n    name: '人族',\n    brief: `人族: 世间最常见的种族`\n  },\n  {\n    name: '神族',\n    keywords: ['神族', '半神', '神格', '神性血脉'],\n    brief: `神族: 上古神格血脉延续、大多天赋不凡`,\n    detail: `神族 (上古神格血脉的延续者):\n  伦理: 等级森严(以血脉纯度定地位),多为近亲通婚甚至回交,几乎不与低等血脉者通婚\n  特性: 神识强大，以神识和幻术类功法见长`\n  },\n  {\n    name: '巫族',\n    keywords: ['巫族', '巫祝', '蛮荒巫', '血祭', '巫祭', '巫咒'],\n    brief: `巫族: 蛮荒巫祝后裔、与天地鬼神立约的古老种族`,\n    detail: `巫族 (蛮荒巫祝后裔):\n  伦理: 重承诺(诺言即契约)；尊重强者，会对击败自己的强者以身相许\n  特性: 肉身强大，以炼体类功法见长`\n  },\n  {\n    name: '妖族',\n    keywords: ['妖族', '走兽', '猛兽', '飞禽', '海族', '异虫', '蛊虫', '祥瑞', '上古遗种', '灾兽', '凶兽', '荒兽'],\n    brief: `妖族: 万兽吸纳灵气而成、少数可开智化形`,\n    detail: `妖族 (万兽吸纳灵气而成):\n  伦理: 化形妖族自视为人，与人族关系中立；被人族猎杀的一般为未化形且未开智的妖兽\n  特性: 每次境界提升时可根据自身血脉回忆出先天传承的功法\n  子类: 走兽, 飞禽, 海族, 异虫, 祥瑞, 龙族, 上古遗种, 灾兽`\n  },\n  {\n    name: '灵族',\n    keywords: ['灵族','木精', '草精', '石精', '真灵', '气象精', '万灵之母'],\n    brief: `灵族: 天地万物吸纳日月精华自然成精`,\n    detail: `灵族 (天地万物吸纳日月精华自然成精):\n  伦理: 诞生时不了解人类伦理，先天行为天真跳脱\n  特性: 不善战斗，擅长于辅助类功法\n  子类: 草木灵, 金石灵, 五行真灵, 气象灵 `\n  },\n  {\n    name: '冥族',\n    keywords: ['冥族', '幽魂', '鬼魂', '鬼煞', '厉鬼', '鬼王', '行尸', '僵尸', '炼尸', '白骨', '骨皇', '怨煞', '阴魔', '血煞'],\n    brief: `冥族: 死后转化、阴气滋养、与活人体质相克`,\n    detail: `冥族 (死亡转化、阴气滋养之族):\n  伦理: 多为爱憎分明敢爱敢恨之人死后所化、极重生前承诺。与非仇人亦可合作\n  特性: 可借尸还魂、寿元无终。易受神魂攻击\n  子类: 幽魂, 行尸, 白骨, 怨煞`\n  },\n  {\n    name: '物化生灵',\n    keywords: ['物化生灵', '器灵', '丹灵', '阵灵', '机傀', '通灵'],\n    brief: `物化生灵: 万物历久成精、有独立意识与人格`,\n    detail: `物化生灵 (万物有灵、器物历久成精):\n  伦理: 重契约重承诺、可择主\n  特性: 靠灵气与本源材料维持、被毁本源则灭\n  子类: 器灵, 丹灵, 阵灵, 机傀`\n  },\n  {\n    name: '魔族',\n    keywords: ['魔族', '羊头', '魅魔', '吸血', '魔功', '魔角', '魔翼', '魔纹'],\n    brief: world === '灵界'\n      ? `魔族: 非邪恶种族且与天魔无关;上古殉族的稀少残脉;灵界少数大能知晓、极受尊重`\n      : `魔族: 非邪恶种族且与天魔无关;数量极端稀少、凡界无人知晓其存在、显异者多被称为妖族`,\n    detail: world === '灵界'\n      ? `魔族 (非邪恶种族且与天魔无关,极端稀有):\n  伦理: 多为混血半魔族，融入其所在社群\n  特性: 天生人形无需化形;每次境界提升可根据血脉回忆出先天传承功法\n  社会认知: 被多数人视为妖族；灵界仅少数高阶大能知晓、视为上古殉族遗珠、照拂有加\n  子类: 古魔, 魅魔, 翼魔`\n      : `魔族 (非邪恶种族且与天魔无关,极端稀有):\n  凡界认知: 凡界无人知晓魔族真名、外形显异者均被判为妖族异种(常误归上古遗种/灾兽)\n  特性: 天生人形无需化形;每次境界提升可根据血脉回忆出先天传承功法\n  叙述约束: 凡界NPC一律按\"妖族\"对待此类生灵、不主动揭示真相、不使用\"魔族\"称谓\n  子类: 古魔, 魅魔, 翼魔`\n  },\n  {\n    name: '域外异类',\n    keywords: ['域外异类', '天魔', '域外天魔', '虚空巨兽', '吞星兽'],\n    brief: `域外异类: 游离于世界壁垒外、极难遭遇但极其危险`,\n    detail: `域外异类 (来自虚空，极难遭遇但极其危险):\n  伦理: 无伦理、吞噬意识/星辰/灵气\n  特性: 大多可化形且智力极高；可与他人暂时合作，但大多会被本能驱使最终与一切生灵为敌\n  子类: 域外天魔, 虚空巨兽`\n  }\n];\n\nconst sections = RACES.map(r => {\n  if (r.detail && mentioned(r.keywords)) return r.detail;\n  return r.brief;\n});\n\nconst outputText = `<life_form>\n${sections.join('\\n')}\n</life_form>`;\n_%>\n<%- outputText %>\n<%_ } _%>\n";

const Cultivation_Card_Game_raw_namespaceObject_33 = '<%_ { _%>\n<%_\nconst world = getMessageVar(\'stat_data.地点.世界\') || \'凡界\';\n\nconst 凡界版本 = `<overview>\n创世与上古:\n  - 凡界格局:混沌初开之际,遗留一缕先天造化。界内地貌,分为三陆七海——十之有三为神陆,十之有七为无尽海\n  - 上古极盛:人族禀先天道体,创练气修仙之法。彼时人族皇朝一统神陆,大能者可筑通天大阵,自由跨界,飞升灵界\n归墟之战:\n  - 周期重置:凡界暗藏一极为隐秘之劫律:每逾万年,必有一场"归墟之战"爆发。交战之双方、起衅之根由,尽皆湮没于历史长河,为后世所不知。历次大劫,莫不天地泣血、大能陨落、道统覆灭。修仙文明屡遭强行"收割",周而复始\n  - 绝地天通(距今七千年前):最近一次归墟之战,凡界遭重创。位面通道为伟力所断,彻底隔绝。凡界天道自此变得极端排外,遂成"绝地天通"之局。此即当世化神之后灵界通道闭塞、欲强渡者九死一生之根源所在\n现世与末世:\n  - 现世基调:距上次大劫,已历七千年。当今天地灵气,呈现回光返照之态,促就修仙文明空前繁荣,迎来"大争之世"\n  - 末日悬剑:据此推演,下一次大劫将于**三千年后**(修仙历10000年)准时降临。若不能于此前寻得破局之法,或逃离凡界,则神陆与无尽海所有生灵,皆将化为齑粉,万劫不复\n</overview>`;\n\nconst 灵界版本 = `<overview>\n世界成形:\n  - 天地原是一块超大陆,万千生灵共居其上。域外天魔自虚海入侵,大战爆发于魔族领土,将超大陆撕裂变为今日灵界七大陆;魔族领土化作殒落大陆;大陆边缘被撕成万千碎片,成为万千凡界\n天魔威胁:\n  - 天魔每约万年积蓄一次力量、对外发动大规模入侵某一灵界大陆\n  - 下次入侵: 修仙历 xxxx年\n凡界来人:\n  - 凡界生灵实为上古八族的后裔。对能撕裂虚空回灵界者各派竞相招揽，视为天才\n仙界:\n  - 据传渡劫成功可飞升仙界,然上古至今无飞升者传回信息。 究竟存在与否、众说纷纭\n</overview>`;\n\nconst outputText = world === \'灵界\' ? 灵界版本 : 凡界版本;\n_%>\n<%- outputText %>\n<%_ } _%>\n';

const Cultivation_Card_Game_raw_namespaceObject_35 = "<elements>\n五行生克:\n- 相生关系: \n  * 基础: 木->火->土->金->水->木\n  * 阳生: 金,木,水,火,土 (阳生基础五行)\n  * 阴生: 阳\n  * 混沌: 无生克\n- 相克关系: \n  * 基础: 木->土->水->火->金->木\n  * 阴克: 金,木,水,火,土 (阴克基础五行)\n  * 阳克: 阴\n  * 混沌: 无生克\n</elements>";

const Cultivation_Card_Game_raw_namespaceObject_37 = "<%_ { _%>\n<%_\n// 法宝形制字典: 法宝=一切武器的统称, \"凡物皆可成宝\"——兵刃、文房、庖厨、针黹、百工、妆奁、丝竹、器皿之物, 淬炼皆可成宝。\n// 每轮随机抽5个填入\"物品概述·法宝\"的举例, 展示多样性。想扩充直接往对应类别数组里加词即可(名字即种子, 模型抽到后按[物品功法生成规则]自行配数值/效果)。\nconst 法宝形制 = {\n  兵刃类: ['剑', '刀', '长枪', '矛', '棍','弓箭','弩箭', '戟', '鞭', '扇', '铲', '棒', '匕首', '飞镖'],\n  奇兵类: ['回旋镖','铁蒺藜','钉','袖剑','爪子','拳套','钩爪','锏','鞭剑'],\n  机关类: ['机巧盒', '针筒', '笼子', '沙漏', '锁'],\n  文房类: ['笔', '剪', '尺规', '印', '瓶'],\n  针黹类: ['针', '丝线','丝带', '网兜', '环', '粉末'],\n  百工类: ['锤', '斧', '锯', '钳', '刺', '凿'],\n  妆奁类: ['镜', '簪', '梳子', '花朵','烟斗'],\n  丝竹类: ['箫', '琴', '笛', '琵琶', '锣', '埙', '鼓', '螺', '钟', '磬', '铃铛'],\n  器皿类: ['葫芦', '袋子', '幡旗', '宝塔', '香炉', '钵盂'],\n  奇门类: ['面具', '锁链', '念珠', '棋盘', '灯笼', '纸鸢'],\n  素材类: ['骨头', '龟板', '牙齿', '角', '鳞片', '甲壳', '翅膀', '羽毛', '毒腺', '矿石', '木头', '枝条', '竹子', '山峰'],\n};\n// 随机不重复抽5个(跨类混抽, 突出\"什么都能是法宝\")\nconst 全部形制 = Object.values(法宝形制).flat();\nconst 备选 = [...全部形制];\nconst 抽中 = [];\nfor (let i = 0; i < 5 && 备选.length; i++) {\n  const j = Math.floor(Math.random() * 备选.length);\n  抽中.push(备选.splice(j, 1)[0]);\n}\nconst 法宝举例 = 抽中.join('、');\n_%>\n<items>\n# 物品概述:\n  - 法宝: 一切武器的统称,凡物皆可成宝（如：<%- 法宝举例 %> 等）\n  - 护甲: 直接穿戴,常驻避尘等功能\n  - 饰品: 玉佩、发簪、指环、手镯、耳坠、铃铛等\n  - 阵盘: 用于展开小型阵法（大型阵法需兴修建筑）\n  - 符箓: 消耗品,用于发动高阶修士封入符纸中的咒法\n  - 丹药: 消耗品,用途千变万化\n  - 灵兽: 捕捉驯化的未开智妖族,为修士所用\n  - 傀儡: 以数量取胜的机关人偶,亦可作为仆从\n  - 素材: 妖兽素材、金铁木石、仙草灵果甚至建筑材料,一切富含灵气之物均可为素材\n\n# 功法分类:\n  - 心法: 修炼所用功法,同时只能运行一种\n  - 攻击: 直接攻击功法\n  - 咒法: 远程法术攻击类功法\n  - 神念: 无视防御直接攻击对方神魂的功法\n  - 幻术: 让对方陷入异常状态的功法\n  - 身法: 提升遁速的功法,同时只能运行一种\n  - 护体: 防御用功法,同时只能运行一种\n\n# 品质分类:\n  决定物品稀有度与强度\n  - 凡阶: 寻常之物,随处可得 (Q=+0%, 效果1条)\n  - 黄阶: 略具灵性,市面常见 (Q=+25%, 效果1条)\n  - 玄阶: 珍稀灵材所制,威能可观 (Q=+50%, 效果2条)\n  - 地阶: 难得重器,世间稀少 (Q=+75%, 效果2条)\n  - 天阶: 秘境寻得,或门派传承至宝 (Q=+100%, 效果3条)\n</items>\n<%_ } _%>\n";

const Cultivation_Card_Game_raw_namespaceObject_39 = "<%_ { _%>\n<%_\nconst world = getMessageVar('stat_data.地点.世界') || '凡界';\n\nconst 凡界版本 = `<realm_power_level>\n修为与社会地位概述:\n  凡人 (L=0):\n    地位: 如恒河沙数，在修士面前宛如蝼蚁。有灵根者引气入体方可进入练气期\n  炼气期 (L=1):\n    地位: 修仙界的最底层。多为宗门的外门弟子、杂役，或是在底层挣扎的散修。能施展基础法术\n    解锁神通:\n    - 传音: 修士专属的定向沟通手段\n  筑基期 (L=2):\n    地位: 修仙界的中坚力量。大型宗门内门弟子或基层执事；在凡俗或偏远之地，足以开创一方修仙世家，称霸凡人城市\n    解锁神通:\n    - 辟谷: 无需进食凡人饭菜\n    - 御器飞行: 驾驭法宝飞行\n  金丹期 (L=3):\n    地位: 正式踏入高阶修士的门槛。通常担任大宗门的实权长老、一峰之主，或是中小型宗门的一宗之主\n  元婴期 (L=4):\n    地位: 凡界明面上的\"顶级战力\"。通常为顶级正魔宗门的大长老\n    解锁神通:\n    - 夺舍: 抹去对方神识，永久夺取对方肉身与体质，但不改变自身灵根\n    - 元婴外逃: 抛弃肉身以元婴遁逃，非特殊手段不可拦截\n  化神期 (L=5):\n    地位: 多为太上长老或宗主,人数极少。因凡界灵气不足，化神级别神通会导致寿元剧烈折损，故化神大能极少出手\n    诉求: 寻找空间裂缝节点，偷渡至灵界\n  注: 除凡人外，每个大境界中有前期、中期、后期三个小境界\n\n  境界耗时:\n  | 阶段 | 小境界进阶 | 大境界跨越 | 该境界常见年龄 |\n  | --- | --- | --- | --- |\n  | 炼气→筑基 | 1~3年 | 5~15年 | 15~80岁 |\n  | 筑基→金丹 | 10~30年 | 50~100年 | 30~200岁 |\n  | 金丹→元婴 | 50~100年 | 200~400年 | 100~600岁 |\n  | 元婴→化神 | 100~300年 | 500~1000年 | 300~1500岁 |\n  | 化神→返虚 | 300~500年 | 难以估量 | 800~3000岁 |\n  注: 天才/顶级灵脉/珍稀丹药可大幅缩短\n\n其他界域地位概述:\n  灵界 (返虚、合体、大乘、渡劫):\n    地位: 浩瀚广袤的高阶位面，万族林立，强者如云。唯有合体以上，方能成为一方巨擘；大乘与渡劫期大能，才可镇压一族气运\n  仙界 (真仙及以上):\n    地位: 下界几乎无人知晓其具体境界与法则，仅有只言片语留存于上古残页之中\n</realm_power_level>`;\n\nconst 灵界版本 = `<realm_power_level>\n修为与社会地位概述:\n  L=0~4 (凡人/炼气/筑基/金丹/元婴):\n    地位: 入门级修仙者、多为各宗门外门弟子\n    解锁神通:\n    - 传音 (炼气): 修士专属的定向沟通手段\n    - 夺舍 (元婴): 抹去对方神识、永久夺取对方肉身与体质、不改变自身灵根\n    - 元婴外逃 (元婴): 抛弃肉身以元婴遁逃、非特殊手段不可拦截\n  化神期 (L=5):\n    地位: 灵界各宗门内门弟子、是灵界的中坚战力\n    解锁神通:\n    - 虚空造物: 能用灵力凭空创造简单物体 (如凝聚灵石)\n  返虚期 (L=6):\n    地位: 多为各宗门的管事或长老\n  合体期 (L=7):\n    地位: 多为各宗门的宗主\n    解锁神通:\n    - 身外化身: 合体期后修士完全融合元婴,将元婴化为可独立行动的\"第二化身\"\n  大乘期 (L=8):\n    地位: 一族之领导者、每个大陆仅 1~2 位\n    解锁神通:\n    - 大乘灵光: 可点化生灵、开启灵智\n  渡劫期 (L=9):\n    地位: 因\"天机屏蔽\"之能、世人无从知其存在与否; 一旦出手即招天劫临近、故绝不加入任何纷争\n    解锁神通:\n    - 开辟世界: 可开辟一方稳固的、属于自身的小世界\n    - 天机屏蔽: 能一定程度屏蔽天道推演、或推迟自身天劫\n注: 除凡人外，每个大境界中有前期、中期、后期三个小境界\n\n境界耗时:\n| 阶段 | 小境界进阶 | 大境界跨越 | 该境界常见年龄 |\n| --- | --- | --- | --- |\n| 炼气→筑基 | <1年 | 1~3年 | 5~30岁 |\n| 筑基→金丹 | 3~10年 | 15~30年 | 20~80岁 |\n| 金丹→元婴 | 15~30年 | 50~120年 | 50~250岁 |\n| 元婴→化神 | 30~100年 | 150~300年 | 150~500岁 |\n| 化神→返虚 | 100~300年 | 500~1000年 | 500~1500岁 |\n| 返虚→合体 | 500~1000年 | 1500~3000年 | 1500~5000岁 |\n| 合体→大乘 | 1500~3000年 | 5000~10000年 | 5000~20000岁 |\n| 大乘→渡劫 | 5000~10000年 | 20000~50000年 | 25000~80000岁 |\n注: 灵界灵气常数 D=6 (凡界 D=2), 修炼速度约为凡界三倍。 灵界本土修士同样需从零开始修炼、只是修炼更快\n注: 天才/顶级灵脉/珍稀丹药可大幅缩短各阶段耗时\n</realm_power_level>`;\n\nconst outputText = world === '灵界' ? 灵界版本 : 凡界版本;\n_%>\n<%- outputText %>\n<%_ } _%>\n";
