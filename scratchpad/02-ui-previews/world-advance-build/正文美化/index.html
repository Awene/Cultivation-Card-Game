      /* —— <tp> 时空栏:正文最前的时间/地点/天气优雅卷轴 —— */
      .rb-tp {
        position: relative;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px 18px;
        margin: 0 0 14px;
        padding: 10px 16px;
        background: linear-gradient(
          135deg,
          rgba(168, 153, 104, 0.12) 0%,
          rgba(168, 153, 104, 0.04) 50%,
          rgba(168, 153, 104, 0.1) 100%
        );
        border: 1px solid rgba(168, 153, 104, 0.3);
        border-radius: 10px;
        overflow: hidden;
        animation: rb-panel-in 0.45s cubic-bezier(0.2, 0.8, 0.2, 1) backwards;
      }
      /* 顶部金线 */
      .rb-tp::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 1.5px;
        background: linear-gradient(
          90deg,
          transparent,
          var(--rb-accent, #a89968) 30%,
          color-mix(in srgb, var(--rb-accent, #a89968) 70%, white) 50%,
          var(--rb-accent, #a89968) 70%,
          transparent
        );
        background-size: 200% 100%;
        animation: rb-panel-shimmer 8s ease-in-out infinite;
      }
      .rb-tp-cell {
        display: inline-flex;
        align-items: baseline;
        gap: 6px;
        font-size: 0.92em;
        line-height: 1.5;
      }
      .rb-tp-icon {
        flex-shrink: 0;
        color: var(--rb-accent, #a89968);
        opacity: 0.85;
        font-size: 0.92em;
      }
      .rb-tp-text {
        color: var(--rb-text);
      }
      .rb-tp-cell--time .rb-tp-text {
        font-family: 'Cinzel', 'Noto Serif SC', serif;
        font-weight: 700;
        letter-spacing: 0.6px;
        color: var(--rb-accent, #a89968);
      }
      .rb-tp-cell--place .rb-tp-text {
        letter-spacing: 0.4px;
        font-weight: 600;
      }
      .rb-tp-cell--weather .rb-tp-text {
        color: var(--rb-text-soft, #c5b696);
        font-style: italic;
      }
      /* 单元格之间的细线分隔(伪元素) */
      .rb-tp-cell + .rb-tp-cell::before {
        content: '┃';
        color: rgba(168, 153, 104, 0.35);
        margin-right: 14px;
        margin-left: -10px;
        font-size: 0.85em;
      }
      @media (max-width: 600px) {
        .rb-tp {
          gap: 4px 0;
          padding: 9px 12px;
        }
        .rb-tp-cell {
          font-size: 0.85em;
          flex-basis: 100%;
        }
        .rb-tp-cell + .rb-tp-cell::before {
          display: none;
        }
      }

      /* light 主题:暖纸感 */
      [data-theme='light'] .rb-tp {
        background: linear-gradient(
          135deg,
          rgba(168, 153, 104, 0.16) 0%,
          rgba(168, 153, 104, 0.06) 50%,
          rgba(168, 153, 104, 0.16) 100%
        );
        border-color: rgba(160, 127, 72, 0.32);
      }
      [data-theme='light'] .rb-tp-cell--time .rb-tp-text {
        color: color-mix(in srgb, var(--rb-accent, #a07f48) 75%, #1a0f00);
      }
      [data-theme='light'] .rb-tp-cell--weather .rb-tp-text {
        color: #5a4a36;
      }

      /* —— 玩家手动插入 / SD 文生图插件生成的图片 —— */
      /* 与外部包裹容器(figure/div + 内联样式)隔离,避免移动端被 float/inline-block 撑破成两列 */
      .rb-img-wrap {
        display: block;
        margin: 18px 0;
        padding: 0;
        text-align: center;
        clear: both;
        float: none;
        width: 100%;
        max-width: 100%;
        box-sizing: border-box;
      }
      .rb-img-wrap img {
        display: block;
        max-width: 100%;
        width: auto;
        height: auto;
        margin: 0 auto;
        border-radius: 10px;
        box-shadow: 0 6px 22px rgba(0, 0, 0, 0.32);
        clear: both;
        float: none;
      }
      [data-theme='light'] .rb-img-wrap img {
        box-shadow: 0 4px 14px rgba(120, 95, 50, 0.18);
      }
      @media (max-width: 600px) {
        .rb-img-wrap {
          margin: 14px 0;
        }
      }

      /* —— 小总结卷轴(<details><summary>X</summary>...</details>) —— */
      .rb-summary {
        position: relative;
        margin: 14px 0;
        border-radius: 12px;
        overflow: hidden;
        background: linear-gradient(
          155deg,
          rgba(20, 16, 32, 0.78) 0%,
          rgba(28, 22, 44, 0.72) 60%,
          rgba(20, 16, 32, 0.82) 100%
        );
        backdrop-filter: blur(18px) saturate(180%);
        -webkit-backdrop-filter: blur(18px) saturate(180%);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow:
          0 14px 44px rgba(0, 0, 0, 0.42),
          0 1px 0 rgba(255, 255, 255, 0.06) inset,
          0 -1px 0 rgba(0, 0, 0, 0.25) inset;
        color: #e8d5b7;
        animation: rb-panel-in 0.45s cubic-bezier(0.2, 0.8, 0.2, 1) backwards;
        transition:
          transform 0.25s ease,
          box-shadow 0.25s ease,
          border-color 0.25s ease;
      }
      .rb-summary:hover {
        transform: translateY(-2px);
        border-color: rgba(255, 255, 255, 0.16);
        box-shadow:
          0 22px 56px rgba(0, 0, 0, 0.5),
          0 0 0 1px var(--rb-accent, #a89968) inset,
          0 1px 0 rgba(255, 255, 255, 0.08) inset;
      }
      .rb-summary::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 2px;
        background: linear-gradient(
          90deg,
          transparent 0%,
          var(--rb-accent, #a89968) 30%,
          color-mix(in srgb, var(--rb-accent, #a89968) 70%, white) 50%,
          var(--rb-accent, #a89968) 70%,
          transparent 100%
        );
        background-size: 250% 100%;
        animation: rb-panel-shimmer 6s ease-in-out infinite;
        z-index: 1;
        pointer-events: none;
      }

      .rb-summary-head {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 14px;
        cursor: pointer;
        user-select: none;
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.04) 0%,
          rgba(255, 255, 255, 0.02) 50%,
          rgba(255, 255, 255, 0.06) 100%
        );
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        list-style: none;
        transition: background 0.25s ease;
      }
      .rb-summary-head::-webkit-details-marker {
        display: none;
      }
      .rb-summary-head:hover {
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.08) 0%,
          rgba(255, 255, 255, 0.04) 50%,
          rgba(255, 255, 255, 0.1) 100%
        );
      }
      .rb-summary-icon {
        font-size: 1.05em;
        color: var(--rb-accent, #a89968);
        filter: drop-shadow(0 0 10px color-mix(in srgb, var(--rb-accent, #a89968) 60%, transparent));
      }
      .rb-summary-title {
        flex: 1;
        font-family: 'Cinzel', 'Noto Serif SC', serif;
        font-size: 1em;
        font-weight: 700;
        letter-spacing: 1.1px;
        color: var(--rb-accent, #a89968);
        text-shadow: 0 0 12px color-mix(in srgb, var(--rb-accent, #a89968) 32%, transparent);
      }
      .rb-summary-toggle {
        font-size: 0.78em;
        color: var(--rb-accent, #a89968);
        opacity: 0.7;
        letter-spacing: 0.4px;
      }
      .rb-summary[open] .rb-summary-toggle-text::after {
        content: attr(data-open);
      }
      .rb-summary:not([open]) .rb-summary-toggle-text::after {
        content: attr(data-close);
      }

      .rb-summary-body {
        padding: 11px 16px;
        max-height: 420px;
        overflow-y: auto;
        color: #e8d5b7;
        line-height: 1.7;
        font-size: 0.92em;
        word-break: break-word;
        background: rgba(0, 0, 0, 0.1);
      }
      .rb-summary[open] > .rb-summary-body {
        animation: rb-tab-fade 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      .rb-summary-list {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      .rb-summary-list li {
        position: relative;
        padding: 3px 0 3px 18px;
      }
      .rb-summary-list li:not(:last-child) {
        border-bottom: 1px dashed rgba(168, 153, 104, 0.14);
      }
      .rb-summary-list li::before {
        content: '◇';
        position: absolute;
        left: 0;
        top: 3px;
        color: var(--rb-accent, #a89968);
        font-size: 0.85em;
        opacity: 0.75;
      }
      .rb-summary-text {
        white-space: pre-wrap;
      }
      .rb-summary-body::-webkit-scrollbar {
        width: 5px;
      }
      .rb-summary-body::-webkit-scrollbar-track {
        background: rgba(0, 0, 0, 0.18);
        border-radius: 3px;
      }
      .rb-summary-body::-webkit-scrollbar-thumb {
        background: linear-gradient(
          180deg,
          var(--rb-accent, #a89968),
          color-mix(in srgb, var(--rb-accent, #a89968) 60%, white)
        );
        border-radius: 3px;
        opacity: 0.5;
      }
      .rb-summary-body::-webkit-scrollbar-thumb:hover {
        opacity: 0.85;
      }

      /* light 主题:暖纸卷轴 */
      [data-theme='light'] .rb-summary {
        background: linear-gradient(
          155deg,
          rgba(255, 250, 240, 0.92) 0%,
          rgba(248, 240, 222, 0.86) 55%,
          rgba(252, 244, 228, 0.94) 100%
        );
        border: 1px solid rgba(160, 127, 72, 0.28);
        color: #3a2f24;
        box-shadow:
          0 8px 28px rgba(101, 75, 38, 0.14),
          0 1px 0 rgba(255, 255, 255, 0.6) inset,
          0 -1px 0 rgba(101, 75, 38, 0.06) inset;
      }
      [data-theme='light'] .rb-summary:hover {
        border-color: rgba(160, 127, 72, 0.45);
        box-shadow:
          0 16px 40px rgba(101, 75, 38, 0.2),
          0 0 0 1px var(--rb-accent, #a07f48) inset,
          0 1px 0 rgba(255, 255, 255, 0.7) inset;
      }
      [data-theme='light'] .rb-summary-head {
        background: linear-gradient(
          135deg,
          rgba(168, 153, 104, 0.1) 0%,
          rgba(168, 153, 104, 0.05) 50%,
          rgba(168, 153, 104, 0.14) 100%
        );
        border-bottom: 1px solid rgba(160, 127, 72, 0.2);
      }
      [data-theme='light'] .rb-summary-head:hover {
        background: linear-gradient(
          135deg,
          rgba(168, 153, 104, 0.16) 0%,
          rgba(168, 153, 104, 0.08) 50%,
          rgba(168, 153, 104, 0.22) 100%
        );
      }
      [data-theme='light'] .rb-summary-title {
        color: color-mix(in srgb, var(--rb-accent, #a07f48) 75%, #1a0f00);
      }
      [data-theme='light'] .rb-summary-body {
        color: #3a2f24;
        background: rgba(168, 153, 104, 0.08);
      }
      [data-theme='light'] .rb-summary-list li:not(:last-child) {
        border-bottom-color: rgba(160, 127, 72, 0.2);
      }

      @media (max-width: 600px) {
        .rb-summary-head {
          padding: 9px 12px;
          gap: 8px;
        }
        .rb-summary-title {
          font-size: 0.94em;
          letter-spacing: 0.8px;
        }
        .rb-summary-body {
          padding: 9px 12px;
          font-size: 0.88em;
          max-height: 360px;
        }
      }

      /* —— 行动选项 <options>/<action_options> —— 视觉与其他面板一致(金色调,呼应 char-panel) */
      .rb-options {
        --rb-options-accent: #d4af37;
        position: relative;
        margin: 12px 0;
        border-radius: 12px;
        overflow: hidden;
        background: linear-gradient(
          155deg,
          rgba(20, 16, 32, 0.78) 0%,
          rgba(28, 22, 44, 0.72) 60%,
          rgba(20, 16, 32, 0.82) 100%
        );
        backdrop-filter: blur(18px) saturate(180%);
        -webkit-backdrop-filter: blur(18px) saturate(180%);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow:
          0 14px 44px rgba(0, 0, 0, 0.42),
          0 1px 0 rgba(255, 255, 255, 0.06) inset,
          0 -1px 0 rgba(0, 0, 0, 0.25) inset;
        color: #e8d5b7;
        animation: rb-panel-in 0.45s cubic-bezier(0.2, 0.8, 0.2, 1) backwards;
        transition:
          transform 0.25s ease,
          box-shadow 0.25s ease,
          border-color 0.25s ease;
      }
      .rb-options:hover {
        transform: translateY(-2px);
        border-color: rgba(255, 255, 255, 0.16);
        box-shadow:
          0 22px 56px rgba(0, 0, 0, 0.5),
          0 0 0 1px var(--rb-options-accent) inset,
          0 1px 0 rgba(255, 255, 255, 0.08) inset;
      }
      .rb-options::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 2px;
        background: linear-gradient(
          90deg,
          transparent 0%,
          var(--rb-options-accent) 30%,
          color-mix(in srgb, var(--rb-options-accent) 70%, white) 50%,
          var(--rb-options-accent) 70%,
          transparent 100%
        );
        background-size: 250% 100%;
        animation: rb-panel-shimmer 6s ease-in-out infinite;
      }
      .rb-options-head {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 9px 14px;
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.04) 0%,
          rgba(255, 255, 255, 0.02) 50%,
          rgba(255, 255, 255, 0.06) 100%
        );
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      }
      .rb-options-icon {
        font-size: 1.05em;
        color: var(--rb-options-accent);
        filter: drop-shadow(0 0 10px color-mix(in srgb, var(--rb-options-accent) 60%, transparent));
      }
      .rb-options-title {
        flex: 1;
        font-family: 'Cinzel', 'Noto Serif SC', serif;
        font-size: 0.98em;
        font-weight: 700;
        letter-spacing: 1.2px;
        color: var(--rb-options-accent);
        text-shadow: 0 0 14px color-mix(in srgb, var(--rb-options-accent) 35%, transparent);
        word-break: break-word;
      }
      .rb-quick-categories {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 4px;
        max-width: 72%;
        overflow-x: auto;
        overscroll-behavior-x: contain;
        scrollbar-width: none;
      }
      .rb-quick-categories::-webkit-scrollbar {
        display: none;
      }
      .rb-quick-category {
        flex: 0 0 auto;
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 3px 8px;
        border: 1px solid rgba(212, 175, 55, 0.28);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.035);
        color: rgba(232, 213, 183, 0.72);
        font: inherit;
        font-size: 0.75em;
        line-height: 1.45;
        white-space: nowrap;
        cursor: pointer;
        transition:
          color 0.18s ease,
          background 0.18s ease,
          border-color 0.18s ease,
          transform 0.18s ease;
      }
      .rb-quick-category:hover,
      .rb-quick-category.active {
        color: #fff8df;
        background: color-mix(in srgb, var(--rb-options-accent) 22%, transparent);
        border-color: color-mix(in srgb, var(--rb-options-accent) 72%, transparent);
      }
      .rb-quick-category:active {
        transform: scale(0.96);
      }
      .rb-quick-panel {
        padding: 9px 13px 10px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        background: rgba(0, 0, 0, 0.12);
      }
      .rb-quick-panel[hidden],
      .rb-quick-group[hidden],
      .rb-quick-subgroup[hidden] {
        display: none !important;
      }
      .rb-quick-panel-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 7px;
        color: var(--rb-options-accent);
        font-size: 0.78em;
        font-weight: 700;
        letter-spacing: 0.8px;
      }
      .rb-quick-panel-head small {
        color: rgba(232, 213, 183, 0.48);
        font-size: 0.88em;
        font-weight: 400;
        letter-spacing: 0;
      }
      .rb-quick-actors {
        margin: 0 0 9px;
        padding: 8px;
        border: 1px solid color-mix(in srgb, var(--rb-options-accent) 24%, transparent);
        border-radius: 8px;
        background: color-mix(in srgb, var(--rb-options-accent) 5%, transparent);
      }
      .rb-quick-actors-head {
        display: flex;
        align-items: center;
        gap: 7px;
        margin-bottom: 7px;
        color: var(--rb-options-accent);
        font-size: 0.74em;
        font-weight: 700;
        letter-spacing: 0.7px;
      }
      .rb-quick-actors-head small {
        flex: 1;
        color: rgba(232, 213, 183, 0.46);
        font-size: 0.9em;
        font-weight: 400;
        letter-spacing: 0;
      }
      .rb-quick-actor-clear {
        flex: 0 0 auto;
        padding: 2px 7px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 999px;
        background: transparent;
        color: rgba(232, 213, 183, 0.58);
        font: inherit;
        cursor: pointer;
      }
      .rb-quick-actor-clear:hover {
        border-color: color-mix(in srgb, var(--rb-options-accent) 52%, transparent);
        color: var(--rb-options-accent);
      }
      .rb-quick-actor-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 6px;
      }
      .rb-quick-actor-field {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        align-items: center;
        gap: 5px;
        min-width: 0;
        height: 30px;
        padding: 3px 5px 3px 7px;
        border: 1px solid rgba(255, 255, 255, 0.09);
        border-radius: 7px;
        background: rgba(255, 255, 255, 0.025);
      }
      .rb-quick-actor-field--select {
        grid-template-columns: auto minmax(0, 1fr) auto;
      }
      .rb-quick-actor-field--select::after {
        content: '⌄';
        align-self: center;
        color: rgba(232, 213, 183, 0.5);
        font: 700 0.82em/1 sans-serif;
        pointer-events: none;
      }
      .rb-quick-actor-slot {
        color: var(--rb-options-accent);
        font: 700 0.66em/1.2 monospace;
        white-space: nowrap;
      }
      .rb-quick-actor-user-name {
        min-width: 0;
        overflow: hidden;
        color: rgba(232, 213, 183, 0.84);
        font-size: 0.74em;
        font-weight: 600;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .rb-quick-actor-select {
        width: 100%;
        min-width: 0;
        height: 24px;
        padding: 1px 2px 1px 5px;
        border: 0;
        outline: 0;
        background: transparent;
        color: rgba(232, 213, 183, 0.88);
        font: inherit;
        font-size: 0.74em;
        cursor: pointer;
        appearance: none;
        -webkit-appearance: none;
      }
      .rb-quick-actor-select option {
        background: #201a2d;
        color: #eadcc4;
      }
      .rb-quick-actor-select:disabled {
        cursor: not-allowed;
        opacity: 0.48;
      }
      .rb-quick-subcategories {
        display: flex;
        align-items: center;
        gap: 5px;
        margin: 0 -2px 8px;
        padding: 1px 2px 7px;
        overflow-x: auto;
        border-bottom: 1px dashed rgba(255, 255, 255, 0.08);
        scrollbar-width: thin;
        scrollbar-color: color-mix(in srgb, var(--rb-options-accent) 42%, transparent) transparent;
        overscroll-behavior-x: contain;
      }
      .rb-quick-subcategory {
        flex: 0 0 auto;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 5px 9px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 7px;
        background: rgba(255, 255, 255, 0.025);
        color: rgba(232, 213, 183, 0.62);
        font: inherit;
        font-size: 0.76em;
        line-height: 1.35;
        white-space: nowrap;
        cursor: pointer;
        transition:
          color 0.18s ease,
          background 0.18s ease,
          border-color 0.18s ease,
          transform 0.18s ease;
      }
      .rb-quick-subcategory:hover,
      .rb-quick-subcategory.active {
        color: #fff8df;
        border-color: color-mix(in srgb, var(--rb-options-accent) 58%, transparent);
        background: color-mix(in srgb, var(--rb-options-accent) 16%, transparent);
      }
      .rb-quick-subcategory.active {
        box-shadow: inset 0 -2px 0 color-mix(in srgb, var(--rb-options-accent) 75%, transparent);
      }
      .rb-quick-subcategory:active {
        transform: scale(0.97);
      }
      .rb-quick-subgroup-title {
        margin: 0 0 6px;
        color: rgba(232, 213, 183, 0.48);
        font-size: 0.72em;
        letter-spacing: 0.7px;
      }
      .rb-quick-replies {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 6px;
        max-height: 238px;
        padding-right: 3px;
        overflow-x: hidden;
        overflow-y: auto;
        align-content: start;
        overscroll-behavior-y: contain;
        scrollbar-width: thin;
        scrollbar-color: color-mix(in srgb, var(--rb-options-accent) 42%, transparent) transparent;
      }
      .rb-quick-reply {
        display: flex;
        align-items: center;
        gap: 7px;
        min-width: 0;
        padding: 6px 9px;
        border: 1px solid rgba(255, 255, 255, 0.07);
        border-radius: 7px;
        background: rgba(255, 255, 255, 0.035);
        color: #e8d5b7;
        font: inherit;
        font-size: 0.82em;
        line-height: 1.4;
        text-align: left;
        cursor: pointer;
        transition:
          background 0.18s ease,
          border-color 0.18s ease,
          transform 0.18s ease,
          box-shadow 0.18s ease;

      .rb-quick-reply::before {

        color: var(--rb-options-accent);
        font-size: 1.25em;

      .rb-quick-reply:hover {
        background: color-mix(in srgb, var(--rb-options-accent) 12%, transparent);

      }
      .rb-custom-tool,
      .rb-custom-action,
      .rb-custom-submit {
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.035);
        color: rgba(232, 213, 183, 0.72);
        font: inherit;
        cursor: pointer;
      }
      .rb-custom-manager {
        display: grid;
        gap: 8px;
      }
      .rb-custom-toolbar {
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .rb-custom-toolbar-note {
        flex: 1;
        min-width: 0;
        color: rgba(232, 213, 183, 0.46);
        font-size: 0.7em;
      }
      .rb-custom-tool,
      .rb-custom-action {
        padding: 3px 8px;
        font-size: 0.7em;
        white-space: nowrap;
      }
      .rb-custom-editor {
        display: grid;
        grid-template-columns: minmax(90px, 0.38fr) minmax(0, 1fr) auto;
        gap: 6px;
      }
      .rb-custom-input,
      .rb-custom-text {
        min-width: 0;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 7px;
        outline: 0;
        background: rgba(0, 0, 0, 0.12);
        color: #e8d5b7;
        font: inherit;
        font-size: 0.78em;
      }
      .rb-custom-input {
        padding: 5px 7px;
      }
      .rb-custom-text {
        height: 31px;
        padding: 5px 7px;
        line-height: 1.35;
        resize: vertical;
      }
      .rb-custom-input:focus,
      .rb-custom-text:focus {
        border-color: color-mix(in srgb, var(--rb-options-accent) 58%, transparent);
      }
      .rb-custom-submit {
        padding: 4px 11px;
        border-color: color-mix(in srgb, var(--rb-options-accent) 42%, transparent);
        color: var(--rb-options-accent);
      }
      .rb-custom-list {
        display: grid;
        gap: 5px;
        max-height: 238px;
        padding-right: 3px;
        overflow-x: hidden;
        overflow-y: auto;
        align-content: start;
        overscroll-behavior-y: contain;
        scrollbar-width: thin;
        scrollbar-color: color-mix(in srgb, var(--rb-options-accent) 42%, transparent) transparent;
      }

      .rb-quick-replies::-webkit-scrollbar,
      .rb-custom-list::-webkit-scrollbar,
      .rb-options-body::-webkit-scrollbar {
        width: 5px;
      }
      .rb-quick-replies::-webkit-scrollbar-track,
      .rb-custom-list::-webkit-scrollbar-track,
      .rb-options-body::-webkit-scrollbar-track {
        background: transparent;
      }
      .rb-quick-replies::-webkit-scrollbar-thumb,
      .rb-custom-list::-webkit-scrollbar-thumb,
      .rb-options-body::-webkit-scrollbar-thumb {
        border-radius: 999px;
        background: color-mix(in srgb, var(--rb-options-accent) 42%, transparent);
      }
      .rb-custom-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 5px;
      }
      .rb-custom-row[hidden] {
        display: none !important;
      }
      .rb-custom-row .rb-quick-reply {
        width: 100%;
      }
      .rb-custom-row-actions {
        display: flex;
        gap: 3px;
      }
      .rb-custom-action {
        width: 27px;
        height: 27px;
        padding: 0;
        border-radius: 7px;
      }
      .rb-custom-empty {
        padding: 7px 9px;
        border: 1px dashed rgba(255, 255, 255, 0.1);
        border-radius: 7px;
        color: rgba(232, 213, 183, 0.46);
        font-size: 0.76em;
        text-align: center;
      }
      .rb-options-section-label {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 1px 0 2px;
        color: rgba(232, 213, 183, 0.48);
        font-size: 0.74em;
        letter-spacing: 0.8px;
      }
      .rb-options-section-label::after {
        content: '';
        flex: 1;
        height: 1px;
        background: rgba(255, 255, 255, 0.06);
      }
      .rb-options-body {
        padding: 10px 13px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        max-height: min(42vh, 360px);
        overflow-x: hidden;
        overflow-y: auto;
        scrollbar-width: thin;
        scrollbar-color: color-mix(in srgb, var(--rb-options-accent) 42%, transparent) transparent;
      }
      .rb-options-count {
        flex: 0 0 auto;
        padding: 1px 7px;
        border: 1px solid color-mix(in srgb, var(--rb-options-accent) 34%, transparent);
        border-radius: 999px;
        color: rgba(232, 213, 183, 0.56);
        font: 0.68em/1.55 sans-serif;
        white-space: nowrap;
      }
      .rb-options-item {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        padding: 8px 11px;
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.05);
        border-left: 3px solid color-mix(in srgb, var(--rb-options-accent) 60%, transparent);
        color: #e8d5b7;
        cursor: pointer;
        user-select: none;
        transition:
          background 0.18s ease,
          border-left-color 0.18s ease,
          transform 0.18s ease,
          box-shadow 0.18s ease;
      }
      .rb-options-item:hover {
        background: rgba(255, 255, 255, 0.06);
        border-left-color: var(--rb-options-accent);
        transform: translateX(3px);
        box-shadow:
          0 4px 14px rgba(0, 0, 0, 0.25),
          inset 0 0 18px color-mix(in srgb, var(--rb-options-accent) 12%, transparent);
      }
      .rb-options-item:active {
        transform: translateX(3px) scale(0.985);
      }
      .rb-options-item.is-sent {
        animation: rb-options-flash 0.6s ease-out;
      }
      @keyframes rb-options-flash {
        0% {
          box-shadow: 0 0 0 0 rgba(212, 175, 55, 0);
        }
        30% {
          box-shadow: 0 0 0 6px rgba(212, 175, 55, 0.35);
        }
        100% {
          box-shadow: 0 0 0 0 rgba(212, 175, 55, 0);
        }
      }
      .rb-options-num {
        flex: 0 0 auto;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 24px;
        height: 24px;
        padding: 0 6px;
        border-radius: 50%;
        background: linear-gradient(
          135deg,
          color-mix(in srgb, var(--rb-options-accent) 80%, transparent),
          color-mix(in srgb, var(--rb-options-accent) 40%, #1a0f00)
        );
        color: #fff;
        font-family: 'Cinzel', 'Noto Serif SC', serif;
        font-weight: 700;
        font-size: 0.86em;
        box-shadow:
          0 0 10px color-mix(in srgb, var(--rb-options-accent) 35%, transparent),
          0 1px 0 rgba(255, 255, 255, 0.18) inset;
      }
      .rb-options-text {
        flex: 1;
        line-height: 1.55;
        font-size: 0.92em;
        white-space: pre-wrap;
        word-break: break-word;
      }
      /* light theme */
      [data-theme='light'] .rb-options {
        background: linear-gradient(
          155deg,
          rgba(255, 250, 240, 0.92) 0%,
          rgba(248, 240, 222, 0.86) 55%,
          rgba(252, 244, 228, 0.94) 100%
        );
        border: 1px solid rgba(160, 127, 72, 0.28);
        color: #3a2f24;
        box-shadow:
          0 8px 28px rgba(101, 75, 38, 0.14),
          0 1px 0 rgba(255, 255, 255, 0.6) inset,
          0 -1px 0 rgba(101, 75, 38, 0.06) inset;
      }
      [data-theme='light'] .rb-options:hover {
        border-color: rgba(160, 127, 72, 0.45);
        box-shadow:
          0 16px 40px rgba(101, 75, 38, 0.2),
          0 0 0 1px var(--rb-options-accent) inset;
      }
      [data-theme='light'] .rb-options-head {
        background: linear-gradient(
          135deg,
          rgba(168, 153, 104, 0.1) 0%,
          rgba(168, 153, 104, 0.05) 50%,
          rgba(168, 153, 104, 0.14) 100%
        );
        border-bottom-color: rgba(160, 127, 72, 0.2);
      }
      [data-theme='light'] .rb-options-title {
        color: color-mix(in srgb, var(--rb-options-accent) 75%, #1a0f00);
        text-shadow: 0 0 10px color-mix(in srgb, var(--rb-options-accent) 18%, transparent);
      }
      [data-theme='light'] .rb-quick-category {
        border-color: rgba(160, 127, 72, 0.28);
        background: rgba(255, 255, 255, 0.4);
        color: rgba(58, 47, 36, 0.72);
      }
      [data-theme='light'] .rb-quick-category:hover,
      [data-theme='light'] .rb-quick-category.active {
        color: #5b3d16;
        background: color-mix(in srgb, var(--rb-options-accent) 18%, white);
        border-color: color-mix(in srgb, var(--rb-options-accent) 65%, transparent);
      }
      [data-theme='light'] .rb-quick-panel {
        border-bottom-color: rgba(160, 127, 72, 0.18);
        background: rgba(160, 127, 72, 0.045);
      }
      [data-theme='light'] .rb-quick-panel-head small,
      [data-theme='light'] .rb-options-section-label {
        color: rgba(58, 47, 36, 0.5);
      }
      [data-theme='light'] .rb-quick-actors {
        border-color: rgba(160, 127, 72, 0.24);
        background: rgba(160, 127, 72, 0.055);
      }
      [data-theme='light'] .rb-quick-actors-head small {
        color: rgba(58, 47, 36, 0.48);
      }
      [data-theme='light'] .rb-quick-actor-clear {
        border-color: rgba(160, 127, 72, 0.22);
        color: rgba(58, 47, 36, 0.62);
      }
      [data-theme='light'] .rb-quick-actor-field {
        border-color: rgba(160, 127, 72, 0.2);
        background: rgba(255, 255, 255, 0.46);
      }
      [data-theme='light'] .rb-quick-actor-user-name,
      [data-theme='light'] .rb-quick-actor-select {
        color: #3a2f24;
      }
      [data-theme='light'] .rb-quick-actor-field--select::after {
        color: rgba(58, 47, 36, 0.5);
      }
      [data-theme='light'] .rb-quick-actor-select option {
        background: #fffaf0;
        color: #3a2f24;
      }
      [data-theme='light'] .rb-quick-subcategories {
        border-bottom-color: rgba(160, 127, 72, 0.18);
      }
      [data-theme='light'] .rb-quick-subcategory {
        border-color: rgba(160, 127, 72, 0.2);
        background: rgba(255, 255, 255, 0.42);
        color: rgba(58, 47, 36, 0.66);
      }
      [data-theme='light'] .rb-quick-subcategory:hover,
      [data-theme='light'] .rb-quick-subcategory.active {
        color: #5b3d16;
        border-color: rgba(160, 127, 72, 0.48);
        background: rgba(168, 153, 104, 0.14);
      }
      [data-theme='light'] .rb-quick-subgroup-title {
        color: rgba(58, 47, 36, 0.48);
      }
      [data-theme='light'] .rb-quick-reply {
        border-color: rgba(160, 127, 72, 0.2);
        background: rgba(255, 255, 255, 0.46);
        color: #3a2f24;
      }
      [data-theme='light'] .rb-quick-reply:hover {
        background: rgba(168, 153, 104, 0.14);
        border-color: rgba(160, 127, 72, 0.42);
      }
      [data-theme='light'] .rb-custom-tool,
      [data-theme='light'] .rb-custom-action,
      [data-theme='light'] .rb-custom-submit {
        border-color: rgba(160, 127, 72, 0.24);
        background: rgba(255, 255, 255, 0.46);
        color: rgba(58, 47, 36, 0.72);
      }
      [data-theme='light'] .rb-custom-toolbar-note,
      [data-theme='light'] .rb-custom-empty {
        color: rgba(58, 47, 36, 0.5);
      }
      [data-theme='light'] .rb-custom-input,
      [data-theme='light'] .rb-custom-text {
        border-color: rgba(160, 127, 72, 0.22);
        background: rgba(255, 255, 255, 0.5);
        color: #3a2f24;
      }
      [data-theme='light'] .rb-custom-empty {
        border-color: rgba(160, 127, 72, 0.2);
      }
      [data-theme='light'] .rb-options-section-label::after {
        background: rgba(160, 127, 72, 0.18);
      }
      [data-theme='light'] .rb-options-item {
        background: rgba(168, 153, 104, 0.07);
        border: 1px solid rgba(168, 153, 104, 0.2);
        border-left: 3px solid color-mix(in srgb, var(--rb-options-accent) 70%, transparent);
        color: #3a2f24;
      }
      [data-theme='light'] .rb-options-item:hover {
        background: rgba(168, 153, 104, 0.14);
        border-left-color: var(--rb-options-accent);
      }
      @media (max-width: 600px) {
        .rb-options {
          margin: 9px 0;
        }
        .rb-options-head {
          flex-wrap: wrap;
          padding: 7px 11px;
        }
        .rb-options-title {
          font-size: 0.92em;
          letter-spacing: 0.8px;
        }
        .rb-options-body {
          padding: 8px 10px;
        }
        .rb-options-item {
          font-size: 0.88em;
          padding: 6px 9px;
        }
        .rb-options-text {
          font-size: 0.88em;
        }
        .rb-quick-categories {
          flex: 1 0 100%;
          justify-content: flex-start;
          max-width: none;
          padding-top: 2px;
        }
        .rb-quick-category {
          padding: 3px 9px;
          font-size: 0.72em;
        }
        .rb-quick-panel {
          padding: 8px 10px;
        }
        .rb-quick-panel-head small {
          display: none;
        }
        .rb-quick-actors-head small {
          display: none;
        }
        .rb-quick-actor-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .rb-quick-subcategories {
          margin-bottom: 7px;
          padding-bottom: 6px;
        }
        .rb-quick-subcategory {
          padding: 5px 8px;
          font-size: 0.72em;
        }
        .rb-quick-replies {
          gap: 5px;
        }
        .rb-quick-reply {
          padding: 6px 8px;
          font-size: 0.78em;
        }
        .rb-custom-editor {
          grid-template-columns: minmax(0, 1fr) auto;
        }
        .rb-custom-input {
          grid-column: 1 / -1;
        }
      }
      @media (max-width: 380px) {
        .rb-quick-replies {
          grid-template-columns: 1fr;
        }
      }

      /* —— 旁白 / 叙事段落 —— */
      .rb-narration {
        margin: 14px 0;
        padding: 8px 14px;
        background: var(--rb-narration-bg);
        border-radius: 4px;
        color: var(--rb-text-soft);
        font-size: 0.96em;
        line-height: 1.95;
        white-space: pre-wrap;
        word-break: break-word;
      }

      .rb-workshop-gallery {
        margin: 24px 0 4px;
        padding-top: 18px;
        border-top: 1px dashed var(--rb-border-soft);
        clear: both;
      }
      .rb-workshop-figure {
        position: relative;
        margin: 0;
        overflow: hidden;
        border: 1px solid var(--rb-border-soft);
        border-radius: 10px;
        background: var(--rb-narration-bg);
      }
      .rb-workshop-media {
        position: relative;
        display: grid;
        width: 100%;
        min-height: 220px;
        place-items: center;
        overflow: hidden;
        color: var(--rb-text-muted);
        background:
          radial-gradient(circle at 48% 42%, color-mix(in srgb, var(--rb-accent) 10%, transparent), transparent 38%),
          var(--rb-narration-bg);
      }
      .rb-workshop-media img {
        display: block;
        width: 100%;
        height: auto;
        max-width: 100%;
        max-height: min(72vh, 760px);
        object-fit: contain;
        opacity: 0;
        cursor: default;
        transition: opacity 0.24s ease;
      }
      .rb-workshop-media.loaded img {
        opacity: 1;
      }
      .rb-workshop-load-state {
        position: absolute;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 8px;
        text-align: center;
        pointer-events: none;
      }
      .rb-workshop-load-state small {
        color: var(--rb-text-muted);
        font-size: 11px;
        letter-spacing: 0.08em;
      }
      .rb-workshop-spinner {
        width: 28px;
        height: 28px;
        margin: auto;
        border: 2px solid color-mix(in srgb, var(--rb-border-soft) 72%, transparent);
        border-top-color: var(--rb-accent);
        border-radius: 50%;
        box-shadow: 0 0 14px color-mix(in srgb, var(--rb-accent) 16%, transparent);
        animation: rb-workshop-spin 0.78s linear infinite;
      }
      .rb-workshop-load-state.error .rb-workshop-spinner {
        display: grid;
        place-items: center;
        border-color: color-mix(in srgb, var(--rb-accent) 58%, var(--rb-border-soft));
        color: var(--rb-accent);
        animation: none;
      }
      .rb-workshop-load-state.error .rb-workshop-spinner::before {
        content: '!';
        font: 700 17px/1 sans-serif;
      }
      @keyframes rb-workshop-spin {
        to {
          transform: rotate(360deg);
        }
      }
      .rb-workshop-caption {
        padding: 7px 10px;
        color: var(--rb-text-muted);
        font-size: 11px;
        line-height: 1.5;
        text-align: center;
      }
      .rb-workshop-controls {
        position: absolute;
        z-index: 2;
        left: 50%;
        bottom: 34px;
        display: flex;
        gap: 5px;
        padding: 5px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 999px;
        background: rgba(18, 18, 20, 0.64);
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.24);
        backdrop-filter: blur(8px);
        opacity: 0;
        transform: translate(-50%, 6px);
        transition:
          opacity 0.18s ease,
          transform 0.18s ease;
      }
      .rb-workshop-figure:hover .rb-workshop-controls,
      .rb-workshop-figure:focus-within .rb-workshop-controls {
        opacity: 1;
        transform: translate(-50%, 0);
      }
      .rb-workshop-control {
        display: grid;
        min-width: 30px;
        height: 30px;
        padding: 0 8px;
        place-items: center;
        border: 0;
        border-radius: 999px;
        color: rgba(255, 255, 255, 0.9);
        background: transparent;
        font: 600 12px/1 sans-serif;
        cursor: pointer;
      }
      .rb-workshop-control:hover,
      .rb-workshop-control.active {
        background: rgba(255, 255, 255, 0.16);
        color: #fff;
      }
      .rb-workshop-control:disabled {
        opacity: 0.32;
        cursor: default;
      }
      @media (hover: none), (pointer: coarse), (max-width: 600px) {
        .rb-workshop-media {
          min-height: 180px;
        }
        .rb-workshop-controls {
          bottom: max(34px, calc(env(safe-area-inset-bottom) + 30px));
          gap: 2px;
          padding: 4px;
          max-width: calc(100% - 12px);
          opacity: 1;
          transform: translate(-50%, 0);
        }
        .rb-workshop-control {
          min-width: 34px;
          height: 34px;
          padding: 0 7px;
          touch-action: manipulation;
        }
      }

      /* —— 插图大图查看器 —— */
      .rb-img-wrap img {
        cursor: zoom-in;
      }
      .rb-img-wrap img:focus-visible {
        outline: 2px solid var(--rb-accent);
        outline-offset: 3px;
      }
      .rb-image-viewer {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: none;
        overflow: hidden;
        background: #090710;
        color: #f3eadc;
        touch-action: none;
        overscroll-behavior: contain;
        user-select: none;
        -webkit-user-select: none;
      }
      .rb-image-viewer.active {
        display: block;
      }
      .rb-image-viewer:fullscreen {
        width: 100vw;
        height: 100vh;
        background: #090710;
      }
      .rb-image-viewer-backdrop {
        position: absolute;
        z-index: 0;
        inset: -36px;
        width: calc(100% + 72px);
        height: calc(100% + 72px);
        object-fit: cover;
        filter: blur(30px) brightness(0.3) saturate(0.82);
        transform: scale(1.06);
        opacity: 0.82;
        pointer-events: none;
      }
      .rb-image-viewer-stage {
        position: absolute;
        z-index: 1;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        cursor: grab;
      }
      .rb-image-viewer-stage.dragging {
        cursor: grabbing;
      }
      .rb-image-viewer-image {
        display: block;
        width: auto;
        height: auto;
        max-width: calc(100% - 28px);
        max-height: calc(100% - 104px);
        object-fit: contain;
        pointer-events: none;
        transform-origin: center center;
        will-change: transform;
        box-shadow: 0 12px 46px rgba(0, 0, 0, 0.55);
      }
      .rb-image-viewer-toolbar {
        position: absolute;
        z-index: 2;
        top: max(12px, env(safe-area-inset-top));
        right: max(12px, env(safe-area-inset-right));
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 7px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 12px;
        background: rgba(20, 16, 32, 0.82);
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
      }
      .rb-image-viewer-btn,
      .rb-image-viewer-scale {
        min-width: 38px;
        height: 34px;
        padding: 0 10px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.08);
        color: inherit;
        font: inherit;
        line-height: 32px;
        text-align: center;
      }
      .rb-image-viewer-btn {
        cursor: pointer;
      }
      .rb-image-viewer-btn:hover,
      .rb-image-viewer-btn:focus-visible {
        border-color: var(--rb-accent);
        background: rgba(212, 175, 55, 0.18);
        outline: none;
      }
      .rb-image-viewer-scale {
        min-width: 62px;
        color: rgba(255, 255, 255, 0.82);
        font-size: 12px;
      }
      .rb-image-viewer-caption {
        position: absolute;
        z-index: 2;
        left: 50%;
        bottom: max(12px, env(safe-area-inset-bottom));
        max-width: min(720px, calc(100% - 28px));
        transform: translateX(-50%);
        padding: 7px 12px;
        border-radius: 999px;
        background: rgba(20, 16, 32, 0.78);
        color: rgba(255, 255, 255, 0.76);
        font-size: 12px;
        line-height: 1.45;
        text-align: center;
        pointer-events: none;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
      }
      @media (max-width: 600px) {
        .rb-image-viewer-toolbar {
          left: 50%;
          right: auto;
          transform: translateX(-50%);
          gap: 5px;

      const RB_QUICK_ACTOR_STORAGE_KEY = 'rb-quick-reply-actors-v1';
      const RB_CUSTOM_REPLY_STORAGE_KEY = 'rb-custom-quick-replies-v1';
      const RB_QUICK_NPC_SLOTS = ['npc1', 'npc2', 'npc3'];
      let rbQuickActorState = {
        user: '主角',
        userIsFemale: false,
        npc1: '',
        npc2: '',
        npc3: '',
        npcNames: [],
      };

      function readQuickReplyStatData() {
        try {
          if (typeof getVariables !== 'function') return {};
          const variables = getVariables({ type: 'message', message_id: -1 });
          return variables && typeof variables.stat_data === 'object' ? variables.stat_data : {};
        } catch (error) {
          console.warn('[正文美化] 快捷回复读取 MVU 人物失败:', error);
          return {};
        }
      }

      function loadQuickReplyActorSelection() {
        try {
          const saved = JSON.parse(localStorage.getItem(RB_QUICK_ACTOR_STORAGE_KEY) || '{}');
          return saved && typeof saved === 'object' ? saved : {};
        } catch (_) {
          return {};
        }
      }

      function saveQuickReplyActorSelection() {
        try {
          localStorage.setItem(
            RB_QUICK_ACTOR_STORAGE_KEY,
            JSON.stringify({
              npc1: rbQuickActorState.npc1 || '',
              npc2: rbQuickActorState.npc2 || '',
              npc3: rbQuickActorState.npc3 || '',
            }),
          );
        } catch (_) {
          /* localStorage 不可用时只保留当前楼层选择 */
        }
      }

      function normalizeCustomQuickReply(reply, index = 0) {
        if (!reply || typeof reply !== 'object' || Array.isArray(reply)) return null;
        const label = String(reply.label || reply.name || reply.title || '')
          .trim()
          .slice(0, 60);
        const text = String(reply.text || reply.content || reply.value || '')
          .trim()
          .slice(0, 6000);
        if (!label || !text) return null;
        const rawId = String(reply.id || '').trim();
        const fallbackId = `custom-${Date.now().toString(36)}-${index}-${Math.random().toString(36).slice(2, 7)}`;
        return {
          id: (rawId || fallbackId).replace(/[^a-zA-Z0-9_-]/g, '-').slice(0, 90),
          label,
          text,
        };
      }

      function loadCustomQuickReplies() {
        try {
          const parsed = JSON.parse(localStorage.getItem(RB_CUSTOM_REPLY_STORAGE_KEY) || '[]');
          const replies = Array.isArray(parsed) ? parsed : Array.isArray(parsed && parsed.replies) ? parsed.replies : [];
          return replies.map(normalizeCustomQuickReply).filter(Boolean).slice(0, 300);
        } catch (_) {
          return [];
        }
      }

      function saveCustomQuickReplies(replies) {
        const normalized = (Array.isArray(replies) ? replies : [])
          .map(normalizeCustomQuickReply)
          .filter(Boolean)
          .slice(0, 300);
        localStorage.setItem(RB_CUSTOM_REPLY_STORAGE_KEY, JSON.stringify(normalized));
        return normalized;
      }

      function createCustomQuickReplyId() {
        try {
          if (crypto && typeof crypto.randomUUID === 'function') return `custom-${crypto.randomUUID()}`;
        } catch (_) {}
        return `custom-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 9)}`;
      }

      function importedCustomReplies(payload) {
        if (Array.isArray(payload)) return payload;
        if (!payload || typeof payload !== 'object') return [];
        if (Array.isArray(payload.replies)) return payload.replies;
        if (!Array.isArray(payload.categories)) return [];
        const flattened = [];
        payload.categories.forEach(category => {
          const categoryLabel = String((category && category.label) || '').trim();
          const collect = (replies, groupLabel = '') => {
            (Array.isArray(replies) ? replies : []).forEach(reply => {
              if (!reply || typeof reply !== 'object') return;
              const sourceLabel = String(reply.label || reply.name || '').trim();
              flattened.push({
                ...reply,
                label: [categoryLabel, groupLabel, sourceLabel].filter(Boolean).join(' · '),
              });
            });
          };
          collect(category && category.replies);
          (Array.isArray(category && category.groups) ? category.groups : []).forEach(group => {
            collect(group && group.replies, String((group && group.label) || '').trim());
          });
        });
        return flattened;
      }

      function exportCustomQuickReplies() {
        const replies = loadCustomQuickReplies();
        const payload = {
          format: 'rb-custom-quick-replies',
          version: 1,
          exportedAt: new Date().toISOString(),
          replies,
        };
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const anchor = document.createElement('a');
        anchor.href = url;
        anchor.download = '正文美化-自定义快捷回复.json';
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        showToast(replies.length ? `已导出 ${replies.length} 条自定义回复` : '已导出空白自定义回复配置');
      }

          const merged = new Map(loadCustomQuickReplies().map(reply => [reply.id, reply]));
          incoming.forEach(reply => {
            const duplicate = [...merged.values()].find(
              current => current.id === reply.id || (current.label === reply.label && current.text === reply.text),
            );
            merged.set(duplicate ? duplicate.id : reply.id || createCustomQuickReplyId(), {
              ...reply,
              id: duplicate ? duplicate.id : reply.id || createCustomQuickReplyId(),
            });
          });
          const saved = saveCustomQuickReplies([...merged.values()]);
          refreshCustomQuickReplyPanels();
          showToast(`已合并导入 ${incoming.length} 条，共 ${saved.length} 条`);
        } catch (error) {
          console.warn('[正文美化] 自定义快捷回复导入失败:', error);
          showToast(`导入失败：${error && error.message ? error.message : 'JSON 格式不正确'}`);
        }
      }

      function syncQuickReplyActorsFromMvu() {
        const statData = readQuickReplyStatData();
        const userName = String(statData && statData.姓名 ? statData.姓名 : '').trim() || '主角';
        const physique = statData && statData.体质 && typeof statData.体质 === 'object' ? statData.体质 : {};
        const userIsFemale = physique.元阴 != null && physique.元阳 == null;
        const relations = statData && statData.关系列表 && typeof statData.关系列表 === 'object' ? statData.关系列表 : {};
        const relationNames = Object.entries(relations)
          .filter(([name, value]) => {
            if (!String(name || '').trim() || !value || typeof value !== 'object' || Array.isArray(value)) return false;
            return !value.类型 || value.类型 === '人物';
          })
          .map(([name]) => String(name).trim())
          .filter((name, index, list) => name !== userName && list.indexOf(name) === index);
        const npcNames = [userName, ...relationNames];
        const saved = loadQuickReplyActorSelection();
        const nextState = { user: userName, userIsFemale, npcNames };
        RB_QUICK_NPC_SLOTS.forEach(slot => {
          const candidate = String(rbQuickActorState[slot] || saved[slot] || '').trim();
          nextState[slot] = npcNames.includes(candidate) ? candidate : '';
        });
        rbQuickActorState = nextState;
        return rbQuickActorState;
      }

      function quickReplyActorDisplayName(slot, rawName) {
        const name = String(rawName || '').trim();
        if (!name) return '';
        const slotIndex = RB_QUICK_NPC_SLOTS.indexOf(slot);
        let duplicateIndex = name === rbQuickActorState.user ? 1 : 0;
        RB_QUICK_NPC_SLOTS.slice(0, Math.max(0, slotIndex)).forEach(previousSlot => {
          if (rbQuickActorState[previousSlot] === name) duplicateIndex += 1;
        });
        return duplicateIndex > 0 ? `${name}分身${duplicateIndex}` : name;
      }

      function quickReplyActorDisplayValues() {
        return Object.fromEntries(
          RB_QUICK_NPC_SLOTS.map(slot => [slot, quickReplyActorDisplayName(slot, rbQuickActorState[slot])]),

      function selectedQuickReplyNpcs() {
        const displayValues = quickReplyActorDisplayValues();
        return RB_QUICK_NPC_SLOTS.map(slot => displayValues[slot]).filter(Boolean);

      // 模板：{{npc1|默认称呼}} / {{npc2|默认称呼}} / {{npc3|默认称呼}}
      // 多人：{{npcs|默认称呼}} 会把非空 NPC 槽位按 npc1 → npc3 用“、”连接。
      // 百合：女性主角时 yuri1/yuri2/yuri3 = user/npc1/npc2，否则 = npc1/npc2/npc3。
      function resolveQuickReplyTemplate(template) {
        const npcs = selectedQuickReplyNpcs();
        const displayValues = quickReplyActorDisplayValues();
        const yuriActors = rbQuickActorState.userIsFemale
          ? [rbQuickActorState.user, displayValues.npc1, displayValues.npc2]
          : [displayValues.npc1, displayValues.npc2, displayValues.npc3];
        const values = {
          user: rbQuickActorState.user || '主角',
          npc1: displayValues.npc1 || '',
          npc2: displayValues.npc2 || '',
          npc3: displayValues.npc3 || '',
          npcs: npcs.join('、'),
          yuri1: yuriActors[0] || '',
          yuri2: yuriActors[1] || '',
          yuri3: yuriActors[2] || '',
        };
        const resolved = String(template || '').replace(
          /\{\{(user|npc1|npc2|npc3|npcs|yuri1|yuri2|yuri3)(?:\|([^{}]*))?\}\}/g,
          (_match, slot, fallback = '') => values[slot] || fallback,
        );
        const userName = rbQuickActorState.user && rbQuickActorState.user !== '主角' ? rbQuickActorState.user : '';
        return userName ? resolved.replace(/主角/g, userName) : resolved;

      // ============== 内容渲染 ==============
      // 注意：SillyTavern 在把 iframe srcdoc 注入前会 HTML-decode 实体（&amp; → &），
      // 因此源码里不能出现裸的实体字面量；用 & (`&` 的 Unicode 转义) 把 '&' 隔开
      // 避开扫描器，JS 引擎仍会得到正确的 '&amp;' 等字符串。
      function escapeHtml(s) {
        return String(s)
          .replace(/&/g, '\u0026amp;')
          .replace(/</g, '\u0026lt;')
          .replace(/>/g, '\u0026gt;')
          .replace(/"/g, '\u0026quot;')
          .replace(/'/g, '\u0026#39;');
      }

      function decodeEntities(text) {
        if (!text || text.indexOf('&') === -1) return text;
        const ta = document.createElement('textarea');
        let cur = text;
        for (let i = 0; i < 4; i++) {
          ta.innerHTML = cur;
          const next = ta.value;
          if (next === cur) break;
          cur = next;
          if (cur.indexOf('&') === -1) break;
        }
        return cur;
      }

      function renderNarration(text) {

          .trim();
        if (!cleaned) return '';
        return `<div class="rb-narration">${escapeHtml(cleaned)}</div>`;
      }

      // 表格语法解析：{标题} + |行|（action/battle/item/realm 共用）
      function parseTablePanel(content) {
        const lines = _.chain(content).split('\n').map(_.trim).compact().value();
        const sections = [];
        let currentSection = null;
        _.forEach(lines, line => {
          const titleMatch = line.match(/^\{(.+?)\}$/);
          if (titleMatch) {
            // 标准 {标题} 行
            if (currentSection) sections.push(currentSection);
            currentSection = { title: titleMatch[1], rows: [] };
          } else if (_.startsWith(line, '|') && _.endsWith(line, '|')) {
            // | 数据 | 行;若上方没有 section 头,自动建一个匿名 section 兜底
            if (!currentSection) currentSection = { title: '', rows: [] };
            const rowContent = line.slice(1, -1).trim();
            if (rowContent) currentSection.rows.push(rowContent);
          } else {
            // 纯文本行:仅当尚无 section 时,视为 section 标题
            // (容错 AI 不带 {} 直接写名称,如 item_info 第一行写"赤铜残刀"而非"{赤铜残刀}")
            if (!currentSection) {
              currentSection = { title: line, rows: [] };
            } else if (/^[^:：(（]+[(（][^)）]+[)）]\s*$/.test(line)) {
              // 已有 section 时,仅当行形如 "name (meta)" 才推入 rows——这是 time_info
              // 中 {人物推演} 下的人物头行;括号注释如 "(若是静态判定:)" 因以括号开头
              // 不匹配 [^:：(（]+ 前缀,会被静默忽略
              currentSection.rows.push(line);
            }
          }
        });
        if (currentSection) sections.push(currentSection);
        return { sections };
      }

      // char_info 缩进式语法（一级标题无缩进、二级标题缩进 2 空格以冒号结尾）
      // 解析 char_info: 用栈构建任意深度的树,然后转成 items
      // 关键:先做"基础缩进归一化",AI 整段缩进时(<char_info> 内的内容套了 N 个空格)也能正确识别顶级
      function parseCharIndentedPanel(content) {
        const rawLines = content.split('\n');
        // 基础缩进:取所有非空行最小缩进,然后从每行减去
        let base = Infinity;
        for (const l of rawLines) {
          if (l.trim()) base = Math.min(base, l.search(/\S/));
        }
        if (!isFinite(base)) base = 0;

        // 用栈构建树:每个节点 { key, value, children, multiline? }
        const root = { children: [] };
        const stack = [{ node: root, indent: -1 }];

        for (let i = 0; i < rawLines.length; i++) {
          const line = rawLines[i];
          if (!line.trim()) continue;
          const rawIndent = line.search(/\S/);
          const indent = rawIndent - base;
          const trimmed = line.trim();

          // 弹栈直到栈顶 indent 严格小于当前 indent
          while (stack.length > 1 && stack[stack.length - 1].indent >= indent) {
            stack.pop();
          }
          const parent = stack[stack.length - 1].node;
          parent.children = parent.children || [];

          const colonIdx = trimmed.indexOf(':');
          let key, value;
          if (colonIdx > 0) {
            key = trimmed.slice(0, colonIdx).trim();
            value = trimmed.slice(colonIdx + 1).trim();
          } else {
            key = trimmed;
            value = '';
          }

          // 多行字符串 (key: |)
          if (value === '|') {
            const buf = [];
            let j = i + 1;
            // 收集后续 indent>当前 的所有行(去掉相对缩进)
            const childMinIndent = (() => {
              let m = Infinity;
              for (let k = i + 1; k < rawLines.length; k++) {
                const nl = rawLines[k];
                if (!nl.trim()) continue;
                const ni = nl.search(/\S/) - base;
                if (ni <= indent) break;
                if (ni < m) m = ni;
              }
              return isFinite(m) ? m : indent + 2;
            })();
            while (j < rawLines.length) {
              const nl = rawLines[j];
              if (!nl.trim()) {
                buf.push('');
                j++;
                continue;
              }
              const ni = nl.search(/\S/) - base;
              if (ni <= indent) break;
              const sliceFrom = base + childMinIndent;
              buf.push(nl.length > sliceFrom ? nl.slice(sliceFrom) : nl.trim());
              j++;
            }
            const node = { key, value: buf.join('\n').replace(/\s+$/, ''), children: [], multiline: true };
            parent.children.push(node);
            i = j - 1;
            continue;
          }

          const node = { key, value, children: [] };
          parent.children.push(node);

          // 空 value 表示后续可能有子节点
          if (value === '') {
            stack.push({ node, indent });
          }
        }

        // 树 → items(向后兼容旧渲染流程)
        const items = treeToCharItems(root.children);
        return { items, tree: root.children };
      }

      // 这些 section 的子节点视为"卡片化的物件"(每个子节点是一个 item),走 list-section 渲染
      const CHAR_LIST_SECTIONS = ['物品', '装备', '功法', '傀儡', '灵兽'];

      // 把树节点转成扁平 items 序列(每个顶级节点 → 一个 item)
      function treeToCharItems(nodes) {
        return nodes.map(n => {
          if (n.multiline) {
            return { kind: 'multiline', key: n.key, value: n.value };
          }
          if (!n.children || n.children.length === 0) {
            return { kind: 'scalar', key: n.key, value: n.value };
          }
          // 显式列出的"物件型" section 才走 list-section,且确认子节点确实是嵌套对象
          if (CHAR_LIST_SECTIONS.includes(n.key)) {
            const allNested = n.children.every(
              c => (c.value === '' || c.value == null) && c.children && c.children.length > 0,
            );
            if (allNested) {
              return {
                kind: 'list-section',
                title: n.key,
                items: n.children.map(c => ({
                  name: c.key,
                  fields: flattenCharFields(c.children),
                  raw: c.children, // 保留原始子树供 item-card 深度渲染(资源池/技能 等)
                })),
              };
            }
          }
          // 其他即便嵌套也走 section,fields 自动拍平,但保留 raw tree 给特殊渲染器用
          return { kind: 'section', title: n.key, fields: flattenCharFields(n.children), raw: n.children };
        });
      }

      // 把子节点拍平成 [{key, value}](三级以上的嵌套对象简短拼接成字符串)
      function flattenCharFields(children) {
        return children.map(c => {
          if ((c.value === '' || c.value == null) && c.children && c.children.length > 0) {
            // 嵌套对象 — 拼成 "k1: v1 / k2: v2"
            const sub = c.children.map(cc => cc.key + (cc.value ? ': ' + cc.value : '')).join(' / ');
            return { key: c.key, value: sub };
          }
          return { key: c.key, value: c.value };
        });
      }

      // —— 5 个 beautifyRow（行内文本高亮，每个 panel 独立规则） ——
      function beautifyActionRow(row) {

        html = html.replace(
