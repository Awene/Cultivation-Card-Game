      function refreshCustomQuickReplyPanels() {
        document.querySelectorAll('.rb-quick-group[data-quick-group="custom"]').forEach(group => {
          group.innerHTML = renderCustomQuickReplyGroupContent();
        });
        refreshQuickReplyActorBindings();
        scheduleIframeHeightRefresh();
      }

      function renderQuickReplyPanel() {
        syncQuickReplyActorsFromMvu();
        const normalizeReplies = (rawReplies, prefix) =>
          (Array.isArray(rawReplies) ? rawReplies : [])
            .map(reply => ({
              label: String(reply && reply.label ? reply.label : '').trim(),
              text: prefix + String(reply && reply.text ? reply.text : '').trim(),
            }))
            .filter(reply => reply.label && reply.text);

        const categories = RB_QUICK_REPLY_CONFIG.categories
          .map(category => {
            const id = String(category && category.id ? category.id : '').trim();
            const label = String(category && category.label ? category.label : '').trim();
            const icon = String(category && category.icon ? category.icon : 'fa-solid fa-bolt').trim();
            const prefix = String(category && category.prefix ? category.prefix : '');
            const replies = normalizeReplies(category && category.replies, prefix);
            const subgroups = (Array.isArray(category && category.groups) ? category.groups : [])
              .map(group => {
                const groupId = String(group && group.id ? group.id : '').trim();
                const groupLabel = String(group && group.label ? group.label : '').trim();
                const groupIcon = String(group && group.icon ? group.icon : 'fa-solid fa-circle').trim();
                const groupPrefix = prefix + String(group && group.prefix ? group.prefix : '');
                return {
                  id: groupId,
                  label: groupLabel,
                  icon: groupIcon,
                  replies: normalizeReplies(group && group.replies, groupPrefix),
                };
              })
              .filter(group => group.id && group.label && group.replies.length > 0);
            return { id, label, icon, replies, subgroups };
          })
          .filter(
            category =>
              category.id && category.label && (category.replies.length > 0 || category.subgroups.length > 0),
          );
        categories.push({
          id: 'custom',
          label: '自定',
          icon: 'fa-solid fa-plus',
          replies: [],
          subgroups: [],
          isCustom: true,
        });

        const buttons = categories
          .map(
            category =>
              `<button type="button" class="rb-quick-category" data-quick-category="${_.escape(category.id)}" ` +
              `aria-expanded="false" title="展开${_.escape(category.label)}快捷回复">` +
              `<i class="${_.escape(category.icon)}" aria-hidden="true"></i>` +
              `<span>${_.escape(category.label)}</span></button>`,
          )
          .join('');

        const groups = categories
          .map(category => {
            if (category.isCustom) {
              return (
                `<div class="rb-quick-group" data-quick-group="custom" hidden>` +
                `${renderCustomQuickReplyGroupContent()}</div>`
              );
            }
            let content;
            if (category.subgroups.length > 0) {
              const subgroupButtons = category.subgroups
                .map(
                  (group, index) =>
                    `<button type="button" class="rb-quick-subcategory${index === 0 ? ' active' : ''}" ` +
                    `data-quick-subcategory="${_.escape(group.id)}" role="tab" aria-selected="${index === 0}">` +
                    `<i class="${_.escape(group.icon)}" aria-hidden="true"></i>` +
                    `<span>${_.escape(group.label)}</span></button>`,
                )
                .join('');
              const subgroupPanels = category.subgroups
                .map(
                  (group, index) =>
                    `<div class="rb-quick-subgroup" data-quick-subgroup="${_.escape(group.id)}"${index === 0 ? '' : ' hidden'}>` +
                    `<div class="rb-quick-subgroup-title">${_.escape(group.label)} · ${group.replies.length} 项</div>` +
                    `${renderQuickReplyItems(group.replies)}</div>`,
                )
                .join('');
              content =
                `<div class="rb-quick-subcategories" role="tablist" aria-label="${_.escape(category.label)}二级分类">` +
                `${subgroupButtons}</div>${subgroupPanels}`;
            } else {
              content = renderQuickReplyItems(category.replies);
            }
            return (
              `<div class="rb-quick-group" data-quick-group="${_.escape(category.id)}" hidden>` +
              `<div class="rb-quick-panel-head"><span>${_.escape(category.label)}快捷回复</span>` +
              `<small>点击填入输入框，不会自动发送</small></div>` +
              `${content}</div>`
            );
          })
          .join('');

        return {
          buttons: `<div class="rb-quick-categories" role="toolbar" aria-label="固定快捷回复分类">${buttons}</div>`,
          panel: `<div class="rb-quick-panel" hidden>${renderQuickReplyActorPanel()}${groups}</div>`,
          hasCategories: true,
        };
      }

      // —— 行动选项 <options>/<action_options> 渲染:解析 "1. xxx / 2. xxx / ..." 列表为可点击编号卡片 —— //
      // 点击会把选项文本追加到酒馆输入框,不自动发送、不替换原有输入
      function renderActionOptions(inner) {
        const text = String(inner || '')
          .replace(/<br\s*\/?>/gi, '\n')
          .replace(/<\/?(?:p|div|li|ol|ul|h[1-6])[^>]*>/gi, '\n')
          .replace(/<[^>]+>/g, '')
          .replace(/&nbsp;/g, ' ')
          .trim();
        if (!text) return '';

        const lines = text
          .split(/\n+/)
          .map(l => l.trim())
          .filter(Boolean);
        const options = [];
        for (const line of lines) {
          const m = line.match(/^(\d+)\s*[.、)\]:]\s*(.+)$/);
          if (m) {
            options.push({ idx: m[1], text: m[2].trim() });
          } else if (options.length > 0) {
            options[options.length - 1].text += '\n' + line;
          } else {
            // 行首没有编号且没有已有项 -> 视为整段说明,直接归入第 0 项
            options.push({ idx: '·', text: line });
          }
        }

        let body;
        if (options.length === 0) {
          body = `<div class="rb-options-item" data-option-text="${_.escape(text)}"><span class="rb-options-text">${_.escape(text)}</span></div>`;
        } else {
          body = options
            .map(
              o =>
                `<div class="rb-options-item" data-option-text="${_.escape(o.text)}" title="点击填入输入框">` +
                `<span class="rb-options-num">${_.escape(o.idx)}</span>` +
                `<span class="rb-options-text">${_.escape(o.text)}</span>` +
                `</div>`,
            )
            .join('');
        }

        const quickReplies = renderQuickReplyPanel();
        const sectionLabel = quickReplies.hasCategories
          ? `<div class="rb-options-section-label"><span>本轮建议</span></div>`
          : '';

        return (
          `<div class="rb-options">` +
          `<div class="rb-options-head">` +
          `<i class="rb-options-icon fa-solid fa-compass-drafting"></i>` +
          `<span class="rb-options-title">行动方略</span>` +
          `<span class="rb-options-count">本轮 ${Math.max(1, options.length)} 项</span>` +
          quickReplies.buttons +
          `</div>` +
          quickReplies.panel +
          `<div class="rb-options-body">${sectionLabel}${body}</div>` +
          `</div>`
        );
      }

      function reincarnationHost(inner) {
        const payload = String(inner || '').trim();
        if (!payload) return '';
        return `<div class="rc-app" data-rc-raw="${encodeURIComponent(payload)}"></div>`;
      }

      // AI 完全漏掉外层标签时，只在四个轮回段落和 Z/W 同时存在时才兜底识别，避免误伤普通正文。
      function extractLooseReincarnation(raw, wrap) {
        const soul =
          /(?:\{|\[|【|(?:^|\n)\s*#{1,6}\s*)(?:亡魂信息|亡魂资料|亡魂档案|死者信息|逝者信息)(?:\}|\]|】)?/i.exec(raw);
        if (!soul || soul.index == null) return raw;
        const segment = raw.slice(soul.index, soul.index + 20000);
        if (!/(?:\{|\[|【|#{1,6}\s*)?(?:善业|善行|善举|功德)(?:\}|\]|】)?/i.test(segment)) return raw;
        if (!/(?:\{|\[|【|#{1,6}\s*)?(?:恶业|恶行|罪业|罪行)(?:\}|\]|】)?/i.test(segment)) return raw;
        const adjust = /(?:功过修正|功德修正|善恶修正|业力修正)/i.exec(segment);
        if (!adjust || adjust.index == null) return raw;
        const adjustmentTail = segment.slice(adjust.index);
        const values =
          /(?:^|[^A-Za-z0-9_])Z\s*(?:[:=]\s*)?(?:[\[（(【]\s*)?[+-]?\d+(?:\.\d+)?\s*[%％]?\s*[\]）)】]?\s*(?:[/,，|;；])?[\s\S]{0,160}?(?:^|[^A-Za-z0-9_])W\s*(?:[:=]\s*)?(?:[\[（(【]\s*)?[+-]?\d+(?:\.\d+)?\s*[\]）)】]?/i.exec(
            adjustmentTail,
          );
        if (!values || values.index == null) return raw;
        const end = soul.index + adjust.index + values.index + values[0].length;
        const payload = raw.slice(soul.index, end);
        return raw.slice(0, soul.index) + wrap(reincarnationHost(payload)) + raw.slice(end);
      }

      // 把 raw 中的结构化面板抽走、留 placeholder（避免被 paragraph splitter 切碎）
      // 顺序：内层（item/char/realm/battle）先于外层（action）；按 prompt 设计本不应嵌套
      function extractPanels(raw, stash) {
        const wrap = html => (html ? '\n\n' + stash(html) + '\n\n' : '\n\n');
        // 面板开头标签要求位于行首，避免 AI 思维链/正文里出现的行内字面引用（如 `...`<item_info>`...`）被误当成面板
        raw = raw.replace(/(?:^|\n)\s*<item_info>([\s\S]*?)<\/item_info>/gi, (m, inner) =>
          wrap(safeRenderPanel('item_info', parseTablePanel, renderItemHtml, inner)),
        );
        raw = raw.replace(/(?:^|\n)\s*<task_info>([\s\S]*?)<\/task_info>/gi, (m, inner) =>
          wrap(safeRenderPanel('task_info', parseTablePanel, renderTaskHtml, inner)),
        );
        raw = raw.replace(/(?:^|\n)\s*<char_info>([\s\S]*?)<\/char_info>/gi, (m, inner) =>
          wrap(safeRenderPanel('char_info', parseCharIndentedPanel, renderCharHtml, inner)),
        );
        raw = raw.replace(/(?:^|\n)\s*<battle_info>([\s\S]*?)<\/battle_info>/gi, (m, inner) =>
          wrap(safeRenderPanel('battle_info', parseTablePanel, renderBattleHtml, inner)),
        );
        raw = raw.replace(/(?:^|\n)\s*<action_info>([\s\S]*?)<\/action_info>/gi, (m, inner) =>
          wrap(safeRenderPanel('action_info', parseTablePanel, renderActionHtml, inner)),
        );
        raw = raw.replace(/(?:^|\n)\s*<time_info>([\s\S]*?)<\/time_info>/gi, (m, inner) =>
          wrap(safeRenderPanel('time_info', parseTablePanel, renderTimeHtml, inner)),
        );
        // 兼容标准标签、连字符/空格标签以及全角尖括号。
        // 不能在此使用捕获组替换字符串：正文美化本身也是酒馆正则的 replacement，
        // 外层替换会误把捕获组占位符展开成整段正文，导致脚本语法损坏。
        raw = raw.replace(
          /＜\s*(\/?\s*reincarnation(?:[\s_-]*info)?)\s*＞/gi,
          (_match, tagName) => '<' + tagName + '>',
        );
        const rcTag = 'reincarnation(?:[\\s_-]*info)?';
        raw = raw.replace(
          new RegExp(`(?:^|\\n)\\s*<\\s*${rcTag}\\b[^>]*>([\\s\\S]*?)<\\s*\\/\\s*${rcTag}\\s*>`, 'gi'),
          (m, inner) => wrap(reincarnationHost(inner)),
        );
        // AI 漏写闭合标签时，轮回面板按规则位于回复末尾；遇到下一种结构化面板时也会及时截止。
        raw = raw.replace(
          new RegExp(
            `(?:^|\\n)\\s*<\\s*${rcTag}\\b[^>]*>([\\s\\S]*?)(?=<\\s*\\/?\\s*(?:action_info|battle_info|char_info|item_info|task_info|time_info|now_plot|gametxt)\\b|$)`,
            'gi',
          ),
          (m, inner) => wrap(reincarnationHost(inner)),
        );
        raw = extractLooseReincarnation(raw, wrap);
        // 清理任何未配对的孤儿标签(AI 截断、写漏闭合等)
        raw = raw.replace(
          /<\/?(?:action_info|battle_info|char_info|item_info|task_info|time_info|reincarnation(?:[\s_-]*info)?)\b[^>]*>?/gi,
          '',
        );
        return raw;
      }

      let rbIframeResizeTimer = 0;
      function fitMessageIframeHeight() {
        try {
          const frame = window.frameElement;
          if (!frame || !document.body || !document.documentElement) return;
          /* 不能先把 iframe 压到 1px 再读 scrollHeight：选项列表使用 vh 限高，
           * 那样会令它按 1px 视口重新排版并得到严重偏小的高度，造成正文被裁切。
           * 直接读取所有正常文档流子元素的实际底边；fixed/absolute 浮层不参与楼层高度。 */
          const flowBottom = [...document.body.children].reduce((bottom, element) => {
            const style = getComputedStyle(element);
            if (style.display === 'none' || style.position === 'fixed' || style.position === 'absolute') return bottom;
            const rect = element.getBoundingClientRect();
            const marginBottom = Number.parseFloat(style.marginBottom) || 0;
            return Math.max(bottom, rect.bottom + window.scrollY + marginBottom);
          }, 0);
          const height = Math.max(flowBottom, 1);
          frame.style.height = `${Math.ceil(height)}px`;
        } catch (_) {
          /* 独立预览页或浏览器限制 frameElement 时，仍由酒馆助手 ResizeObserver 处理。 */
        }
      }

      function scheduleIframeHeightRefresh() {
        fitMessageIframeHeight();
        clearTimeout(rbIframeResizeTimer);
        rbIframeResizeTimer = setTimeout(fitMessageIframeHeight, 480);
      }

      // 折叠点击事件委托（只挂一次）

          // 固定快捷回复分类：同一分类再次点击即收起，AI 本轮建议始终保留在下方。

            });

          });
          // 二级分类只切换当前一级分类里的具体玩法，不影响其他行动方略面板。
          $('#readingContent').on('click', '.rb-quick-subcategory', function (event) {
            event.stopPropagation();
            const $button = $(this);

            const targetKey = $button.attr('data-quick-subcategory') || '';
            if (!targetKey || $button.hasClass('active')) return;

            $group.find('.rb-quick-subcategory').removeClass('active').attr('aria-selected', 'false');
            $button.addClass('active').attr('aria-selected', 'true');
            $group.find('.rb-quick-subgroup').each(function () {
              $(this).prop('hidden', $(this).attr('data-quick-subgroup') !== targetKey);
            });
            const activeList = $group
              .find(`.rb-quick-subgroup[data-quick-subgroup="${CSS.escape(targetKey)}"] .rb-quick-replies`)
              .get(0);
            if (activeList) activeList.scrollTop = 0;
            scheduleIframeHeightRefresh();
          });
          // 纵向列表直接响应滚轮；一级/二级分类横条把普通滚轮转换为横向滚动。
          // 只有容器确实还能继续滚动时才拦截事件，抵达边界后仍可滚动酒馆页面。
          document.getElementById('readingContent').addEventListener(
            'wheel',
            event => {
              const source = event.target instanceof Element ? event.target : null;
              if (!source) return;

              const horizontal = source.closest('.rb-quick-categories, .rb-quick-subcategories');
              if (horizontal && horizontal.scrollWidth > horizontal.clientWidth) {
                const delta = Math.abs(event.deltaY) >= Math.abs(event.deltaX) ? event.deltaY : event.deltaX;
                const before = horizontal.scrollLeft;
                const maximum = horizontal.scrollWidth - horizontal.clientWidth;
                horizontal.scrollLeft = Math.max(0, Math.min(maximum, before + delta));
                if (horizontal.scrollLeft !== before) {
                  event.preventDefault();
                  event.stopPropagation();
                }
                return;
              }

              const vertical = source.closest('.rb-quick-replies, .rb-custom-list, .rb-options-body');
              if (!vertical || vertical.scrollHeight <= vertical.clientHeight) return;
              const delta = event.deltaY || event.deltaX;
              const before = vertical.scrollTop;
              const maximum = vertical.scrollHeight - vertical.clientHeight;
              vertical.scrollTop = Math.max(0, Math.min(maximum, before + delta));
              if (vertical.scrollTop !== before) {
                event.preventDefault();
                event.stopPropagation();
              }
            },
            { passive: false },
          );
          $('#readingContent').on('click', '[data-custom-action]', function (event) {

              if (!reply) return;
              $group.find('[data-custom-field="id"]').val(reply.id);
              $group.find('[data-custom-field="label"]').val(reply.label).trigger('focus');

            if (action === 'delete') {

              saveCustomQuickReplies(replies);

            if (action === 'save') {

              const label = String($group.find('[data-custom-field="label"]').val() || '').trim();
              const text = String($group.find('[data-custom-field="text"]').val() || '').trim();
              if (!label || !text) {
                showToast('请同时填写按钮名称和回复内容');
                return;
              }
              const replies = loadCustomQuickReplies();
              const next = normalizeCustomQuickReply({ id: id || createCustomQuickReplyId(), label, text });
              const index = replies.findIndex(item => item.id === id);

              else replies.push(next);
              saveCustomQuickReplies(replies);
              refreshCustomQuickReplyPanels();
              showToast(index >= 0 ? '已保存自定义回复' : '已添加自定义回复');
            }
          });
          $('#readingContent').on('change', '.rb-custom-file', async function (event) {
            event.stopPropagation();
            const file = this.files && this.files[0];
            this.value = '';
            await importCustomQuickReplies(file);
          });
          // AI 选项与固定快捷回复点击 -> 追加到酒馆输入框,不自动发送、不替换原值
          $('#readingContent').on('click', '.rb-options-item, .rb-quick-reply', function () {
            const template = $(this).attr('data-option-template') || '';
            const text = template
              ? resolveQuickReplyTemplate(template)
              : $(this).attr('data-option-text') || $(this).find('.rb-options-text').text() || '';
            if (!text.trim()) return;
            fillSendTextarea(text);
            const el = this;
            el.classList.remove('is-sent');
            // force reflow 触发动画重新播放
            void el.offsetWidth;
            el.classList.add('is-sent');
            setTimeout(() => el.classList.remove('is-sent'), 700);
          });
          document.addEventListener(
            'toggle',
            event => {
              if (event.target && event.target.matches && event.target.matches('details.rb-summary')) {
                scheduleIframeHeightRefresh();
              }
            },
            true,
          );
          window.addEventListener('storage', event => {
            if (event.key === RB_CUSTOM_REPLY_STORAGE_KEY) refreshCustomQuickReplyPanels();
          });
        } catch (e) {
          console.warn('[正文美化] 折叠委托绑定失败:', e);
        }
      }

      // 把选项文本追加到酒馆输入框 #send_textarea
      // 优先尝试同 document(预设是嵌入页) -> 再尝试 window.parent(被 iframe 时)
      function fillSendTextarea(text) {
        if (!text) return;
        const candidates = [];
        try {
          if (document) candidates.push(document);
        } catch (e) {
          /* ignore */
        }
        try {
          if (window.parent && window.parent !== window) candidates.push(window.parent.document);
        } catch (e) {
          /* cross-origin: ignore */
        }
        try {
          if (window.top && window.top !== window) candidates.push(window.top.document);
        } catch (e) {
          /* ignore */
        }

        let inputArea = null;
        for (const doc of candidates) {
          if (!doc) continue;
          inputArea = doc.querySelector('#send_textarea') || doc.querySelector('textarea#send_textarea');
          if (inputArea) break;
        }
        if (!inputArea) {
          console.warn('[正文美化] 未找到 #send_textarea, 选项无法填入');
          return;
        }
        const cur = inputArea.value || '';
        const sep = cur.length === 0 ? '' : cur.endsWith('\n') ? '' : '\n';
        inputArea.value = cur + sep + text;
        try {
          inputArea.dispatchEvent(new Event('input', { bubbles: true }));
          inputArea.dispatchEvent(new Event('change', { bubbles: true }));
        } catch (e) {
          /* ignore */
        }
        try {
          inputArea.focus();
        } catch (e) {
          /* ignore */
        }
        // 自动滚动到末尾
        try {
          inputArea.selectionStart = inputArea.selectionEnd = inputArea.value.length;
          inputArea.scrollTop = inputArea.scrollHeight;
        } catch (e) {
          /* ignore */
        }
      }

      /** 轮回转生交互面板：串行注入，确保多楼层不会争用同一个兼容载荷。 */
      const RB_ASSET_BASE = String(window.__rb_asset_base || 'http://localhost:5500/dist').replace(/\/$/, '');
      const RC_APP_URL = RB_ASSET_BASE + '/轮回转生/index.html';
      async function mountReincarnationApps() {
        if (typeof $ === 'undefined') return;
        const container = document.getElementById('readingContent');
        if (!container) return;
        const hosts = Array.from(container.querySelectorAll('.rc-app:not([data-rc-loading])'));
        for (const host of hosts) {
          host.setAttribute('data-rc-loading', 'true');
          try {
            window.__reincarnation_payload = decodeURIComponent(host.getAttribute('data-rc-raw') || '');
          } catch (e) {
            window.__reincarnation_payload = host.getAttribute('data-rc-raw') || '';
          }
          await new Promise(resolve => {
            $(host).load(RC_APP_URL, function (_response, status) {
              try {
                if (status === 'error') {
                  this.classList && this.classList.add('rc-load-error');
                  this.textContent = '轮回面板加载失败，请检查网络后重新打开本楼层。';
                } else {
                  this.classList && this.classList.add('rc-loaded');
                }
              } catch (e) {
                /* ignore */
              }
              resolve();
            });
          });
        }
      }

      /** 主渲染：保留普通正文段落，并抽取结构化面板。 */
      function processContent() {
        const container = document.getElementById('readingContent');
        if (!container) return;
        let raw = container.innerHTML;
        if (!raw) return;

        // 1) 先解码实体（让 &lt;action_info&gt; 之类还原成真实标签）
        raw = decodeEntities(raw);

        // 酒馆 Markdown 会将换行序列化为 <br>；面板仅接受行首标签，必须先还原换行。
        // 否则 <br><char_info> 等真实面板会错过抽取，退化为普通正文。
        raw = raw.replace(/<br\s*\/?>(?:\r?\n)?/gi, '\n');

        // 1.5) 剥离 HTML 注释 <!-- ... --> （AI 把子思维链放在注释里）
        raw = raw.replace(/<!--[\s\S]*?-->/g, '');
        // 顺手清理孤儿的 --> 或 <!-- 标记字符串（仅当它们是行首/行尾的独立 token，避免误伤正文）
        raw = raw.replace(/^\s*-->\s*$/gm, '');
        raw = raw.replace(/^\s*<!--\s*$/gm, '');

        // 1.6) 删除系统元数据块(变量更新、disclaimer 英文诗) - 用户不应看到
        raw = raw.replace(/<UpdateVariable\b[^>]*>[\s\S]*?<\/UpdateVariable>/gi, '');
        raw = raw.replace(/<disclaimer\b[^>]*>[\s\S]*?<\/disclaimer>/gi, '');
        raw = raw.replace(/<\/?(?:UpdateVariable|disclaimer)\b[^>]*>?/gi, '');

        // 1.7) 剥离纯容器标签 <now_plot>/<gametxt> 仅去标签保留内层
        raw = raw.replace(/<\/?(?:now_plot|gametxt)\b[^>]*>?/gi, '');

        // 2) 抽取 5 类面板，留 U+2063 包裹的 placeholder（不会被 escape/trim/split 破坏）
        const panelMap = new Map();
        let panelCounter = 0;
        const optionPanelTokens = [];
        const stashPanel = htmlFragment => {
          const token = `⁣RB_PANEL_${panelCounter++}⁣`;
          panelMap.set(token, htmlFragment);
          return token;
        };
        // 2.1) 抽取 <tp> 时空栏(在面板抽取前,因为它一般在正文开头)
        try {
          raw = raw.replace(
            /<tp>([\s\S]*?)<\/tp>/gi,
            (m, inner) => '\n\n' + stashPanel(renderTimeSpaceHeader(inner.trim())) + '\n\n',
          );
          // 清理孤儿 <tp>/<\/tp> 标签(AI 截断或写漏)
          raw = raw.replace(/<\/?tp\b[^>]*>?/gi, '');
        } catch (e) {
          console.warn('[正文美化] <tp> 抽取失败:', e);
        }

        // 2.2) 抽取小总结:
        //   - 旧格式 <details><summary>title</summary>body</details>
        //   - 新格式 <summary>body</summary> (独立标签,无 <details> 包裹)
        try {
          raw = raw.replace(/<details\b[^>]*>([\s\S]*?)<\/details>/gi, (m, inner) => {
            const sm = inner.match(/<summary[^>]*>([\s\S]*?)<\/summary>([\s\S]*)/i);
            const title = sm ? sm[1].trim() : '小总结';
            const body = sm ? sm[2].trim() : inner.trim();
            return '\n\n' + stashPanel(renderSummaryCard(title, body)) + '\n\n';
          });
          // 独立 <summary>...</summary>(<details> 已被上一行剥离，剩下的就是新格式)
          raw = raw.replace(
            /<summary\b[^>]*>([\s\S]*?)<\/summary>/gi,
            (m, inner) => '\n\n' + stashPanel(renderSummaryCard('小总结', inner.trim())) + '\n\n',
          );
          // 清理孤儿 <details>/<summary> 标签
          raw = raw.replace(/<\/?(?:details|summary)\b[^>]*>?/gi, '');
        } catch (e) {
          console.warn('[正文美化] <details>/<summary> 抽取失败:', e);
        }

        // 2.3) 抽取 <options>/<action_options> 行动选项 (两种命名兼容)
        try {
          raw = raw.replace(/<(?:action_)?options\b[^>]*>([\s\S]*?)<\/(?:action_)?options>/gi, (m, inner) => {
            const token = stashPanel(renderActionOptions(inner.trim()));
            optionPanelTokens.push(token);
            return '\n\n' + token + '\n\n';
          });
          raw = raw.replace(/<\/?(?:action_)?options\b[^>]*>?/gi, '');
        } catch (e) {
          console.warn('[正文美化] <options> 抽取失败:', e);
        }

        try {
          raw = extractPanels(raw, stashPanel);
        } catch (e) {
          console.warn('[正文美化] 面板抽取失败:', e);
        }

        // 轮回审判本身就是本回合唯一需要玩家处理的交互；若成功识别出轮回面板，
        // 丢弃本楼全部行动方略，避免它与轮回选择同时出现并误导玩家。
        const hasReincarnationPanel = [...panelMap.values()].some(htmlFragment =>
          /class=["'][^"']*\brc-app\b/i.test(htmlFragment),
        );
        if (hasReincarnationPanel) {
          optionPanelTokens.forEach(token => {
            raw = raw.split(token).join('');
            panelMap.delete(token);
          });
        }

        // 2.4) 抽取 <img>(玩家手动插入 / SD 文生图插件生成)
        //   - 不抽的话: escapeHtml 会把 <img> 转义成字面文本,图片不显示
        //   - 抽且不规范化的话: 某些插件把 <img> 包在 inline-block / float 容器里,
        //     手机端会撑破布局,变成"主文 + 侧栏"两列错位 (玩家反馈的现象)
        //   解法: 剥掉所有外层 figure/picture/aside/section 包装,只保留 img,
        //         然后包进我们自己的 .rb-img-wrap 强制 max-width:100% / block / clear:both
        try {
          // 先剥掉 figure/picture/aside/section 容器(可能带 SD 插件的 inline style)
          //   <source> 是 <picture> 的子元素,单独保留会被 escapeHtml 显示为字面 HTML
          raw = raw.replace(
            /<(figure|picture|aside|section)\b[^>]*>([\s\S]*?)<\/\1>/gi,
            (_match, _wrapperTag, content) => content,
          );
          raw = raw.replace(/<\/?(?:figure|picture|aside|section)\b[^>]*>?/gi, '');
          raw = raw.replace(/<source\b[^>]*\/?>/gi, '');
          // 抽出所有 img 走 stashPanel,只保留 src/alt,丢弃外部 inline style/class/onclick
          raw = raw.replace(/<img\b([^>]*)\/?>/gi, (_m, attrs) => {
            const srcMatch = attrs.match(/\bsrc\s*=\s*"([^"]*)"/i) || attrs.match(/\bsrc\s*=\s*'([^']*)'/i);
            const altMatch = attrs.match(/\balt\s*=\s*"([^"]*)"/i) || attrs.match(/\balt\s*=\s*'([^']*)'/i);
            const src = srcMatch ? srcMatch[1] : '';
            const alt = altMatch ? altMatch[1] : '';
            if (!src) return ''; // 没 src 的空 img 直接丢
            const safeSrc = src.replace(/"/g, '&quot;');
            const safeAlt = escapeHtml(alt);
            return (
              '\n\n' +
              stashPanel(
                `<figure class="rb-img-wrap"><img src="${safeSrc}" alt="${safeAlt}" loading="lazy" tabindex="0" role="button" title="点击查看大图"></figure>`,
              ) +
              '\n\n'
            );
          });
        } catch (e) {
          console.warn('[正文美化] <img> 抽取失败:', e);
        }

        // 3) 继续原有的标签剥离 & 空白规整
        raw = raw
          .replace(/<style[^>]*>[\s\S]*?<\/style>/gi, '')
          .replace(/<br\s*\/?>/gi, '\n')
          .replace(/<\/(?:p|div|li|h[1-6]|blockquote)>/gi, '\n')
          .replace(/<(?:hr)\s*\/?>/gi, '\n\n')
          .replace(
            /<\/?(?:div|span|p|ul|ol|li|strong|em|b|i|h[1-6]|a|br|hr|blockquote|pre|code|table|thead|tbody|tr|td|th)[^>]*>/gi,
            '',
          )
          .replace(/[\t ]+\n/g, '\n')
          .replace(/\n{3,}/g, '\n\n');

        // 全是面板（无文本）也要继续，否则面板渲染不到
        if (!raw.trim() && panelMap.size === 0) return;

        const lines = raw
          .split(/\n+/)
          .map(s => s.trim())
          .filter(Boolean);

        const out = [];
        const panelTokenRe = /^⁣RB_PANEL_\d+⁣$/;
        // 只把本楼普通叙事正文交给本地选图；结构化面板、变量块与已有图片均已替换为占位符。
        container.__workshopText = lines.filter(line => !panelTokenRe.test(line)).join('\n');

        for (const line of lines) {
          // 面板占位符：直接放入，不裹 narration 容器
          if (panelTokenRe.test(line)) {
            out.push(line);
            continue;
          }
          const html = renderNarration(line);
          if (html) out.push(html);
        }

        // 4) 还原 placeholder 为真实面板 HTML
        let finalHtml = out.join('');
        panelMap.forEach((html, token) => {
          finalHtml = finalHtml.split(token).join(html);
        });
        container.innerHTML = finalHtml;

        // 4.5) 挂载轮回转生交互面板（<reincarnation_info> → dist/轮回转生）
        try {
          void mountReincarnationApps();
        } catch (e) {
          console.warn('[正文美化] 轮回转生挂载失败:', e);
        }

        // 5) 单次绑定折叠点击委托
        ensurePanelClickDelegation();
      }

      // ============== 主题切换 ==============
      function applyTheme(theme, shouldBroadcast = true) {
        const t = theme === 'light' ? 'light' : 'dark';
        document.body.setAttribute('data-theme', t);
        try {
          localStorage.setItem(THEME_KEY, t);
        } catch (e) {
          /* ignore */
        }
        // 广播给其它 realm（思维链美化等各自独立的 iframe）。它们据此即时同步主题，
        // 从而不必各自跑一个永不停止的轮询定时器。同源无沙盒 iframe 才能拿到 window.top。
        if (shouldBroadcast) {
          try {
            (window.top || window).dispatchEvent(new CustomEvent('rb-theme-change', { detail: t }));
          } catch (e) {

      function applyFontSize(size, persist = true) {
        const root = document.querySelector('.rb-content');
        if (!root) return;
        const next = Math.max(MIN_READING_FONT_SIZE, Math.min(MAX_READING_FONT_SIZE, Math.round(Number(size) || 0)));
        const scale = next / BASE_READING_FONT_SIZE;

        root.dataset.fontSize = String(next);
        if (CSS.supports && CSS.supports('zoom', '1')) {
          root.style.setProperty('--rb-reading-scale', String(scale));
          root.style.width = '100%';
          root.style.fontSize = BASE_READING_FONT_SIZE + 'px';
        } else {
          // 非 Chromium 旧浏览器退化为仅调字号，至少保证阅读设置仍然可用。
          root.style.removeProperty('--rb-reading-scale');
          root.style.width = '100%';
          root.style.fontSize = next + 'px';
        }

        const value = document.getElementById('fontSizeValue');
        if (value) value.textContent = `${next}px · ${Math.round(scale * 100)}%`;
        document.querySelectorAll('[data-action="font"]').forEach(button => {
          const delta = parseInt(button.getAttribute('data-arg') || '0', 10);
          button.disabled =
            (delta < 0 && next <= MIN_READING_FONT_SIZE) || (delta > 0 && next >= MAX_READING_FONT_SIZE);
        });

        if (persist) {
          try {
            localStorage.setItem(FONT_SIZE_KEY, String(next));
          } catch (e) {
            /* ignore */
          }
        }
      }

            <button type="button" class="rb-workshop-control" data-workshop-action="rating" title="切换 SFW / NSFW"></button>
            <button type="button" class="rb-workshop-control" data-workshop-action="pack" title="切换图包" aria-label="切换图包">⇄</button>
            <button type="button" class="rb-workshop-control" data-workshop-action="autoplay" title="关闭 10 秒轮播" aria-label="轮播" aria-pressed="true">Ⅱ</button>
            <button type="button" class="rb-workshop-control" data-workshop-action="fullscreen" title="全屏查看" aria-label="全屏查看">⛶</button>`;
          media.append(img, loadState);
          figure.append(media, controls, caption);
          gallery.appendChild(figure);

          let packIndex = Math.max(
            0,
            player.packs.findIndex(pack => pack.id === player.preferredPackId),
          );
          let rating = player.initialRating;
          let imageIndex = 0;
          let autoplayTimer = null;
          let autoplayEnabled = getWorkshopAutoplayPreference();
          let autoplayIntervalSeconds = getWorkshopAutoplayInterval();
          const urls = new Map();
          const currentPack = () => player.packs[packIndex];
          const currentImages = () => currentPack().images.filter(image => image.rating === rating);
          const urlFor = image => {
            if (!urls.has(image.id)) {
              const url = URL.createObjectURL(image.blob);
              urls.set(image.id, url);
              workshopObjectUrls.push(url);
            }
            return urls.get(image.id);
          };
          const updateButtons = () => {
            const group = currentImages();
            controls
              .querySelectorAll('[data-workshop-action="previous"], [data-workshop-action="next"]')
              .forEach(button => {
                button.disabled = group.length < 2;
              });
            const ratingButton = controls.querySelector('[data-workshop-action="rating"]');
            ratingButton.hidden = player.kind !== 'character';
            ratingButton.textContent = rating.toUpperCase();
            ratingButton.disabled = !player.packs.some(pack => pack.images.some(image => image.rating !== rating));
            controls.querySelector('[data-workshop-action="pack"]').disabled =
              player.packs.filter(pack => pack.images.some(image => image.rating === rating)).length < 2;
          };
          const stopAutoplayTimer = () => {
            if (!autoplayTimer) return;
            clearInterval(autoplayTimer);
            workshopAutoplayTimers.delete(autoplayTimer);
            autoplayTimer = null;
          };
          const syncAutoplay = () => {
            const autoplayButton = controls.querySelector('[data-workshop-action="autoplay"]');
            autoplayButton.classList.toggle('active', autoplayEnabled);
            autoplayButton.textContent = autoplayEnabled ? 'Ⅱ' : '▶';
            autoplayButton.title = autoplayEnabled
              ? currentImages().length > 1
                ? `关闭 ${autoplayIntervalSeconds} 秒轮播`
                : '轮播已开启；当前仅有一张图片'
              : `开启 ${autoplayIntervalSeconds} 秒轮播`;
            autoplayButton.setAttribute('aria-pressed', String(autoplayEnabled));
            if (!autoplayEnabled || currentImages().length < 2) {
              stopAutoplayTimer();
            } else if (!autoplayTimer) {
              autoplayTimer = setInterval(() => move(1), autoplayIntervalSeconds * 1000);
              workshopAutoplayTimers.add(autoplayTimer);
            }
          };
          const handleAutoplayIntervalChange = event => {
            autoplayIntervalSeconds = Math.min(120, Math.max(3, Number(event.detail?.seconds) || 10));
            stopAutoplayTimer();
            syncAutoplay();
          };
          let autoplayEventTarget = window;
          try {
            autoplayEventTarget = window.top || window.parent || window;
          } catch (e) {
            /* use current window */
          }
          autoplayEventTarget.addEventListener(WORKSHOP_AUTOPLAY_INTERVAL_EVENT, handleAutoplayIntervalChange);
          gallery.__workshopCleanup = () => {
            stopAutoplayTimer();
            autoplayEventTarget.removeEventListener(WORKSHOP_AUTOPLAY_INTERVAL_EVENT, handleAutoplayIntervalChange);
          };
          const render = () => {
            const group = currentImages();
            if (!group.length) return;
            imageIndex = ((imageIndex % group.length) + group.length) % group.length;
            const image = group[imageIndex];
            media.className = 'rb-workshop-media loading';
            loadState.className = 'rb-workshop-load-state';
            loadState.innerHTML =
              '<span class="rb-workshop-spinner" aria-hidden="true"></span><small>正在准备插图…</small>';
            if (!loadState.isConnected) media.appendChild(loadState);
            img.alt = `${player.title} · ${currentPack().name} · ${rating.toUpperCase()}`;
            img.onload = () => {
              media.className = 'rb-workshop-media loaded';
              loadState.remove();
              void bridge.confirmDisplayed({ ...context, imageId: image.id });
            };
            img.onerror = () => {
              media.className = 'rb-workshop-media failed';
              loadState.className = 'rb-workshop-load-state error';
              loadState.innerHTML =
                '<span class="rb-workshop-spinner" aria-hidden="true"></span><small>图片无法显示</small>';
            };
            img.src = urlFor(image);
            caption.textContent = `${player.title} · ${currentPack().name}${currentPack().author ? ' · ' + currentPack().author : ''} · ${rating.toUpperCase()} · ${imageIndex + 1}/${group.length}`;
            updateButtons();
            syncAutoplay();
          };
          const persistPack = () => {
            if (typeof bridge.setPreferredPack === 'function') {
              void bridge.setPreferredPack(player.subjectKey, currentPack().id).catch(() => {});
            }
          };
          const move = delta => {
            imageIndex += delta;
            render();
          };
          controls.addEventListener('click', event => {
            const button = event.target.closest && event.target.closest('[data-workshop-action]');
            if (!button || button.disabled) return;
            event.stopPropagation();
            const action = button.getAttribute('data-workshop-action');
            if (action === 'previous') move(-1);
            else if (action === 'next') move(1);
            else if (action === 'rating') {
              const nextRating = rating === 'sfw' ? 'nsfw' : 'sfw';
              let targetPack = currentPack().images.some(image => image.rating === nextRating)
                ? packIndex
                : player.packs.findIndex(pack => pack.images.some(image => image.rating === nextRating));
              if (targetPack >= 0) {
                packIndex = targetPack;
                rating = nextRating;
                imageIndex = 0;
                persistPack();
                render();
              }
            } else if (action === 'pack') {
              const eligible = player.packs
                .map((pack, index) => ({ pack, index }))
                .filter(item => item.pack.images.some(image => image.rating === rating));
              const position = eligible.findIndex(item => item.index === packIndex);
              packIndex = eligible[(position + 1) % eligible.length].index;
              imageIndex = 0;
              persistPack();
              render();
            } else if (action === 'autoplay') {
              autoplayEnabled = !autoplayEnabled;
              setWorkshopAutoplayPreference(autoplayEnabled);
              syncAutoplay();
            } else if (action === 'fullscreen') {
              void rbImageViewerState?.openFullscreen(img);
            }
          });
          render();
          container.appendChild(gallery);
        } catch (e) {
          container.dataset.workshopMatched = 'false';
          console.warn('[正文美化] 创意工坊选图失败:', e);
        }
      }

      function initWorkshopBridge() {
        const target = window.top || window.parent || window;
        target.addEventListener('cultivation-workshop-ready', () => {
          void updateWorkshopControls();
          void appendWorkshopImages();
        });
        target.addEventListener('cultivation-workshop-library-changed', () => {
          const container = document.getElementById('readingContent');
          if (container) {
            container.querySelectorAll('.rb-workshop-gallery').forEach(node => {
              if (typeof node.__workshopCleanup === 'function') node.__workshopCleanup();
              node.remove();
            });
            container.dataset.workshopMatched = 'false';
          }
          workshopAutoplayTimers.forEach(timer => clearInterval(timer));
          workshopAutoplayTimers.clear();
          workshopObjectUrls.splice(0).forEach(url => URL.revokeObjectURL(url));
          void updateWorkshopControls();
          void appendWorkshopImages();
        });
        void updateWorkshopControls();
        void appendWorkshopImages();
        window.addEventListener('pagehide', () => {
          document.querySelectorAll('.rb-workshop-gallery').forEach(node => {
            if (typeof node.__workshopCleanup === 'function') node.__workshopCleanup();
          });
          workshopAutoplayTimers.forEach(timer => clearInterval(timer));
          workshopAutoplayTimers.clear();
          workshopObjectUrls.splice(0).forEach(url => URL.revokeObjectURL(url));
        });
      }

      // ============== 设置面板开关 ==============
      function initSettingsPanel() {
        const btn = document.getElementById('settingsBtn');
        const panel = document.getElementById('settingsPanel');
        const interval = document.getElementById('workshopAutoplayInterval');
        if (!btn || !panel) return;
        if (interval) {
          interval.value = String(getWorkshopAutoplayInterval());
          interval.addEventListener('change', () => {
            const seconds = setWorkshopAutoplayInterval(interval.value);
            interval.value = String(seconds);
            void updateWorkshopControls();
          });
        }
        btn.addEventListener('click', e => {
          e.stopPropagation();
          panel.classList.toggle('active');
          if (panel.classList.contains('active')) {
            void updateWorkshopControls();
          }
        });
        document.addEventListener('click', e => {
          if (!panel.contains(e.target) && !btn.contains(e.target)) panel.classList.remove('active');
        });
      }

      function initThemeToggle() {
        const btn = document.getElementById('themeToggle');
        if (!btn) return;
        btn.addEventListener('click', () => {
          const cur = document.body.getAttribute('data-theme') || 'dark';
          applyTheme(cur === 'dark' ? 'light' : 'dark');
        });
      }

      // ============== 事件委托：所有 [data-action] 按钮 ==============
      function initEventDelegation() {
        document.body.addEventListener('click', e => {
          const t = e.target && e.target.closest && e.target.closest('[data-action]');
          if (!t) return;
          const action = t.getAttribute('data-action');
          const arg = t.getAttribute('data-arg');
          switch (action) {
            case 'font':
              adjustFontSize(parseInt(arg, 10) || 0);
              break;
            case 'workshop-toggle':
              void toggleWorkshopAutoInsert();
              break;
            case 'workshop-open':
              openWorkshopPanel();
              break;
          }
        });
      }

      // ============== 入口（每个步骤独立 try，互不影响） ==============
      function safeRun(label, fn) {
        try {
          fn();
        } catch (e) {
          console.error('[正文美化] ' + label + ' 失败:', e);
        }
      }

      let _rbBooted = false;
      function rbBoot() {
        if (_rbBooted) return;
        _rbBooted = true;
        // 优先把按钮事件挂上，确保即使后续 init 出错按钮也能用
        safeRun('initEventDelegation', initEventDelegation);
        safeRun('initThemeToggle', initThemeToggle);
        safeRun('initSettingsPanel', initSettingsPanel);
        safeRun('cleanupLegacyAvatarStorage', cleanupLegacyAvatarStorage);
        safeRun('initTheme', initTheme);
        safeRun('initThemeSync', initThemeSync);
        safeRun('initFontSize', initFontSize);
        safeRun('initImageViewer', initImageViewer);
        safeRun('processContent', processContent);
        safeRun('initWorkshopBridge', initWorkshopBridge);
      }

      // 脚本在 body 末尾执行时，body 必然已存在；多数 iframe srcdoc 场景 readyState 已是
      // 'interactive' 或 'complete'。即使是 'loading'，也直接跑（document.body 已可用），
      // 同时保留 DOMContentLoaded 监听作为兜底（避免被某些环境提前触发又错过监听）。
      rbBoot();
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', rbBoot);
      }
    </script>
  </body>
</html>
