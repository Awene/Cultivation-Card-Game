<plot_inspiration type="城镇">
【坊市商贸】：参加拍卖会；逛路边摊；浏览当地特色商品；进入幻境隐蔽中的黑市，买卖违禁品；赌场/斗兽场的赌博
【红尘风月】：游览青楼/风月场所，体验歌舞/侍奉/幻境/双修；进入幻境隐蔽中的贵客区域，体验特殊玩法
【灵膳雅集】：品尝特色美食/美酒/灵茶/妖兽料理/药膳；参与雅集/诗酒会/论道
【市井奇遇】：偶遇算命先生/纨绔/道长/僧人/猎户/乞丐/崇拜者/推销员/艺人/赏金猎人/逃婚仙子；捡到他人遗落的信物
【风媒探讯】：听闻修仙界近期大事；查看悬赏榜单；意外打听到仇家或异宝的下落
【红尘百态】：说书/皮影戏/相声/杂耍/歌舞/戏曲/婚礼/寿宴/丧礼/祭祀/庙会；恰逢城镇特色节日与民俗活动
【权贵威仪】：偶遇世家大族/仙子出行；目睹执法队当街追捕通缉犯；受邀拜会当地城主/豪强
